    function isHeroGrounded() {
      // Simple contact-based check: hero is grounded if touching any body
      return heroContactCount > 0;
    }

    function updateHeroContactCount() {
      if (!heroBody) {
        heroContactCount = 0;
        return;
      }
      // Count contacts on hero body
      let count = 0;
      try {
        let ce = heroBody.GetContactList();
        let maxIter = 100; // Safety limit
        while (ce && maxIter-- > 0) {
          const contact = ce.get_contact ? ce.get_contact() : null;
          if (contact && contact.IsTouching && contact.IsTouching()) {
            count++;
          }
          ce = ce.get_next ? ce.get_next() : null;
        }
      } catch (e) {
        // Box2D contact iteration failed
        count = 0;
      }
      heroContactCount = count;
    }

    function updateHeroStatusUI() {
      const ui = document.getElementById('hero-status-ui');
      if (!ui || !heroBody) return;

      try {
        const noGravity = !heroHasGravity;
        const mass = heroBody.GetMass ? heroBody.GetMass() : 1;
        const vel = heroBody.GetLinearVelocity ? heroBody.GetLinearVelocity() : null;
        const speed = vel ? Math.sqrt(vel.get_x() ** 2 + vel.get_y() ** 2) : 0;

        // G.force = mass × (impulse + 1)
        const gforce = (mass * (speed + 1)).toFixed(1);

        // CAN JUMP = heroCanJump AND (пробел не зажат ИЛИ зажат < 1.5 сек)
        const holdTime = spaceHeld ? (performance.now() - spaceDownTime) / 1000 : 0;
        const canJumpNow = heroCanJump && (!spaceHeld || holdTime < 1.5);

        // Pull force %
        const pullForcePercent = Math.round(heroThrustMultiplier * 100);

        const items = ui.querySelectorAll('.status-item');
        items.forEach(item => {
          const status = item.dataset.status;
          let isTrue = false;
          switch (status) {
            case 'nogravity': isTrue = noGravity; break;
            case 'canjump': isTrue = canJumpNow; break;
            case 'overload':
              item.textContent = `OVERLOAD: ${overload}`;
              isTrue = parseFloat(overload) > 1;
              break;
            case 'pullforce':
              item.textContent = `PULL FORCE: ${pullForcePercent}%`;
              isTrue = heroThrustMultiplier > heroThrustMin;
              break;
          }
          item.classList.toggle('true', isTrue);
          item.classList.toggle('false', !isTrue);
        });

        // Update hold timer popup возле героя
        const holdTimerEl = document.getElementById('hero-hold-timer');
        if (holdTimerEl && heroBody) {
          if (spaceHeld && holdTime > 0) {
            const pos = heroBody.GetPosition();
            const screen = worldToScreen(pos.get_x(), pos.get_y());
            holdTimerEl.style.left = screen.x + 'px';
            holdTimerEl.style.top = (screen.y - 30) + 'px';  // Над героем
            holdTimerEl.textContent = holdTime.toFixed(2) + 's';
            holdTimerEl.classList.add('active');
          } else {
            holdTimerEl.classList.remove('active');
          }
        }
      } catch (e) {
        // Status UI update failed
      }

      // Update REC HUD bars based on hero state
      updateRecHUD();
    }

    // Update REC HUD bars (Health, Air, Force)
    function updateRecHUD() {
      const hud = document.getElementById('rec-hud');
      if (!hud || !heroBody) return;

      try {
        // Calculate values based on hero physics state
        const vel = heroBody.GetLinearVelocity ? heroBody.GetLinearVelocity() : null;
        const speed = vel ? Math.sqrt(vel.get_x() ** 2 + vel.get_y() ** 2) : 0;

        // Health: decreases with impacts/collisions (simulated by contact count)
        // For now, use a simple decay based on landing impacts
        if (!window.heroHealth) window.heroHealth = 100;
        if (heroContactCount > 2 && speed > 5) {
          window.heroHealth = Math.max(0, window.heroHealth - 0.5);
        } else if (window.heroHealth < 100) {
          window.heroHealth = Math.min(100, window.heroHealth + 0.1); // Slow regen
        }

        // Air: decreases while in water (liquid contact), regen in air
        if (!window.heroAir) window.heroAir = 100;
        // Simulate: decrease if moving fast (exertion), regen when slow
        if (speed > 10) {
          window.heroAir = Math.max(0, window.heroAir - 0.3);
        } else {
          window.heroAir = Math.min(100, window.heroAir + 0.2);
        }

        // Force/Energy: based on available thrust, decreases with jumps
        if (!window.heroForce) window.heroForce = 100;
        if (spaceHeld && !heroCanJump) {
          window.heroForce = Math.max(0, window.heroForce - 0.8);
        } else {
          window.heroForce = Math.min(100, window.heroForce + 0.15);
        }

        // Update bar fills
        const bars = hud.querySelectorAll('.rec-bar');
        bars.forEach(bar => {
          const type = bar.dataset.type;
          const fill = bar.querySelector('.bar-fill');
          if (!fill) return;

          let value = 75;
          switch (type) {
            case 'health': value = window.heroHealth; break;
            case 'air': value = window.heroAir; break;
            case 'force': value = window.heroForce; break;
          }
          fill.style.height = `${value}%`;
        });
      } catch (e) {
        // REC HUD update failed silently
      }
    }

    // Get current gravity direction acting on hero (normalized)
    function getHeroGravityDirection() {
      if (!heroBody) return null;
      const pos = heroBody.GetPosition();
      const hx = pos.get_x();
      const hy = pos.get_y();

      let totalDx = 0, totalDy = 0;

      // Check pointer gravity (Ctrl held)
      if (gravityEnabled) {
        totalDx += pointer.x - hx;
        totalDy += pointer.y - hy;
      }

      // Check shape gravity sources — единая гравитация к поверхности.
      // Вклад каждого источника взвешен его ускорением: доминирует ближний/сильный.
      let terrainDone = false;
      shapeGravityBodies.forEach(sourceBlock => {
        if (!sourceBlock.body) return;
        if (sourceBlock.isTerrain) {
          if (terrainDone) return;  // terrain-группа считается один раз
          terrainDone = true;
        }
        const grav = calculateSurfaceGravity({ x: hx, y: hy }, sourceBlock);
        if (grav) {
          totalDx += grav.direction.x * grav.accel;
          totalDy += grav.direction.y * grav.accel;
        }
      });

      const len = Math.sqrt(totalDx * totalDx + totalDy * totalDy);
      if (len < 0.01) return null; // No gravity
      return { x: totalDx / len, y: totalDy / len };
    }

    function applyHeroMovement() {
      if (!heroBody || !simulateMode || !heroSpawned) return;

      // Track if any continuous action is happening
      const isRotating = heroKeys.rotateLeft || heroKeys.rotateRight;
      const isThrusting = spaceHeld;
      const isContinuousAction = isRotating || isThrusting;

      // Update acting state (blocks regen while active)
      setActing(isContinuousAction);

      // ROTATION - with angular velocity limit and ramp-up
      const maxAngVel = getHeroMaxAngularVel();
      const currentAngVel = heroBody.GetAngularVelocity();

      if (isRotating) {
        // Рост силы при удержании (1.0 → 1.5)
        heroRotateMultiplier = Math.min(heroRotateMax, heroRotateMultiplier + heroRotateGrowth);
      } else {
        // Плавное угасание до минимума
        heroRotateMultiplier = Math.max(heroRotateMin, heroRotateMultiplier - heroRotateDecay);
      }

      const rotateSpeed = getHeroRotateSpeed();

      if (heroKeys.rotateLeft) {
        if (currentAngVel < maxAngVel) {
          if (spendStamina(1 / 60)) {
            heroBody.ApplyTorque(rotateSpeed, true);
          }
        }
      }
      if (heroKeys.rotateRight) {
        if (currentAngVel > -maxAngVel) {
          if (spendStamina(1 / 60)) {
            heroBody.ApplyTorque(-rotateSpeed, true);
          }
        }
      }

      // Space held = thrust toward gravity source
      // Тяга начинается через 0.4 сек, нарастает с 10% до 100%
      if (spaceHeld) {
        const holdTime = (performance.now() - spaceDownTime) / 1000;

        if (holdTime >= heroThrustDelay) {
          // Нарастание силы тяги
          heroThrustMultiplier = Math.min(heroThrustMax, heroThrustMultiplier + heroThrustGrowth);

          const gravDir = getHeroGravityDirection();
          if (gravDir) {
            if (spendStamina(10.5 / 60 * heroThrustMultiplier)) {
              const thrustForce = getHeroJumpImpulse() * 2 * heroThrustMultiplier;
              heroBody.ApplyForceToCenter(getVec2(gravDir.x * thrustForce, gravDir.y * thrustForce), true);
            }
          }
        }
      } else {
        // Сброс силы тяги сразу при отпускании
        heroThrustMultiplier = heroThrustMin;
      }
    }

    function doHeroJump(holdTimeMs = 0) {
      if (!heroBody || !heroCanJump) return;

      // Сила прыжка от времени нажатия:
      // 0мс = 30%, 0.5сек = 100%, 1.5сек = 150%
      const holdSec = holdTimeMs / 1000;
      let jumpPower;
      if (holdSec <= 0.5) {
        // 0→0.5с: 30%→100%
        jumpPower = 0.3 + (holdSec / 0.5) * 0.7;
      } else {
        // 0.5→1.5с: 100%→150%
        jumpPower = 1.0 + ((holdSec - 0.5) / 1.0) * 0.5;
      }
      jumpPower = Math.min(1.5, jumpPower);

      // Spend stamina for jump (пропорционально силе)
      if (!spendStamina(25 * jumpPower)) return;

      const heroAngle = heroBody.GetAngle();
      const cos = Math.cos(heroAngle);
      const sin = Math.sin(heroAngle);
      const jumpImpulse = getHeroJumpImpulse() * jumpPower;
      heroBody.ApplyLinearImpulse(getVec2(-sin * jumpImpulse, cos * jumpImpulse), heroBody.GetWorldCenter(), true);
      heroCanJump = false;
    }

    function teleportHero(x, y) {
      if (!heroBody) return;
      const pos = getVec2(x, y);
      heroBody.SetTransform(pos, 0);
      heroBody.SetLinearVelocity(getVec2(0, 0));
    }

    // Camera state for smooth follow
    let cameraPanX = 0;
    let cameraPanY = 0;
    let cameraAngle = 0;       // Current camera rotation (radians)
    let targetCameraAngle = 0; // Target camera rotation

    function updateCameraFollowHero() {
      if (!heroBody || !simulateMode || !heroSpawned) return;

      const pos = heroBody.GetPosition();
      const vel = heroBody.GetLinearVelocity();
      const hx = pos.get_x();
      const hy = pos.get_y();
      const vx = vel.get_x();
      const vy = vel.get_y();

      // === CAMERA ORIENTATION ===
      // Find the dominant gravity source and orient camera so "down" points toward it
      let gravityDirX = 0;
      let gravityDirY = -1; // Default: down is -Y (standard)
      let hasGravitySource = false;

      // Skip pointer gravity for camera rotation - only use shape gravity
      // Check shape gravity sources - find the closest one
      // For terrain: use direction to surface, not center!
      if (shapeGravityBodies.size > 0) {
        let closestDist = Infinity;
        let terrainDone = false;
        shapeGravityBodies.forEach(sourceBlock => {
          if (!sourceBlock.body) return;
          if (sourceBlock.isTerrain) {
            if (terrainDone) return;  // terrain-группа считается один раз
            terrainDone = true;
          }
          // Единая гравитация: направление к ближайшей точке ПОВЕРХНОСТИ
          const grav = calculateSurfaceGravity({ x: hx, y: hy }, sourceBlock);
          if (grav && grav.distance < closestDist) {
            closestDist = grav.distance;
            gravityDirX = grav.direction.x;
            gravityDirY = grav.direction.y;
            hasGravitySource = true;
          }
        });
      }

      // Calculate target angle if we have a gravity source
      if (hasGravitySource && (gravityDirX !== 0 || gravityDirY !== 0)) {
        // Angle from hero to gravity source
        // We want "down" (screen bottom) to point toward gravity source
        // atan2 gives angle from +X axis, we need to adjust so gravity dir points down
        targetCameraAngle = Math.atan2(gravityDirX, -gravityDirY);
      } else {
        // No gravity source - return to upright
        targetCameraAngle = 0;
      }

      // Smooth angle interpolation (handle wraparound)
      let angleDiff = targetCameraAngle - cameraAngle;
      // Normalize to [-PI, PI]
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      cameraAngle += angleDiff * 0.08; // Smooth rotation

      // Apply camera rotation to global rotationAngle
      rotationAngle = cameraAngle;

      // === CAMERA POSITION ===
      // Look-ahead: offset camera slightly in direction of movement
      const lookAheadX = vx * 0.15;
      const lookAheadY = vy * 0.15;

      // Target position (with look-ahead)
      const targetX = -(hx + lookAheadX) * tileSize * zoom;
      const targetY = (hy + lookAheadY) * tileSize * zoom;

      // Exponential smoothing (lerp) - more responsive than before
      const smoothX = 0.12;
      const smoothY = 0.10;

      cameraPanX += (targetX - cameraPanX) * smoothX;
      cameraPanY += (targetY - cameraPanY) * smoothY;

      panX = cameraPanX;
      panY = cameraPanY;
    }

    function drawHero() {
      if (!heroBody || !simulateMode || !heroSpawned) return;

      const pos = heroBody.GetPosition();
      const angle = heroBody.GetAngle();
      const screen = worldToScreen(pos.get_x(), pos.get_y());
      const sizePx = selectedHeroSize * scaledTileSize;
      const halfSize = sizePx / 2;
      const shape = window.currentHeroShape || { type: 'primitive', primitive: 'box' };

      ctx.save();
      ctx.translate(screen.x, screen.y);
      ctx.rotate(-angle + rotationAngle);

      // Hero gradient using selected color or shape color
      const baseColor = shape.color || selectedHeroColor;
      const darkerColor = shadeColor(baseColor, -30);
      const lighterColor = shadeColor(baseColor, 30);
      const gradient = ctx.createLinearGradient(-halfSize, -halfSize, halfSize, halfSize);
      gradient.addColorStop(0, baseColor);
      gradient.addColorStop(0.5, lighterColor);
      gradient.addColorStop(1, darkerColor);

      ctx.fillStyle = gradient;
      // Без glow
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;

      // Draw based on shape type
      if (shape.id === 'circle') {
        // Circle: draw as smooth arc (visually), but physics uses 16-gon
        ctx.beginPath();
        ctx.arc(0, 0, halfSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = baseColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        // Circle "eyes"
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        const eyeSize = sizePx * 0.12;
        ctx.beginPath();
        ctx.arc(-halfSize * 0.35, -halfSize * 0.2, eyeSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(halfSize * 0.35, -halfSize * 0.2, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      } else if (shape.vertices && shape.vertices.length >= 3) {
        // Polygon shape
        ctx.beginPath();
        shape.vertices.forEach((v, i) => {
          const x = v.x * sizePx, y = -v.y * sizePx;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = baseColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        // Polygon "eyes" near top
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        const eyeSize = sizePx * 0.1;
        ctx.beginPath();
        ctx.arc(-halfSize * 0.25, -halfSize * 0.15, eyeSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(halfSize * 0.25, -halfSize * 0.15, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Default box
        ctx.fillRect(-halfSize, -halfSize, sizePx, sizePx);
        ctx.strokeStyle = baseColor;
        ctx.lineWidth = 2;
        ctx.strokeRect(-halfSize, -halfSize, sizePx, sizePx);
        // Box "eyes"
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        const eyeSize = sizePx * 0.15;
        const eyeY = -halfSize * 0.3;
        ctx.fillRect(-halfSize * 0.4 - eyeSize/2, eyeY - eyeSize/2, eyeSize, eyeSize);
        ctx.fillRect(halfSize * 0.4 - eyeSize/2, eyeY - eyeSize/2, eyeSize, eyeSize);
      }

      ctx.restore();
    }

    function drawHeroPreview() {
      if (!simulateMode || heroSpawned || !heroPreviewPos) return;

      const screen = worldToScreen(heroPreviewPos.x, heroPreviewPos.y);
      const sizePx = selectedHeroSize * scaledTileSize;
      const halfSize = sizePx / 2;
      const shape = window.selectedHeroShape || { type: 'primitive', primitive: 'box' };
      const baseColor = shape.color || selectedHeroColor;

      ctx.save();
      ctx.translate(screen.x, screen.y);
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = baseColor;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);

      // Create gradient for nicer preview
      const gradient = ctx.createLinearGradient(-halfSize, -halfSize, halfSize, halfSize);
      gradient.addColorStop(0, baseColor + '40');
      gradient.addColorStop(1, baseColor + '20');

      // Draw preview based on shape type
      if (shape.id === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, halfSize, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.stroke();
      } else if (shape.vertices && shape.vertices.length >= 3) {
        ctx.beginPath();
        shape.vertices.forEach((v, i) => {
          const x = v.x * sizePx, y = -v.y * sizePx;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.fillStyle = gradient;
        ctx.fillRect(-halfSize, -halfSize, sizePx, sizePx);
        ctx.strokeRect(-halfSize, -halfSize, sizePx, sizePx);
      }

      ctx.setLineDash([]);

      // Show size label
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 3;
      ctx.fillText(selectedHeroSize.toFixed(1), 0, halfSize + 8);

      ctx.restore();
    }

    // ═══���════════════════���════════════════════════════════════════���═════════
    // SLICING SYSTEM
    // ═══════════════════════════════════════════════════════════════════════

    function sliceBlocksWithLine(x1, y1, x2, y2) {

      const toBeSliced = [];
      const toBeCreated = [];

      state.blocks.forEach(block => {
        if (!block.body) return;

        const body = block.body;

        // Use block.vertices (the original polygon outline) instead of fixture vertices
        // This is critical for multi-fixture shapes like circles (made of many triangles)
        const localVerts = block.vertices;
        if (!localVerts || localVerts.length < 3) return;

        // Scale and transform vertices to world coords
        const blockSize = block.size;
        const pointsArray = [];
        for (const v of localVerts) {
          // Vertices are normalized (-0.5 to 0.5), scale by block size
          const scaledX = v.x * blockSize;
          const scaledY = v.y * blockSize;
          const worldPt = body.GetWorldPoint(getVec2(scaledX, scaledY));
          pointsArray.push(worldPt.get_x(), worldPt.get_y());
        }

        try {
          const slicedPolygons = PolyK.Slice(pointsArray, x1, y1, x2, y2);
          if (slicedPolygons.length > 1) {
            const blockPos = body.GetPosition();
            const blockAngle = body.GetAngle();
            const blockSize = block.size;

            const texSize = Math.ceil(blockSize * tileSize);
            const srcCanvas = document.createElement('canvas');
            srcCanvas.width = texSize;
            srcCanvas.height = texSize;
            const srcCtx = srcCanvas.getContext('2d');

            const color = block.color || '#4ECDC4';
            // Solid color fill (no gradient)
            srcCtx.fillStyle = color;
            srcCtx.fillRect(0, 0, texSize, texSize);

            if (block.tile_ID > 0 && tiles[block.tile_ID]) {
              srcCtx.drawImage(tiles[block.tile_ID], 0, 0, texSize, texSize);
            }

            toBeSliced.push(block);

            slicedPolygons.forEach(points => {
              const clipped = createClippedTexture(srcCanvas, blockSize, points, blockPos.get_x(), blockPos.get_y(), blockAngle);
              const vel = getBodyLinearVelocity(body);
              const angVel = body.GetAngularVelocity();
              toBeCreated.push({
                points,
                color: hexToRgb(color),
                vel: { x: vel.get_x(), y: vel.get_y() },
                angVel,
                texture: clipped?.canvas || null,
                texBounds: clipped?.bounds || null
              });
            });
          }
        } catch (e) {}
      });

      // Slice debris too
      const debrisToSlice = [];
      debris.forEach((d, index) => {
        if (!d.body) return;

        const body = d.body;
        const pos = body.GetPosition();
        const angle = body.GetAngle();

        const pointsArray = [];
        for (const v of d.verts) {
          const cos = Math.cos(angle);
          const sin = Math.sin(angle);
          pointsArray.push(
            pos.get_x() + v.x * cos - v.y * sin,
            pos.get_y() + v.x * sin + v.y * cos
          );
        }

        try {
          const slicedPolygons = PolyK.Slice(pointsArray, x1, y1, x2, y2);
          if (slicedPolygons.length > 1) {
            debrisToSlice.push({ index, d });

            const debrisPos = { x: pos.get_x(), y: pos.get_y() };

            slicedPolygons.forEach(points => {
              const vel = getBodyLinearVelocity(body);
              const angVel = body.GetAngularVelocity();

              // Use debris texture if available
              let clipped = null;
              if (d.texture && d.texBounds) {
                clipped = createClippedTextureFromDebris(d.texture, d.texBounds, points, debrisPos, angle);
              }

              toBeCreated.push({
                points,
                color: d.color,
                vel: { x: vel.get_x(), y: vel.get_y() },
                angVel,
                texture: clipped?.canvas || null,
                texBounds: clipped?.bounds || null
              });
            });
          }
        } catch (e) {}
      });

      // Remove sliced debris
      debrisToSlice.sort((a, b) => b.index - a.index);
      debrisToSlice.forEach(({ index, d }) => {
        state.world.DestroyBody(d.body);
        debris.splice(index, 1);
      });

      // Remove sliced blocks
      toBeSliced.forEach(block => removeBlock(block, false));

      // Create new debris pieces
      toBeCreated.forEach(({ points, color, vel, angVel, texture, texBounds }) => {
        if (points.length < 6) return;

        const vertices = [];
        for (let i = 0; i < points.length / 2; i++) {
          vertices.push({ x: points[i * 2], y: points[i * 2 + 1] });
        }

        try {
          // Calculate proper polygon centroid (center of mass)
          const centroid = calculatePolygonCentroid(vertices);
          const cx = centroid.x;
          const cy = centroid.y;

          const body = createDynamicBody(state.world, cx, cy, {
            linearDamping: 0,
            angularDamping: 0
          });

          const localVerts = vertices.map(v => ({ x: v.x - cx, y: v.y - cy }));

          // Triangulate for complex polygons (Box2D max 8 vertices per fixture)
          if (localVerts.length > 8) {
            const flat = localVerts.flatMap(v => [v.x, v.y]);
            try {
              const indices = PolyK.Triangulate(flat);
              for (let i = 0; i < indices.length; i += 3) {
                const tri = [
                  localVerts[indices[i]],
                  localVerts[indices[i + 1]],
                  localVerts[indices[i + 2]]
                ];
                addPolygonFixture(body, tri, { density: 2, friction: 0.8, restitution: 0.1 });
              }
            } catch (e) {
              // Fallback: try adding as single fixture (may fail for complex shapes)
              addPolygonFixture(body, localVerts.slice(0, 8), { density: 2, friction: 0.8, restitution: 0.1 });
            }
          } else {
            addPolygonFixture(body, localVerts, { density: 2, friction: 0.8, restitution: 0.1 });
          }

          body.SetLinearVelocity(getVec2(vel.x, vel.y));
          if (angVel) body.SetAngularVelocity(angVel);

          setBodyUserData(body, { type: 'debris' });

          let localTexBounds = null;
          if (texBounds) {
            localTexBounds = {
              minX: texBounds.minX - cx,
              maxX: texBounds.maxX - cx,
              minY: texBounds.minY - cy,
              maxY: texBounds.maxY - cy,
              width: texBounds.width,
              height: texBounds.height
            };
          }

          debris.push({
            body,
            color,
            verts: localVerts,
            texture,
            texBounds: localTexBounds
          });
        } catch (e) {}
      });

      if (toBeSliced.length > 0 || debrisToSlice.length > 0) {
        captureStateDeferred();
      }
    }

    function createClippedTexture(sourceTexture, sourceSize, polyPoints, sourceOriginX, sourceOriginY, sourceAngle) {
      // polyPoints is flat array [x0,y0,x1,y1,...] in world coords
      const texScale = tileSize;

      // Find bounding box of polygon
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < polyPoints.length; i += 2) {
        minX = Math.min(minX, polyPoints[i]);
        maxX = Math.max(maxX, polyPoints[i]);
        minY = Math.min(minY, polyPoints[i + 1]);
        maxY = Math.max(maxY, polyPoints[i + 1]);
      }

      const width = Math.ceil((maxX - minX) * texScale);
      const height = Math.ceil((maxY - minY) * texScale);
      if (width <= 0 || height <= 0) return null;

      const texCanvas = document.createElement('canvas');
      texCanvas.width = width;
      texCanvas.height = height;
      const texCtx = texCanvas.getContext('2d');

      // Create clip path
      texCtx.beginPath();
      for (let i = 0; i < polyPoints.length; i += 2) {
        const px = (polyPoints[i] - minX) * texScale;
        const py = (maxY - polyPoints[i + 1]) * texScale;
        if (i === 0) texCtx.moveTo(px, py);
        else texCtx.lineTo(px, py);
      }
      texCtx.closePath();
      texCtx.clip();

      // Draw source texture transformed to match world position
      texCtx.save();
      const srcX = (sourceOriginX - minX) * texScale;
      const srcY = (maxY - sourceOriginY) * texScale;
      texCtx.translate(srcX, srcY);
      texCtx.rotate(-sourceAngle);
      const halfSize = sourceSize * texScale / 2;
      texCtx.drawImage(sourceTexture, -halfSize, -halfSize, sourceSize * texScale, sourceSize * texScale);
      texCtx.restore();

      return {
        canvas: texCanvas,
        bounds: { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY }
      };
    }

    function createClippedTextureFromDebris(srcTexture, srcBounds, polyPoints, debrisPos, debrisAngle) {
      const texScale = tileSize;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < polyPoints.length; i += 2) {
        minX = Math.min(minX, polyPoints[i]);
        maxX = Math.max(maxX, polyPoints[i]);
        minY = Math.min(minY, polyPoints[i + 1]);
        maxY = Math.max(maxY, polyPoints[i + 1]);
      }

      const width = Math.ceil((maxX - minX) * texScale);
      const height = Math.ceil((maxY - minY) * texScale);
      if (width <= 0 || height <= 0 || !srcBounds) return null;

      const texCanvas = document.createElement('canvas');
      texCanvas.width = width;
      texCanvas.height = height;
      const texCtx = texCanvas.getContext('2d');

      // Create clip path
      texCtx.beginPath();
      for (let i = 0; i < polyPoints.length; i += 2) {
        const px = (polyPoints[i] - minX) * texScale;
        const py = (maxY - polyPoints[i + 1]) * texScale;
        if (i === 0) texCtx.moveTo(px, py);
        else texCtx.lineTo(px, py);
      }
      texCtx.closePath();
      texCtx.clip();

      // Draw parent debris texture
      texCtx.save();
      const cx = (debrisPos.x - minX) * texScale;
      const cy = (maxY - debrisPos.y) * texScale;
      texCtx.translate(cx, cy);
      texCtx.rotate(-debrisAngle);
      const drawX = srcBounds.minX * texScale;
      const drawY = -srcBounds.maxY * texScale;
      texCtx.drawImage(srcTexture, drawX, drawY);
      texCtx.restore();

      return {
        canvas: texCanvas,
        bounds: { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY }
      };
    }

    // ═══════════════════════════════════════════════════════════════════════
    // FIND HELPERS
    // ═══════════════════════════════════════════════════════════════════════

    function findClosestBlock(wx, wy, maxDist) {
      let closest = null;
      let minDist = maxDist;

      state.blocks.forEach(block => {
        if (!block.body) return;
        const pos = block.body.GetPosition();
        const dist = Math.hypot(pos.get_x() - wx, pos.get_y() - wy);
        if (dist < minDist) {
          minDist = dist;
          closest = block;
        }
      });

      return closest;
    }

    function findClosestLight(wx, wy, maxDist) {
      let closest = null;
      let minDist = maxDist;

      state.lights.forEach(light => {
        if (!light.body) return;
        const pos = light.body.GetPosition();
        const dist = Math.hypot(pos.get_x() - wx, pos.get_y() - wy);
        if (dist < minDist) {
          minDist = dist;
          closest = light;
        }
      });

      return closest;
    }

    function findClosestBody(wx, wy, maxDist) {
      let closest = null;
      let minDist = maxDist;

      [...state.blocks, ...state.lights].forEach(obj => {
        if (!obj.body) return;
        const pos = obj.body.GetPosition();
        const dist = Math.hypot(pos.get_x() - wx, pos.get_y() - wy);
        if (dist < minDist) {
          minDist = dist;
          closest = obj.body;
        }
      });

      return closest;
    }

    function getClosestEdge(block, wx, wy) {
      if (!block || !block.body) return -1;

      const pos = block.body.GetPosition();
      const angle = block.body.GetAngle();
      const halfSize = block.size / 2;

      const corners = [
        { x: -halfSize, y: -halfSize },
        { x: halfSize, y: -halfSize },
        { x: halfSize, y: halfSize },
        { x: -halfSize, y: halfSize }
      ];

      let closestEdge = 0;
      let minDist = Infinity;

      for (let i = 0; i < 4; i++) {
        const c1 = corners[i];
        const c2 = corners[(i + 1) % 4];
        const midX = (c1.x + c2.x) / 2;
        const midY = (c1.y + c2.y) / 2;

        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const worldMidX = pos.get_x() + midX * cos - midY * sin;
        const worldMidY = pos.get_y() + midX * sin + midY * cos;

        const dist = Math.hypot(worldMidX - wx, worldMidY - wy);
        if (dist < minDist) {
          minDist = dist;
          closestEdge = i;
        }
      }

      return closestEdge;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ERASER TOOL
    // ═══════════���═══════════════════════════════════════════════════════════

    function eraseAtPosition(wx, wy) {
      const eraserRadius = eraserSize;

      // Erase blocks
      if (eraseBlocks) {
        for (let i = state.blocks.length - 1; i >= 0; i--) {
          const block = state.blocks[i];
          if (!block.body) continue;
          const pos = block.body.GetPosition();
          const dist = Math.hypot(pos.get_x() - wx, pos.get_y() - wy);
          if (dist < eraserRadius + block.size / 2) {
            removeBlock(block, true);
          }
        }
      }

      // Erase lights
      if (eraseLights) {
        for (let i = state.lights.length - 1; i >= 0; i--) {
          const light = state.lights[i];
          if (!light.body) continue;
          const pos = light.body.GetPosition();
          const dist = Math.hypot(pos.get_x() - wx, pos.get_y() - wy);
          if (dist < eraserRadius + 0.4) {
            removeLight(light);
          }
        }
      }

      // Erase joints - DISABLED (WASM GetAnchorA/B broken)
      /*
      if (eraseJoints && state.world) {
        let joint = state.world.GetJointList();
        while (joint) {
          const nextJoint = joint.GetNext();
          const anchorA = joint.GetAnchorA();
          const anchorB = joint.GetAnchorB();

          const midX = (anchorA.get_x() + anchorB.get_x()) / 2;
          const midY = (anchorA.get_y() + anchorB.get_y()) / 2;
          const dist = Math.hypot(midX - wx, midY - wy);
          if (dist < eraserRadius) {
            state.world.DestroyJoint(joint);
          }
          joint = nextJoint;
        }
      }
      */

      // Erase debris
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        if (!d.body) continue;
        const pos = d.body.GetPosition();
        const dist = Math.hypot(pos.get_x() - wx, pos.get_y() - wy);
        if (dist < eraserRadius) {
          state.world.DestroyBody(d.body);
          debris.splice(i, 1);
        }
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // HISTORY SYSTEM
    // ═══════════════════════════════════════════════════════════════════════

    let captureTimeout = null;

    function captureStateDeferred() {
      if (captureTimeout) clearTimeout(captureTimeout);
      captureTimeout = setTimeout(() => {
        captureState();
        captureTimeout = null;
      }, 100);
    }

    function captureState() {
      if (!canvas.width || !canvas.height) return;

      // Just screenshot - fast!
      const snapshot = canvas.toDataURL('image/png');

      // Serialize scene data for restore
      const sceneData = serializeScene();
      sceneData.snapshot = snapshot;
      sceneData.timestamp = Date.now();

      // Add to history
      if (currentHistoryIndex < history.length - 1) {
        history.splice(currentHistoryIndex + 1);
      }

      history.push(sceneData);
      if (history.length > MAX_HISTORY) {
        history.shift();
      }

      currentHistoryIndex = history.length - 1;
      updateHistoryDisplay();
      updateHistoryNavButtons();
    }

    function updateHistoryDisplay() {
      // Only update Tweakpane history display (legacy HTML removed)
      updateTweakpaneHistory();
    }

    function updateTweakpaneHistory() {
      const container = tpPanes.historyContainer;
      if (!container) return;

      // Update frame counter
      if (tpPanes.historyBlade) {
        tpPanes.historyBlade.value = `${history.length} / ${MAX_HISTORY}`;
      }

      // Clear and rebuild thumbnails
      container.innerHTML = '';

      history.forEach((entry, i) => {
        const frame = document.createElement('div');
        frame.style.cssText = `
          width: 60px;
          height: 45px;
          border: 2px solid ${i === currentHistoryIndex ? '#4fc3f7' : 'rgba(255,255,255,0.2)'};
          border-radius: 4px;
          overflow: hidden;
          cursor: pointer;
          position: relative;
          flex-shrink: 0;
          ${i === currentHistoryIndex ? 'box-shadow: 0 0 8px rgba(79, 195, 247, 0.5);' : ''}
        `;

        if (entry.snapshot) {
          const img = document.createElement('img');
          img.src = entry.snapshot;
          img.style.cssText = 'width: 100%; height: 100%; object-fit: cover;';
          frame.appendChild(img);
        }

        // Frame number
        const num = document.createElement('div');
        num.style.cssText = `
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          background: linear-gradient(transparent, rgba(0,0,0,0.8));
          color: white;
          font-size: 9px;
          text-align: center;
          padding: 2px;
        `;
        num.textContent = i + 1;
        frame.appendChild(num);

        frame.addEventListener('click', () => restoreState(i));
        container.appendChild(frame);
      });

      // Scroll to current frame
      const currentFrame = container.children[currentHistoryIndex];
      if (currentFrame) {
        currentFrame.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    }

    function updateHistoryNavButtons() {
      // Legacy HTML buttons removed - Tweakpane handles this now
    }

    function restoreState(index) {
      if (index < 0 || index >= history.length) return;
      currentHistoryIndex = index;
      const snapshot = history[index];
      rebuildWorld(snapshot);
      updateHistoryDisplay();
      updateHistoryNavButtons();
      draw();
    }

    let lastHistoryNav = 0;
    const HISTORY_NAV_DELAY = 75; // 0.075 секунды

    function historyBack() {
      const now = Date.now();
      if (now - lastHistoryNav < HISTORY_NAV_DELAY) return;
      lastHistoryNav = now;
      if (currentHistoryIndex > 0) {
        restoreState(currentHistoryIndex - 1);
      }
    }

    function historyForward() {
      const now = Date.now();
      if (now - lastHistoryNav < HISTORY_NAV_DELAY) return;
      lastHistoryNav = now;
      if (currentHistoryIndex < history.length - 1) {
        restoreState(currentHistoryIndex + 1);
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SAVE / LOAD v2 - Clean serialization based on working legacy code
    // ═══════════════════════════════════════════════════════════════════════

    function serializeScene() {
      // Blocks - simple and direct
      const blocks = state.blocks.map(block => {
        if (!block.body) return null;
        const pos = block.body.GetPosition();
        const vel = getBodyLinearVelocity(block.body);
        const data = {
          uid: block.uid,
          position: { x: pos.get_x(), y: pos.get_y() },
          angle: block.body.GetAngle(),
          velocity: vel ? { x: vel.get_x(), y: vel.get_y() } : { x: 0, y: 0 },
          angularVelocity: block.body.GetAngularVelocity(),
          color: block.color,
          size: block.size,
          shape: block.shape ?? 'box',
          shapeId: block.shapeId ?? 'box',
          tile_ID: block.tile_ID,
          isWall: block.isWall,
          integrity: block.integrity,
          burned: block.burned
        };
        // Polygon: save vertices and triangles for physics reconstruction
        if (block.shape === 'polygon' && block.vertices) {
          data.vertices = block.vertices;
          // Also save triangles from catalog to avoid re-triangulation issues
          const catalogShape = window.shapeCatalog?.find(s => s.id === block.shapeId);
          if (catalogShape?.triangles) {
            data.triangles = catalogShape.triangles;
          }
        }
        // Per-block gravity properties
        if (block.gravity) {
          data.gravity = block.gravity;
        }
        // Terrain flag
        if (block.isTerrain) {
          data.isTerrain = true;
        }
        return data;
      }).filter(Boolean);

      // Lights - simple and direct
      const lights = state.lights.map(light => {
        if (!light.body) return null;
        const pos = light.body.GetPosition();
        const vel = getBodyLinearVelocity(light.body);
        return {
          position: { x: pos.get_x(), y: pos.get_y() },
          angle: light.angle,
          velocity: vel ? { x: vel.get_x(), y: vel.get_y() } : { x: 0, y: 0 },
          angularVelocity: light.body.GetAngularVelocity(),
          rays: light.rays,
          maxDist: light.maxDist,
          fov: light.fov,
          color: light.color,
          brightness: light.brightness,
          integrity: light.integrity,
          burned: light.burned
        };
      }).filter(Boolean);

      const debrisData = debris.map(d => {
        if (!d.body) return null;
        const pos = d.body.GetPosition();
        const vel = getBodyLinearVelocity(d.body);
        return {
          position: { x: pos.get_x(), y: pos.get_y() },
          angle: d.body.GetAngle(),
          velocity: { x: vel.get_x(), y: vel.get_y() },
          angularVelocity: d.body.GetAngularVelocity(),
          color: d.color,
          verts: d.verts,
          texBounds: d.texBounds,
          textureDataURL: d.texture ? d.texture.toDataURL() : null
        };
      }).filter(Boolean);

      // Serialize joints from state.joints registry
      const joints = state.joints.map(jData => {
        // Find body indices
        const bodyAIndex = state.blocks.findIndex(b => b.body === jData.bodyA);
        const bodyBIndex = state.blocks.findIndex(b => b.body === jData.bodyB);
        // Skip if bodies not found in blocks (could be lights or destroyed)
        if (bodyAIndex === -1 || bodyBIndex === -1) return null;
        return {
          type: jData.type,
          bodyAIndex,
          bodyBIndex,
          localAnchorA: jData.localAnchorA,
          localAnchorB: jData.localAnchorB
        };
      }).filter(j => j !== null);

      // Serialize particles from WASM buffer (positions + colors)
      let particles = null;
      if (state.particleSystem) {
        const count = state.particleSystem.GetParticleCount();
        if (count > 0) {
          const b2 = Physics.b2;
          const HEAPF32 = Physics.HEAPF32 || b2.HEAPF32;
          const HEAPU8 = b2.HEAPU8;
          const getPointer = Physics.getPointer || b2.getPointer;

          if (HEAPF32 && HEAPU8 && getPointer) {
            const posBuffer = state.particleSystem.GetPositionBuffer();
            const colBuffer = state.particleSystem.GetColorBuffer();
            const pos_p = getPointer(posBuffer);
            const col_p = colBuffer ? getPointer(colBuffer) : 0;

            // Copy position data (Float32Array -> regular Array for JSON)
            const posData = Array.from(new Float32Array(HEAPF32.buffer, pos_p, count * 2));
            // Copy color data
            const colData = col_p ? Array.from(new Uint8Array(HEAPU8.buffer, col_p, count * 4)) : null;

            particles = { count, positions: posData, colors: colData };
          }
        }
      }

      // Serialize thrusters
      const thrusters = {};
      for (const key in thrusterBindings) {
        const binding = thrusterBindings[key];
        if (binding?.block) {
          thrusters[key] = {
            blockIndex: state.blocks.indexOf(binding.block),
            edgeIndex: binding.edgeIndex
          };
        }
      }

      // Serialize lazer
      let lazer = null;
      if (lazerBinding.light) {
        lazer = {
          lightIndex: state.lights.indexOf(lazerBinding.light),
          pewRays: lazerBinding.pewRays,
          pewFov: lazerBinding.pewFov,
          sound: lazerBinding.sound
        };
      }

      // Serialize panel settings (Tweakpane panels)
      const panelSettings = {};
      tpPanePositions.forEach((pos, id) => {
        panelSettings[id] = {
          position: { x: pos.x, y: pos.y },
          collapsed: tpPaneCollapsed.get(id) || false,
          bladeRight: tpPaneBladeRight.get(id) || false
        };
      });

      // Serialize custom shapes from catalog (exclude built-in primitives)
      const customShapes = (window.shapeCatalog || []).filter(s =>
        s.type === 'polygon' && s.id.startsWith('custom_')
      );

      return {
        version: 2,  // NEW: version for format compatibility
        blocks,
        lights,
        debris: debrisData,
        joints,
        particles,
        thrusters,
        lazer,
        eventSounds: { ...eventSounds },
        panelSettings,
        customShapes,  // NEW: save custom polygon shapes
        // Camera - simple values
        camZoom: zoom,
        camPanX: panX,
        camPanY: panY
      };
    }
    window.serializeScene = serializeScene;

    function getJointType(joint) {
      const type = joint.GetType();
      switch (type) {
        case 1: return 'revolute';
        case 3: return 'distance';
        case 6: return 'weld';
        case 10: return 'rope';
        case 2: return 'prismatic';
        default: return 'unknown';
      }
    }

    // ═══════════════���═════════════════════════════���═════════════════════════
    // SAVE / LOAD v3 - Simple scene serialization (no history, no snapshots)
    // ════════════════════���══════════════════════════════════════════════════

    function downloadScene() {
      // Just serialize current scene - same data that goes into history
      const data = serializeScene();
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dream_' + Date.now() + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importScene(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          rebuildWorld(data);
          if (data.panelSettings) {
            restorePanelSettings(data.panelSettings);
          }
          draw();
          history.length = 0;
          captureState();
        } catch (err) {
        }
      };
      reader.readAsText(file);
    }

    async function importSceneFromURL(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) return;
        const data = await response.json();
        rebuildWorld(data);
        if (data.panelSettings) {
          restorePanelSettings(data.panelSettings);
        }
        draw();
        history.length = 0;
        captureState();
      } catch (err) {}
    }

    function restorePanelSettings(settings) {
      // Populate Maps first
      for (const panelId in settings) {
        const { position, collapsed, bladeRight } = settings[panelId];
        if (position) {
          tpPanePositions.set(panelId, { x: position.x, y: position.y });
        }
        tpPaneBladeRight.set(panelId, bladeRight || false);
        tpPaneCollapsed.set(panelId, collapsed || false);
      }

      // Apply to existing panels
      requestAnimationFrame(() => {
        for (const panelId in settings) {
          const el = document.getElementById(`tp-${panelId}`);
          if (!el) continue;

          const pos = tpPanePositions.get(panelId);
          const bladeRight = tpPaneBladeRight.get(panelId) || false;
          const isCollapsed = tpPaneCollapsed.get(panelId) || false;

          // Position
          if (pos) {
            el.style.top = `${pos.y}px`;
            if (bladeRight) {
              el.style.right = `${pos.x}px`;
              el.style.left = '';
            } else {
              el.style.left = `${pos.x}px`;
              el.style.right = '';
            }
          }

          // Blade rotation - find wrapper and update
          const wrapper = el.querySelector('.tp-drag-wrapper');
          if (wrapper) {
            wrapper.dataset.bladeRight = bladeRight ? 'true' : 'false';
            // Update flip button arrow direction
            const flipBtn = wrapper.querySelector('.blade-flip-btn');
            if (flipBtn) {
              flipBtn.innerHTML = bladeRight ? '▶' : '◀';
            }
          }

          // Collapsed
          const content = el.querySelector('.tp-pane-content');
          if (content) {
            content.classList.toggle('collapsed', isCollapsed);
          }
        }

        savePanelStates();
      });
    }

      rebuildWorld({});
      draw();
      captureState();

    function initColorPicker() {

    const swatchLabels = ['LIGHT', 'BLOCK', 'FLUID'];

    // Helper function to shade a color
    function shadeColor(color, percent) {
      // Convert hex to RGB
      let R, G, B;

      // Handle hex colors with or without #
      let hex = color.replace('#', '');
      if (hex.length === 3) {
        hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      }

      R = parseInt(hex.substring(0, 2), 16);
      G = parseInt(hex.substring(2, 4), 16);
      B = parseInt(hex.substring(4, 6), 16);

      // Apply shading
      R = Math.min(255, Math.max(0, R + R * percent / 100));
      G = Math.min(255, Math.max(0, G + G * percent / 100));
      B = Math.min(255, Math.max(0, B + B * percent / 100));

      // Convert back to hex
      R = Math.round(R).toString(16).padStart(2, '0');
      G = Math.round(G).toString(16).padStart(2, '0');
      B = Math.round(B).toString(16).padStart(2, '0');

      return '#' + R + G + B;
    }

    function updateColorSwatches() {

    function isOverPanel(x, y) {

      if (now - lastPanelRectUpdate > PANEL_RECT_UPDATE_INTERVAL) {
        updatePanelRects();

      for (let i = 0; i < panelRects.length; i++) {
        const rect = panelRects[i];
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {

    function renderBlockPreview() {
      const ctx = blockPreviewCanvas.getContext('2d');
      ctx.clearRect(0, 0, 80, 80);

      // Terrain mode = ×5 — масштабировать preview (ограничить до 35px чтобы влезло)
      const sizeMultiplier = window.terrainMode ? 5 : 1;
      const cx = 40, cy = 40, s = Math.min(22 * sizeMultiplier, 35); // center and half-size

      // Get current shape from catalog
      const shape = window.shapeCatalog?.find(sh => sh.id === currentShapeId) || { type: 'primitive', primitive: 'box' };
      const shapeIndex = window.shapeCatalog?.findIndex(sh => sh.id === currentShapeId) || 0;

      // Colored semi-transparent fill matching block render (red, green, pink)
      const altColors = ['rgba(255,80,80,0.6)', 'rgba(80,255,80,0.6)', 'rgba(255,80,180,0.6)'];
      const altStrokes = ['rgba(255,80,80,0.9)', 'rgba(80,255,80,0.9)', 'rgba(255,80,180,0.9)'];
      ctx.fillStyle = altColors[shapeIndex % 3];
      ctx.strokeStyle = altStrokes[shapeIndex % 3];
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);

      // Draw based on shape type
      if (shape.type === 'primitive') {
        if (shape.primitive === 'circle') {
          ctx.beginPath();
          ctx.arc(cx, cy, s, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else {
          // Box
          ctx.fillRect(cx - s, cy - s, s * 2, s * 2);
          ctx.strokeRect(cx - s, cy - s, s * 2, s * 2);
        }
      } else if (shape.vertices && shape.vertices.length >= 3) {
        // Polygon
        ctx.beginPath();
        shape.vertices.forEach((v, i) => {
          const x = cx + v.x * s * 2;
          const y = cy - v.y * s * 2; // flip Y
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        // Fallback box
        ctx.fillRect(cx - s, cy - s, s * 2, s * 2);
        ctx.strokeRect(cx - s, cy - s, s * 2, s * 2);
      }
      ctx.setLineDash([]);  // Reset dash
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDERING
    // ══════════════════════════════════════════════���════════════════════════

    // Global renderer instance (OOP Phase 1)
    let renderer = null;


    // Рисует область пересечения ghost-блока с существующими блоками
    // Вызывается из draw() — использует основной ctx со всеми трансформами

    // ═══════════════════════════════════════════════════════════════════════
    // COMBINE — булево вычитание: placement минус пересечение с block
    // Алгоритм: для каждого ребра block вырезаем кусок placement снаружи ребра,
    // затем обрезаем его внутри всех остальных рёбер block.
    // Возвращает массив выпуклых кусков (каждый станет отдельным fixture).
    // ═══════════════════════════════════════════════════════════════════════

    // Вспомогательный clip по одному ребру (SH)
    // Slice a polygon by a line, returning [inside, outside] pieces
    function _slicePolygon(poly, ax, ay, bx, by) {
      const nx = -(by - ay), ny = bx - ax;
      const inside = [], outside = [];
      const n = poly.length;
      if (n < 3) return [null, null];

      for (let i = 0; i < n; i++) {
        const p1 = poly[i];
        const p2 = poly[(i + 1) % n];
        const d1 = (p1.x - ax) * nx + (p1.y - ay) * ny;
        const d2 = (p2.x - ax) * nx + (p2.y - ay) * ny;

        if (d1 >= 0) inside.push(p1); else outside.push(p1);

        if ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) {
          const dx = p2.x - p1.x, dy = p2.y - p1.y;
          const den = dx * nx + dy * ny;
          if (Math.abs(den) > 1e-9) {
            const t = ((ax - p1.x) * nx + (ay - p1.y) * ny) / den;
            const intersect = { x: p1.x + t * dx, y: p1.y + t * dy };
            inside.push(intersect);
            outside.push(intersect);
          }
        }
      }
      return [inside.length >= 3 ? inside : null, outside.length >= 3 ? outside : null];
    }

    // Проверить лежит ли отрезок (p1,p2) на ребре (a,b) блока
    function _edgeOnBlockEdge(p1, p2, a, b, eps=1e-4) {
      const dx=b.x-a.x, dy=b.y-a.y;
      const cross1=(p1.x-a.x)*dy-(p1.y-a.y)*dx;
      const cross2=(p2.x-a.x)*dy-(p2.y-a.y)*dx;
      if (Math.abs(cross1)>eps||Math.abs(cross2)>eps) return false;
      // Оба конца лежат на прямой — проверить что они в пределах ребра
      const l2=dx*dx+dy*dy;
      if (l2<1e-12) return false;
      const t1=((p1.x-a.x)*dx+(p1.y-a.y)*dy)/l2;
      const t2=((p2.x-a.x)*dx+(p2.y-a.y)*dy)/l2;
      return Math.max(t1,t2)>eps && Math.min(t1,t2)<1-eps;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // BEGIN: computeCombineClip
    // Булево вычитание: вычисляет куски нового placement после срезания
    // пересечений с существующими terrain блоками.
    // Возвращает:
    //   null         — нет пересечения с terrain (обычное размещение)
    //   []           — placement полностью поглощён (не добавлять)
    //   Array<piece> — нормализованные куски нового combined блока
    //     ._boundaryEdges   — рёбра на границе пересечения
    //     ._overlappingBlocks — terrain блоки которые реально пересеклись
    //       (используется в handleWallToolDown — но только для диагностики,
    //        shapeGravityBodies при combine не меняется)
    // ═══════════════════════════════════════════════════════════════════════
    function computeCombineClip(wx, wy, size, shapeId) {
      const placementW = _placementVerts(wx, wy, size, shapeId);
      if (!placementW || placementW.length < 3) return null;

      let hasAnyOverlap = false;
      for (const block of state.blocks) {
        if (block.body && block.isTerrain) {
          const bw = _blockWorldVerts(block);
          if (bw && _satOverlap(placementW, bw)) { hasAnyOverlap = true; break; }
        }
      }
      if (!hasAnyOverlap) return null;

      let currentPieces = [placementW];
      const boundaryEdges = []; // рёбра границы пересечения (мировые)
      const overlappingBlocks = []; // блоки которые реально пересеклись с placement

      for (const block of state.blocks) {
        if (!block.body || !block.isTerrain) continue;
        const bw = _blockWorldVerts(block);
        if (!bw || !_satOverlap(placementW, bw)) continue;
        overlappingBlocks.push(block);

        const subPolys = Array.isArray(bw[0]) ? bw : [bw];

        for (const subPoly of subPolys) {
          let nextAfterThisPoly = [];
          for (const piece of currentPieces) {
            if (!_satOverlap(piece, subPoly)) {
              nextAfterThisPoly.push(piece);
              continue;
            }
            
            let remaining = piece;
            const nb = subPoly.length;
            for (let i = 0; i < nb; i++) {
              const a = subPoly[i], b = subPoly[(i + 1) % nb];
              const [inside, outside] = _slicePolygon(remaining, a.x, a.y, b.x, b.y);
              if (outside) nextAfterThisPoly.push(outside);
              if (!inside) { remaining = null; break; }
              remaining = inside;
            }
            // remaining = поглощённая часть placement
            // Её рёбра на рёбрах subPoly = граница пересечения
            if (remaining) {
              const nr = remaining.length;
              for (let i = 0; i < nr; i++) {
                const rp1 = remaining[i], rp2 = remaining[(i+1)%nr];
                for (let j = 0; j < nb; j++) {
                  if (_edgeOnBlockEdge(rp1, rp2, subPoly[j], subPoly[(j+1)%nb])) {
                    boundaryEdges.push({ p1: rp1, p2: rp2 });
                    break;
                  }
                }
              }
            }
          }
          currentPieces = nextAfterThisPoly;
          if (currentPieces.length === 0) break;
        }
        if (currentPieces.length === 0) break;
      }

      // Нормализовать куски и вернуть вместе с boundaryEdges
      const normalizedPieces = currentPieces.map(p =>
        p.map(v => ({ x: (v.x - wx) / size, y: (v.y - wy) / size }))
      );
      // Нормализовать boundaryEdges
      const normalizedBoundary = boundaryEdges.map(({p1,p2}) => ({
        p1: { x: (p1.x-wx)/size, y: (p1.y-wy)/size },
        p2: { x: (p2.x-wx)/size, y: (p2.y-wy)/size }
      }));

      normalizedPieces._boundaryEdges = normalizedBoundary;
      normalizedPieces._overlappingBlocks = overlappingBlocks;
      return normalizedPieces;
    }
    // END: computeCombineClip

    function drawOverlapIntersections() {
      if (!ghostBlockPos || typeof _placementVerts !== 'function') return;

      const sizeMultiplier = window.terrainMode ? 5 : 1;
      const placementW = _placementVerts(
        ghostBlockPos.x, ghostBlockPos.y,
        BLOCK_SIZE * sizeMultiplier, currentShapeId
      );

      const dpr = window.devicePixelRatio || 1;

      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle   = 'rgba(255,40,40,0.55)';
      ctx.strokeStyle = 'rgba(255,60,60,1)';
      ctx.lineWidth   = 1.5;

      // NEW: Show resulting pieces (the added area) instead of just overlaps
      const pieces = computeCombineClip(ghostBlockPos.x, ghostBlockPos.y, BLOCK_SIZE * sizeMultiplier, currentShapeId);
      
      if (pieces && pieces.length > 0) {
        ctx.fillStyle   = 'rgba(0,255,100,0.35)'; // Green for additive area
        ctx.strokeStyle = 'rgba(0,255,150,0.8)';
        
        pieces.forEach(piece => {
          ctx.beginPath();
          piece.forEach((v, i) => {
            // Pieces are normalized to local space of the ghost block, so convert to world first
            const wx = ghostBlockPos.x + v.x * (BLOCK_SIZE * sizeMultiplier);
            const wy = ghostBlockPos.y + v.y * (BLOCK_SIZE * sizeMultiplier);
            const sx = canvas.width / 2 + wx * scaledTileSize + panX * dpr;
            const sy = canvas.height / 2 - wy * scaledTileSize + panY * dpr;
            if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          });
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        });
      } else if (pieces && pieces.length === 0) {
        // Fully overlapped - show warning
        ctx.fillStyle   = 'rgba(255,40,40,0.45)';
        ctx.strokeStyle = 'rgba(255,60,60,1)';
        ctx.beginPath();
        placementW.forEach((v, i) => {
          const sx = canvas.width / 2 + v.x * scaledTileSize + panX * dpr;
          const sy = canvas.height / 2 - v.y * scaledTileSize + panY * dpr;
          if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }

    // CONSOLE INTERCEPTOR
    // ═══════════════════════════════════════════════════════════════════════
    const _origConsole = { log: console.log, warn: console.warn, error: console.error };
    const _consoleLog = [];
    ['log','warn','error'].forEach(method => {
      console[method] = (...args) => {
        _origConsole[method](...args);
        _consoleLog.push({ method, ts: Date.now(), msg: args.map(a => {
          try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch(e) { return String(a); }
        }).join(' ') });
        if (_consoleLog.length > 500) _consoleLog.shift();
      };
    });
