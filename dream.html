    function handleKeyDown(e) {
      // Ignore shortcuts when typing in input fields
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
        return;
      }

      // ═══ SIMULATE MODE KEYBINDINGS ═══
      if (simulateMode) {
        // ESC - exit simulate mode
        if (e.key === 'Escape') {
          e.preventDefault();
          exitSimulateMode();
          return;
        }
        // Ctrl - pointer gravity (same as editor mode!)
        if (e.key === 'Control') {
          if (!gravityEnabled) {
            gravityEnabled = true;
            window.gravityEnabled = true;
          }
          return;
        }
        // Arrow keys - rotation (movement removed, no shift needed)
        if (e.key === 'ArrowLeft') {
          heroKeys.rotateLeft = true;
          e.preventDefault();
          return;
        }
        if (e.key === 'ArrowRight') {
          heroKeys.rotateRight = true;
          e.preventDefault();
          return;
        }
        // Space - timing logic: track press time
        if (e.key === ' ' || e.code === 'Space') {
          if (!spaceHeld) {
            spaceDownTime = performance.now();
            spaceHeld = true;
          }
          e.preventDefault();
          return;
        }
        // ArrowUp/ArrowDown - resize hero (before spawn only)
        if (e.key === 'ArrowUp') {
          if (!heroSpawned) {
            selectedHeroSize = Math.min(5, selectedHeroSize + 0.1);
            draw();
          }
          e.preventDefault();
          return;
        }
        if (e.key === 'ArrowDown') {
          if (!heroSpawned) {
            selectedHeroSize = Math.max(0.3, selectedHeroSize - 0.1);
            draw();
          }
          e.preventDefault();
          return;
        }
        // Block other keys in simulate mode
        return;
      }

      // ═══ EDITOR MODE KEYBINDINGS ═══

      // Shift key - magnified cursor
      if (e.key === 'Shift' && !shiftPressed) {
        shiftPressed = true;
      }

      // Ctrl key - temporary gravity
      if (e.key === 'Control') {
        if (!gravityEnabled) {
          gravityEnabled = true;
          window.gravityEnabled = true;
        }
      }

      // ESC - exit fullscreen
      if (e.key === 'Escape' && document.body.classList.contains('fake-fullscreen')) {
        toggleFullscreen();
      }

      // Diagnostic API check with Backquote key (`~)
      if (e.key === '`') {
        e.preventDefault();
        diagnoseWasmApi();
      }

      // Overlap debug / contour
      if (e.key === 'D' && e.shiftKey) {
        e.preventDefault();
        if (_combineRec.active) {
          if (_manualContourMode) _contourCommit(); else _contourEnter();
        } else { triggerOverlapDebug(); }
      }
      if (e.key === 'F' && e.shiftKey) {
        e.preventDefault();
        if (!_combineRec.active) _recStartCountdown(); else _recNotify('ALREADY\nRECORDING', '#ff9900', 1000);
      }
      if (e.key === 'M' && e.shiftKey) {
        e.preventDefault();
        if (_combineRec.active || _combineRec.snapshots.length > 0) _recExport(); else _recNotify('NOTHING\nTO EXPORT', '#ff3333', 1000);
      }

      if (_manualContourMode) {
        if (e.key === 'Enter')     { e.preventDefault(); _contourCommit(); return; }
        if (e.key === 'Escape')    { e.preventDefault(); _contourCancel(); return; }
        if (e.key === 'Backspace') { e.preventDefault(); _contourRemoveLast(); return; }
      }
      // Arrow keys - thrusters
      if (e.key === 'ArrowUp') arrowKeysPressed.up = true;
      if (e.key === 'ArrowDown') arrowKeysPressed.down = true;
      if (e.key === 'ArrowLeft') arrowKeysPressed.left = true;
      if (e.key === 'ArrowRight') arrowKeysPressed.right = true;

      // Drone keys
      if (e.key.toLowerCase() === 'b') {
        droneKeysPressed.b = true;
        detonateBlock();
      }
      if (e.key.toLowerCase() === 'v') droneKeysPressed.v = true;
      if (e.key.toLowerCase() === 'n') droneKeysPressed.n = true;
      if (e.key.toLowerCase() === 'm') droneKeysPressed.m = true;

      // Lazer
      if (e.key.toLowerCase() === 'x') {
        lazerBinding.pew = true;
        if (lazerBinding.sound) playLazerSound();
      }

      // Space - toggle play
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }

      // Undo/Redo
      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z') {
          e.preventDefault();
          if (e.shiftKey) {
            historyForward();
          } else {
            historyBack();
          }
        }
        if (e.key === 'y') {
          e.preventDefault();
          historyForward();
        }
      }

      // Tool shortcuts - numbers
      if (e.key === '1') setTool('wall');
      if (e.key === '2') setTool('light');
      if (e.key === '3') setTool('joint');
      if (e.key === '4') setTool('tilepaint');
      if (e.key === '5') setTool('eraser');
      if (e.key === '6') setTool('pointer');

      // Tool shortcuts - letters
      if (e.key.toLowerCase() === 'w') setTool('wall');
      if (e.key.toLowerCase() === 'l') setTool('light');
      if (e.key.toLowerCase() === 'j') setTool('joint');
      if (e.key.toLowerCase() === 't') setTool('tilepaint');
      if (e.key.toLowerCase() === 'r') setTool('eraser');

      // Z - toggle snap to grid
      if (e.key.toLowerCase() === 'z' && !e.ctrlKey && !e.metaKey) {
        snapToGrid = !snapToGrid;
        draw();
      }

      // A/D - history navigation
      if (e.key.toLowerCase() === 'a') historyBack();
      if (e.key.toLowerCase() === 'd') historyForward();
    }

    function handleKeyUp(e) {
      // ═══ SIMULATE MODE KEY RELEASE ═══
      if (simulateMode) {
        if (e.key === 'ArrowLeft') heroKeys.rotateLeft = false;
        if (e.key === 'ArrowRight') heroKeys.rotateRight = false;
        // Space release - check timing for jump vs thrust
        if (e.key === ' ' || e.code === 'Space') {
          if (spaceHeld) {
            const holdTime = performance.now() - spaceDownTime;
            if (holdTime < 1500) {
              // Quick tap (<1.5s) = jump, сила зависит от holdTime
              doHeroJump(holdTime);
            }
            // If held ≥1s, thrust was already applied in applyHeroMovement
            spaceHeld = false;
          }
        }
        // Ctrl - disable pointer gravity
        if (e.key === 'Control') {
          if (gravityEnabled && !gravityUserEnabled) {
            gravityEnabled = false;
            window.gravityEnabled = false;
          }
        }
        return;
      }

      // ═══ EDITOR MODE KEY RELEASE ═══

      // Shift key - simple cursor
      if (e.key === 'Shift') {
        shiftPressed = false;
      }

      // Ctrl key - disable temporary gravity
      if (e.key === 'Control') {
        if (gravityEnabled && !gravityUserEnabled) {
          gravityEnabled = false;
          window.gravityEnabled = false;
        }
      }

      if (e.key === 'ArrowUp') arrowKeysPressed.up = false;
      if (e.key === 'ArrowDown') arrowKeysPressed.down = false;
      if (e.key === 'ArrowLeft') arrowKeysPressed.left = false;
      if (e.key === 'ArrowRight') arrowKeysPressed.right = false;

      if (e.key.toLowerCase() === 'b') droneKeysPressed.b = false;
      if (e.key.toLowerCase() === 'v') droneKeysPressed.v = false;
      if (e.key.toLowerCase() === 'n') droneKeysPressed.n = false;
      if (e.key.toLowerCase() === 'm') droneKeysPressed.m = false;

      if (e.key.toLowerCase() === 'x') {
        lazerBinding.pew = false;
        stopLazerSound();
      }
    }

    function loadTileFromFile(file, tileID) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = tileSize;
            canvas.height = tileSize;
            canvas.getContext('2d').drawImage(img, 0, 0, tileSize, tileSize);
            tiles[tileID] = canvas;
            resolve(tileID);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // DREAM SPRITE система - загрузка спрайтшита
    function loadSpriteSheet() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => loadPreprocessedSprites(img);
      img.src = PREPROCESSED_SPRITES_URL;
    }

    function loadPreprocessedSprites(img) {
      const { cols, tileSize, padding, totalTiles } = PREPROCESSED_GRID;

      spriteTiles.length = 0;
      processedTiles.length = 0;

      for (let idx = 0; idx < totalTiles; idx++) {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const x = padding + col * (tileSize + padding);
        const y = padding + row * (tileSize + padding);

        const tileCanvas = document.createElement('canvas');
        tileCanvas.width = tileSize;
        tileCanvas.height = tileSize;
        const tileCtx = tileCanvas.getContext('2d');
        tileCtx.drawImage(img, x, y, tileSize, tileSize, 0, 0, tileSize, tileSize);

        spriteTiles.push(tileCanvas);
        processedTiles.push(tileCanvas);
        tiles[idx + 1] = tileCanvas;
      }

      totalSpritePages = Math.ceil(spriteTiles.length / 25);
      renderSpriteGrid();
    }

    function renderSpriteGrid() {
      const container = spriteGrid;
      if (!container) return;

      container.innerHTML = '';

      const emptyTile = document.createElement('div');
      emptyTile.className = 'sprite-tile' + (currentTileID === 0 ? ' selected' : '');
      emptyTile.textContent = '✕';
      emptyTile.style.cssText = 'display:flex;align-items:center;justify-content:center;color:#f5576c;font-size:16px;';
      emptyTile.onclick = () => {
        currentTileID = 0;
        renderSpriteGrid();
        updateToolPreview();
      };
      container.appendChild(emptyTile);

      for (const id in tiles) {
        const tileID = parseInt(id);
        const tile = document.createElement('div');
        tile.className = 'sprite-tile' + (currentTileID === tileID ? ' selected' : '');
        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        canvas.getContext('2d').drawImage(tiles[tileID], 0, 0, 32, 32);
        tile.appendChild(canvas);
        tile.onclick = () => {
          currentTileID = tileID;
          renderSpriteGrid();
          updateToolPreview();
        };
        container.appendChild(tile);
      }

      const addBtn = document.createElement('div');
      addBtn.className = 'sprite-tile';
      addBtn.textContent = '+';
      addBtn.style.cssText = 'display:flex;align-items:center;justify-content:center;color:#4fc3f7;font-size:20px;cursor:pointer;';
      addBtn.onclick = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.onchange = async (e) => {
          const files = Array.from(e.target.files);
          let nextID = Math.max(0, ...Object.keys(tiles).map(Number)) + 1;
          for (const file of files) {
            await loadTileFromFile(file, nextID++);
          }
          renderSpriteGrid();
        };
        input.click();
      };
      container.appendChild(addBtn);
    }

    const tpPanes = {};
    const tpPanePositions = new Map(); // Store positions for Tweakpane panels
    const tpDefaultPositions = new Map(); // Store default positions
    const tpPaneCollapsed = new Map(); // Store collapsed state per panel
    const tpPaneBladeRight = new Map(); // Store blade side per panel (false=left, true=right)

    // IndexedDB for panel state persistence
    const DB_NAME = 'DreamLightDB';
    const DB_STORE = 'panelStates';
    let panelDB = null;

    function openPanelDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          panelDB = request.result;
          resolve(panelDB);
        };
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE, { keyPath: 'id' });
          }
        };
      });
    }

    function savePanelStates() {
      if (!panelDB) return;
      const tx = panelDB.transaction(DB_STORE, 'readwrite');
      const store = tx.objectStore(DB_STORE);
      // Save each panel
      tpPanePositions.forEach((pos, id) => {
        store.put({
          id,
          x: pos.x,
          y: pos.y,
          collapsed: tpPaneCollapsed.get(id) || false,
          bladeRight: tpPaneBladeRight.get(id) || false
        });
      });
    }

    async function loadPanelStates() {
      try {
        await openPanelDB();
        return new Promise((resolve) => {
          const tx = panelDB.transaction(DB_STORE, 'readonly');
          const store = tx.objectStore(DB_STORE);
          const request = store.getAll();
          request.onsuccess = () => {
            const states = request.result || [];
            states.forEach(state => {
              if (state.id !== '_global') {
                tpPanePositions.set(state.id, { x: state.x, y: state.y });
                tpPaneCollapsed.set(state.id, state.collapsed || false);
                tpPaneBladeRight.set(state.id, state.bladeRight || false);
              }
            });
            resolve(true);
          };
          request.onerror = () => resolve(false);
        });
      } catch (e) {
        
        return false;
      }
    }

    // Load saved states on startup (async)

    function registerTweakpane(pane, id, defaultPos) {
      const el = pane.element;
      el.id = `tp-${id}`;
      el.style.position = 'fixed';
      el.style.zIndex = '1000';

      // Transfer any width from pane element to content (for proper collapse)
      const existingWidth = el.style.width;
      el.style.width = '';

      // Store default position
      tpDefaultPositions.set(id, defaultPos);

      // Load saved states for THIS panel (use defaults if not saved)
      let isCollapsed = tpPaneCollapsed.has(id) ? tpPaneCollapsed.get(id) : false;
      let bladeRight = tpPaneBladeRight.has(id) ? tpPaneBladeRight.get(id) : (defaultBladeSides[id] || false);

      // IMPORTANT: Always save to Maps so serialization works
      tpPaneBladeRight.set(id, bladeRight);
      tpPaneCollapsed.set(id, isCollapsed);

      // Check for saved position or use default
      const savedPos = tpPanePositions.get(id);
      const pos = savedPos || defaultPos;

      // Позиционирование зависит от стороны лезвия
      el.style.top = `${pos.y}px`;
      if (bladeRight) {
        el.style.right = `${pos.x}px`;
        el.style.left = '';
      } else {
        el.style.left = `${pos.x}px`;
        el.style.right = '';
      }
      tpPanePositions.set(id, { x: pos.x, y: pos.y });

      // Wrap pane content with flex container
      const wrapper = document.createElement('div');
      wrapper.className = 'tp-drag-wrapper';

      // Get label for this panel
      const bladeLabel = panelBladeLabels[id] || id.toUpperCase();

      // Apply initial blade side
      wrapper.dataset.bladeRight = bladeRight ? 'true' : 'false';

      // Create vertical drag blade
      const dragBlade = document.createElement('div');
      dragBlade.className = 'tp-drag-blade';
      dragBlade.style.cssText = `
        width: 16px;
        min-height: 40px;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.03) 0%,

        flex-shrink: 0;

        align-items: center;
        justify-content: center;

      // Create label span
      const labelSpan = document.createElement('span');
      labelSpan.textContent = bladeLabel;
      labelSpan.className = 'blade-label';
      labelSpan.style.cssText = `
        writing-mode: vertical-rl;
        text-orientation: mixed;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 1px;
        color: rgba(255,193,7,0.8);
        text-transform: uppercase;
        white-space: nowrap;
        user-select: none;
        pointer-events: none;
      `;

      // Create flip button (toggles blade side for this panel)
      const flipBtn = document.createElement('div');
      flipBtn.className = 'blade-flip-btn';
      flipBtn.innerHTML = bladeRight ? '▶' : '◀';
      flipBtn.title = 'Переключить сторону лезвия';
      flipBtn.style.cssText = `
        position: absolute;
        left: 50%;
        bottom: 4px;
        transform: translateX(-50%);
        width: 90%;
        height: 14px;
        font-size: 8px;
        color: #00CED1;
        background: linear-gradient(180deg, rgba(0,206,209,0.4) 0%, rgba(64,224,208,0.2) 100%);
        border-radius: 2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        box-shadow: 0 2px 4px rgba(64,224,208,0.4);
      `;

      dragBlade.appendChild(labelSpan);
      dragBlade.appendChild(flipBtn);

      // Create content container
      const contentContainer = document.createElement('div');
      contentContainer.className = 'tp-pane-content';
      contentContainer.style.cssText = `
        flex: 1;
        min-width: 0;
      `;

      // Flip button click - toggles blade side for THIS panel only
      flipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const currentBladeRight = tpPaneBladeRight.get(id) || false;
        const newBladeRight = !currentBladeRight;

        tpPaneBladeRight.set(id, newBladeRight);
        wrapper.dataset.bladeRight = newBladeRight ? 'true' : 'false';
        flipBtn.innerHTML = newBladeRight ? '▶' : '◀';

        // Переключаем привязку панели: left ↔ right
        const rect = el.getBoundingClientRect();
        if (newBladeRight) {
          // Привязка к правому краю
          el.style.left = '';
          el.style.right = (window.innerWidth - rect.right) + 'px';
        } else {
          // Привязка к левому краю
          el.style.right = '';
          el.style.left = rect.left + 'px';
        }

        savePanelStates();
      });
      flipBtn.addEventListener('mouseenter', () => {
        flipBtn.style.color = '#40E0D0';
        flipBtn.style.background = 'linear-gradient(180deg, rgba(0,206,209,0.6) 0%, rgba(64,224,208,0.35) 100%)';
        flipBtn.style.boxShadow = '0 3px 6px rgba(64,224,208,0.5)';
      });
      flipBtn.addEventListener('mouseleave', () => {
        flipBtn.style.color = '#00CED1';
        flipBtn.style.background = 'linear-gradient(180deg, rgba(0,206,209,0.4) 0%, rgba(64,224,208,0.2) 100%)';
        flipBtn.style.boxShadow = '0 2px 4px rgba(64,224,208,0.4)';
      });

      // Hover effect for blade
      dragBlade.addEventListener('mouseenter', () => {
        dragBlade.style.background = 'linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 100%)';
        labelSpan.style.color = 'rgba(255,193,7,1)';
      });
      dragBlade.addEventListener('mouseleave', () => {
        dragBlade.style.background = 'linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 100%)';
        labelSpan.style.color = 'rgba(255,193,7,0.8)';
      });

      // Move all original children to content container
      while (el.firstChild) {
        contentContainer.appendChild(el.firstChild);
      }

      // Assemble: wrapper contains [dragBlade, contentContainer]
      wrapper.appendChild(dragBlade);
      wrapper.appendChild(contentContainer);
      el.appendChild(wrapper);

      // Apply initial collapsed state if saved
      if (isCollapsed) {
        contentContainer.classList.add('collapsed');
      }

      // Dragging state
      let isDragging = false;
      let hasMoved = false;
      let startX, startY, origX, origY;
      let dragBladeRight = false;  // Capture bladeRight at drag start
      const DRAG_THRESHOLD = 5;

      dragBlade.addEventListener('pointerdown', (e) => {
        if (e.target === flipBtn) return;
        isDragging = true;
        hasMoved = false;
        el.style.zIndex = '2000';
        dragBlade.style.cursor = 'grabbing';
        startX = e.clientX;
        startY = e.clientY;
        // Capture current bladeRight from Map at drag start
        dragBladeRight = tpPaneBladeRight.get(id) || false;
        // Берём позицию в зависимости от стороны лезвия
        origX = dragBladeRight
          ? parseInt(el.style.right) || 0
          : parseInt(el.style.left) || 0;
        origY = parseInt(el.style.top) || 0;
        dragBlade.setPointerCapture(e.pointerId);
      });

      dragBlade.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
          hasMoved = true;
        }
        if (hasMoved) {
          // При bladeRight: right уменьшается когда двигаем вправо (инверсия dx)
          if (dragBladeRight) {
            el.style.right = `${origX - dx}px`;
          } else {
            el.style.left = `${origX + dx}px`;
          }
          el.style.top = `${origY + dy}px`;
        }
      });

      dragBlade.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        el.style.zIndex = '1000';
        dragBlade.style.cursor = 'pointer';
        dragBlade.releasePointerCapture(e.pointerId);

        if (hasMoved) {
          // Сохраняем позицию в зависимости от стороны лезвия
          const currentBladeRight = tpPaneBladeRight.get(id) || false;
          const finalX = currentBladeRight
            ? parseInt(el.style.right) || 0
            : parseInt(el.style.left) || 0;
          const finalY = parseInt(el.style.top) || 0;
          tpPanePositions.set(id, { x: finalX, y: finalY });
          savePanelStates();
        } else {
          // Toggle collapse - CSS handles direction via transform-origin
          const currentCollapsed = tpPaneCollapsed.get(id) || false;
          const newCollapsed = !currentCollapsed;
          tpPaneCollapsed.set(id, newCollapsed);
          contentContainer.classList.toggle('collapsed', newCollapsed);
          savePanelStates();
        }
      });
    }

      // Helper to draw shape preview on canvas
      function drawShapePreview(canvas, shape) {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0a0a12';
        ctx.fillRect(0, 0, 40, 40);
        ctx.save();
        ctx.translate(20, 20);
        ctx.fillStyle = shape.color || '#4FC3F7';
        ctx.strokeStyle = shape.color || '#4FC3F7';
        ctx.lineWidth = 1;

        if (shape.primitive === 'box' || shape.id === 'box') {
          ctx.fillRect(-12, -12, 24, 24);
        } else if (shape.primitive === 'circle' || shape.id === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, 12, 0, Math.PI * 2);
          ctx.fill();
        } else if (shape.vertices) {
          ctx.beginPath();
          shape.vertices.forEach((v, i) => {
            const px = v.x * 24;
            const py = -v.y * 24;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      // Navigation row placeholder (created later, declared here for access)

      // Render shape previews (6x1 grid)

        shapeCatalogGrid.innerHTML = '';

        const totalPages = Math.max(1, Math.ceil(totalItems / 6));
        const startIdx = shapePage * 6;
        const endIdx = Math.min(startIdx + 6, totalItems);

        for (let i = startIdx; i < endIdx; i++) {
          if (i < catalog.length) {
            shapeCatalogGrid.appendChild(createShapeButton(catalog[i], i));
          } else {
            // [+] button (last item)
            const addBtn = document.createElement('button');

      // Update nav buttons state

        if (nextBtn) {

        btn.addEventListener('contextmenu', (e) => {

          document.getElementById('shape-ctx-menu')?.remove();

          const menu = document.createElement('div');
          menu.id = 'shape-ctx-menu';
          menu.style.cssText = `
            position: fixed;
            left: ${e.clientX}px; top: ${e.clientY}px;
            background: #1a1a2e;
            border: 1px solid rgba(0,255,255,0.4);
            border-radius: 4px;
            padding: 4px 0;
            z-index: 999999;
            min-width: 160px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            font-family: monospace;
          `;

          const editItem = document.createElement('div');
          editItem.textContent = '✏️ Открыть в редакторе';
          editItem.style.cssText = `
            padding: 8px 14px;
            color: #0ff;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
          `;
          editItem.onmouseenter = () => editItem.style.background = 'rgba(0,255,255,0.1)';
          editItem.onmouseleave = () => editItem.style.background = '';
          editItem.onclick = () => {
            menu.remove();
            if (!window.Qube) return;
            window.Qube.load('mode_shape_editor');
            requestAnimationFrame(() => {
              const mode = window.Qube.modules?.find(m => m.id === 'mode_shape_editor');
              if (!mode || !mode.canvas) return;
              const cx = mode.canvas.width / 2;
              const cy = mode.canvas.height / 2;
              const r  = Math.min(cx, cy) * 0.6;
              let pts = [];
              if (shape.primitive === 'box' || shape.id === 'box') {
                pts = [cx-r, cy-r, cx+r, cy-r, cx+r, cy+r, cx-r, cy+r];
              } else if (shape.primitive === 'circle' || shape.id === 'circle') {
                for (let i = 0; i < 16; i++) {
                  const a = (i / 16) * Math.PI * 2 - Math.PI / 2;
                  pts.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                }
              } else if (shape.vertices) {
                pts = shape.vertices.flatMap(v => [cx + v.x * r * 2, cy - v.y * r * 2]);
              }
              mode.poly = pts;
              mode.shapeName = shape.name;
              mode.shapeColor = shape.color || '#00bbff';
              const nameInput  = mode.overlay?.querySelector('#se-name');
              const colorInput = mode.overlay?.querySelector('#se-color');
              if (nameInput)  nameInput.value  = mode.shapeName;
              if (colorInput) colorInput.value = mode.shapeColor;
              mode.updatePointCount?.();
              mode.redraw?.();
            });
          };

          menu.appendChild(editItem);
          document.body.appendChild(menu);

          // Закрыть при клике вне
          const close = (ev) => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('pointerdown', close); } };
          setTimeout(() => document.addEventListener('pointerdown', close), 0);
        });

        return btn;

      // Smaller preview for 6x1 grid (compact) - colored semi-transparent
      function drawShapePreviewSmall(canvas, shape, index = 0) {
        const w = canvas.width, h = canvas.height;
        const ctx = canvas.getContext('2d');
        const cx = w / 2, cy = h / 2, s = w * 0.35;

        // Clear (transparent background)
        ctx.clearRect(0, 0, w, h);

        ctx.save();
        ctx.translate(cx, cy);

        // Alternating colors matching block render (red, green, pink)
        const altColors = ['rgba(255,80,80,0.6)', 'rgba(80,255,80,0.6)', 'rgba(255,80,180,0.6)'];
        const altStrokes = ['rgba(255,80,80,0.9)', 'rgba(80,255,80,0.9)', 'rgba(255,80,180,0.9)'];
        ctx.fillStyle = altColors[index % 3];
        ctx.strokeStyle = altStrokes[index % 3];
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);

        if (shape.primitive === 'box' || shape.id === 'box') {
          ctx.fillRect(-s, -s, s * 2, s * 2);
          ctx.strokeRect(-s, -s, s * 2, s * 2);
        } else if (shape.primitive === 'circle' || shape.id === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, s, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (shape.vertices) {
          ctx.beginPath();
          shape.vertices.forEach((v, i) => {
            const px = v.x * s * 2;
            const py = -v.y * s * 2;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();

      const wellParams = {
        intervalValues: [0.1, 0.2, 0.4, 0.5, 0.7, 1.0, 1.5],
        intervalIndex: 3,    // default 0.5
        life: -1,            // -1 = вечно
        forceOn: false,
        force: { x: 0, y: 0 },
        radius: 0.4
      };

      // ─── Строка кнопок ─── [WELL][FORCE][TIME x.x][LIFE x.x]
      const wellRow = document.createElement('div');
      wellRow.style.cssText = 'display: flex; gap: 3px; padding: 3px 6px 3px;';

      // WELL — активирует режим размещения источника
      const wellBtn = document.createElement('button');
      wellBtn.textContent = 'WELL';
      wellBtn.style.cssText = btnStyle;
      let wellPlaceMode = false;

      function updateWellBtn() {
        if (wellPlaceMode) {
          wellBtn.style.borderColor = '#4fc3f7';
          wellBtn.style.background  = 'rgba(79,195,247,0.15)';
          wellBtn.style.color       = '#4fc3f7';
          wellBtn.style.textShadow  = '0 0 8px #4fc3f7';
        } else {
          wellBtn.style.borderColor = 'rgba(255,255,255,0.2)';
          wellBtn.style.background  = 'rgba(0,0,0,0.3)';
          wellBtn.style.color       = 'rgba(255,255,255,0.5)';
          wellBtn.style.textShadow  = 'none';
        }
      }
      wellBtn.onclick = () => {
        wellPlaceMode = !wellPlaceMode;
        updateWellBtn();
        updateForceBtn();
        updateTimeBtn();
        updateLifeBtn();
      };

      // FORCE — включает/выключает импульс у размещаемого Well
      const forceBtn = document.createElement('button');
      forceBtn.textContent = 'FORCE';
      forceBtn.style.cssText = btnStyle;

      function updateForceBtn() {
        const enabled = wellPlaceMode;
        forceBtn.style.opacity       = enabled ? '1' : '0.3';
        forceBtn.style.pointerEvents = enabled ? 'auto' : 'none';
        if (wellParams.forceOn && enabled) {
          forceBtn.style.borderColor = '#b39ddb';
          forceBtn.style.color       = '#b39ddb';
          forceBtn.style.textShadow  = '0 0 6px #b39ddb88';
          forceBtn.style.background  = 'rgba(179,157,219,0.15)';
        } else {
          forceBtn.style.borderColor = 'rgba(255,255,255,0.2)';
          forceBtn.style.color       = 'rgba(255,255,255,0.5)';
          forceBtn.style.textShadow  = 'none';
          forceBtn.style.background  = 'rgba(0,0,0,0.3)';
        }
      }
      forceBtn.onclick = () => {
        if (!wellPlaceMode) return;
        wellParams.forceOn = !wellParams.forceOn;
        updateForceBtn();
        updateImpulseVisibility();
        if (state.wells.length > 0) {
          state.wells[state.wells.length - 1].forceOn = wellParams.forceOn;
        }
      };

      // TIME — цикличный переключатель
      const timeBtn = document.createElement('button');
      function updateTimeLabel() {
        timeBtn.textContent = 'TIME ' + wellParams.intervalValues[wellParams.intervalIndex].toFixed(1);
      }
      updateTimeLabel();
      timeBtn.style.cssText = btnStyle;

      function updateTimeBtn() {
        const enabled = wellPlaceMode;
        timeBtn.style.opacity       = enabled ? '1' : '0.3';
        timeBtn.style.pointerEvents = enabled ? 'auto' : 'none';
        if (enabled) {
          timeBtn.style.borderColor = '#80cbc4';
          timeBtn.style.color       = '#80cbc4';
          timeBtn.style.textShadow  = '0 0 6px #80cbc488';
        } else {
          timeBtn.style.borderColor = 'rgba(255,255,255,0.2)';
          timeBtn.style.color       = 'rgba(255,255,255,0.5)';
          timeBtn.style.textShadow  = 'none';
        }
      }
      timeBtn.onclick = () => {
        if (!wellPlaceMode) return;
        wellParams.intervalIndex = (wellParams.intervalIndex + 1) % wellParams.intervalValues.length;
        updateTimeLabel();
        // Применить к последнему well на сцене
        if (state.wells.length > 0) {
          state.wells[state.wells.length - 1].interval = wellParams.intervalValues[wellParams.intervalIndex];
        }
      };

      // LIFE — цикличный: -1(∞), 1, 2, 5, 10, 30, 60
      const lifeValues = [-1, 1, 2, 5, 10, 30, 60];
      let lifeIndex = 0;
      const lifeBtn = document.createElement('button');
      function updateLifeLabel() {
        const v = lifeValues[lifeIndex];
        lifeBtn.textContent = v < 0 ? 'LIFE ∞' : 'LIFE ' + v + 's';
        wellParams.life = v;
      }
      updateLifeLabel();
      lifeBtn.style.cssText = btnStyle;

      function updateLifeBtn() {
        const enabled = wellPlaceMode;
        lifeBtn.style.opacity       = enabled ? '1' : '0.3';
        lifeBtn.style.pointerEvents = enabled ? 'auto' : 'none';
        if (enabled) {
          lifeBtn.style.borderColor = '#ffcc80';
          lifeBtn.style.color       = '#ffcc80';
          lifeBtn.style.textShadow  = '0 0 6px #ffcc8088';
        } else {
          lifeBtn.style.borderColor = 'rgba(255,255,255,0.2)';
          lifeBtn.style.color       = 'rgba(255,255,255,0.5)';
          lifeBtn.style.textShadow  = 'none';
        }
      }
      lifeBtn.onclick = () => {
        if (!wellPlaceMode) return;
        lifeIndex = (lifeIndex + 1) % lifeValues.length;
        updateLifeLabel();
        if (state.wells.length > 0) {
          state.wells[state.wells.length - 1].life = wellParams.life;
        }
      };

      wellRow.appendChild(wellBtn);
      wellRow.appendChild(forceBtn);
      wellRow.appendChild(timeBtn);
      wellRow.appendChild(lifeBtn);

      // expose для handleLiquidDreamToolDown
      window.wellPlaceMode = () => wellPlaceMode;
      window.wellParams    = wellParams;

      // FORCE 2D point picker — направление и сила импульса Well
      const impulseParams = { impulse: { x: 0, y: 0 } };
      const impulseBinding = liquidPage.addBinding(impulseParams, 'impulse', {
        label: 'FORCE XY',
        x: { min: -10, max: 10, step: 0.1 },
        y: { min: -10, max: 10, step: 0.1 }
      }).on('change', ev => {
        // Y инвертирован: Tweakpane вверх = отрицательный, LiquidFun вверх = положительный
        wellParams.force = { x: ev.value.x, y: -ev.value.y };
        if (state.wells.length > 0) {
          const last = state.wells[state.wells.length - 1];
          last.force = { ...wellParams.force };
        }
      });

      function updateImpulseVisibility() {
        const show = wellPlaceMode && wellParams.forceOn;
        impulseBinding.element.style.opacity       = show ? '1'    : '0.3';
        impulseBinding.element.style.pointerEvents = show ? 'auto' : 'none';
      }
      updateImpulseVisibility();
      updateForceBtn();
      updateTimeBtn();
      updateLifeBtn();

      const liquidContainer = liquidPage.element.querySelector('.tp-brkv') || liquidPage.element;
      liquidContainer.insertBefore(liquidTypeGrid, liquidContainer.firstChild);
      liquidContainer.insertBefore(wellRow, liquidContainer.children[1] || null);

      // ─── DROP SIZE ───
      liquidPage.addBinding(toolParams, 'dropSize', {
        label: 'DROP SIZE',
        min: 0.1,
        max: 15,
        step: 0.1
      }).on('change', (ev) => {
        toolParams.liquidRadius = ev.value;
      });

      updateWellBtn();

      function setLiquidType(type) {
        liquidDream.currentType = type;
        const btns = liquidTypeGrid.querySelectorAll('button');
        btns.forEach(b => { if (b.dataset.type === type) b.click(); });
      }

      // Sync tab selection with tool and apply corresponding grid settings
      toolsTab.on('select', (ev) => {
        const toolMap = ['light', 'wall', 'joint', 'eraser', 'pointer', 'liquiddream'];
        currentTool = toolMap[ev.index];
        toolParams.tool = currentTool;
        zdogCursor.showLightPreview = (currentTool === 'light');
        zdogCursor.showBlockPreview = (currentTool === 'wall');

        // Apply grid settings based on selected tool
        if (ev.index === 0) {
          // Light tab - apply light snap settings
          applySnapSettings(lightSnapParams);
        } else if (ev.index === 1) {
          // Wall tab - apply wall snap settings
          applySnapSettings(wallSnapParams);
        } else {
          // Other tools - disable grid
          snapToGrid = false;
          if (tpPanes.gridParams) tpPanes.gridParams.snap = false;
        }

        draw();
      });

      registerTweakpane(toolsPane, 'tools', { x: 12, y: 12 });

      // Hide old panels
      document.querySelectorAll('.panel').forEach(p => p.classList.add('legacy-hidden'));
    }

    // Helper for sound selection
    function triggerSoundSelect(eventKey) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.wav,.mp3,.ogg';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const base64 = ev.target.result;
          if (eventKey === 'lazer') {
            lazerBinding.sound = base64;
            setupLazerSound(base64);
          } else if (eventKey.startsWith('engine_')) {
            eventSounds[eventKey] = base64;
            setupEngineSound(eventKey.replace('engine_', ''), base64);
          } else {
            eventSounds[eventKey] = base64;
          }
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    // Helper for thruster bind mode
    function enterThrusterBindMode(slotKey) {
      thrusterBindMode = slotKey;
      selectedBlockForThruster = null;
      stopPhysics(true);
    }

    // makePaneDraggable removed - now using registerTweakpane

    // ═══════════════════════════════════════════════════════════════════════
    // STARTUP
    // ═══════════════════════════════════════════════════════════════════════

    async function startup() {
      try {
        await initPhysics();
        initRaycastCallback();
      } catch (err) {
        document.body.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a12;color:#f5576c;font-family:sans-serif;text-align:center;padding:20px;">
            <div>
              <h1>Ошибка загрузки физики</h1>
              <p>${err.message}</p>
            </div>
          </div>
        `;
        return;
      }

      resizeCanvas();
      evt.attach('resize', window, (e, src) => resizeCanvas());

      // Initialize Zdog rendering
      initZdog();


      // Initialize Zdog cursor
      zdogCursor.init();
      window.zdogCursorRef = zdogCursor;
      // Применить флаг если был установлен до init (shape editor открылся раньше startup)
      if (window._zdogHiddenPending) {
        zdogCursor.hidden = true;
        window._zdogHiddenPending = false;
      }
      zdogCursor.showLightPreview = (currentTool === 'light');
      zdogCursor.showBlockPreview = (currentTool === 'wall');

      initColorPicker();
      window.dreamColorPicker = colorPicker;

      // Sync Zdog cursor colors with ColorPicker (initial + on change)
      if (colorPicker && colorPicker.colors) {
        for (let i = 0; i < 3; i++) {
          if (colorPicker.colors[i]) {
            zdogCursor.setColor(i, colorPicker.colors[i].hexString);
          }
        }
      }

      // Initialize Tweakpane UI (wait for ESM module to load)
      if (Tweakpane?.Pane) {
        initTweakpane();
      } else {
        window.addEventListener('tweakpane-loaded', () => initTweakpane(), { once: true });
      }

      evt.attach('pointerdown', canvas, (e, src) => handleCanvasPointerDown(e));
      evt.attach('pointermove', canvas, (e, src) => handleCanvasPointerMove(e));
      evt.attach('pointerup', canvas, (e, src) => handleCanvasPointerUp(e));
      evt.attach('pointerleave', canvas, (e, src) => {
        pointer.active = false;
      });
      evt.attach('wheel', canvas, (e, src) => {
        e.preventDefault(); // Prevent default scrolling behavior
        handleCanvasWheel(e);
      });
      evt.attach('contextmenu', canvas, (e, src) => {
        evt.prevent(e);
      });

      // Pinch-to-zoom for mobile (simulate mode)
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          pinchActive = true;
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          pinchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          pinchStartZoom = zoom;
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (pinchActive && e.touches.length === 2) {
          e.preventDefault();
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          const scale = currentDist / pinchStartDist;
          const newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartZoom * scale));

          if (newZoom !== zoom) {
            const dpr = window.devicePixelRatio || 1;
            zoom = newZoom;
            scaledTileSize = tileSize * zoom * dpr;

            // In simulate mode: keep camera centered on hero
            if (simulateMode && heroSpawned && heroBody) {
              const heroPos = heroBody.GetPosition();
              cameraPanX = -heroPos.get_x() * tileSize * zoom;
              cameraPanY = heroPos.get_y() * tileSize * zoom;
              panX = cameraPanX;
              panY = cameraPanY;
            }
            draw();
          }
        }
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          pinchActive = false;
        }
      });

      canvas.addEventListener('touchcancel', () => {
        pinchActive = false;
      });

      evt.attach('pointermove', document, (e, src) => {
        pointer.cssX = e.clientX;
        pointer.cssY = e.clientY;
        pointer.active = true;
        // Update Zdog cursor position (instant)
        zdogCursor.update(e.clientX, e.clientY);
      });

      evt.attach('pointerleave', document, (e, src) => {
        pointer.active = false;
      });

      evt.attach('keydown', document, (e, src) => handleKeyDown(e));
      evt.attach('keyup', document, (e, src) => handleKeyUp(e));

      // Initialize physics world (empty scene)
      rebuildWorld({});
      startPhysics();

      // Capture initial empty state for history
      captureState();

      loadSpriteSheet();
      updateToolPreview();

      // Initial draw
      draw();

      audioLoop(); // удалён — звук управляется напрямую из applyThrusterForces и key handlers

      // Engine ready - plugins can now be loaded via window.DreamPlugins.load()
      console.log('[DreamEngine] Ready for plugins');
    }

    if (document.readyState === 'loading') {
      evt.attach('DOMContentLoaded', document, (e, src) => startup());
    } else {
      startup();
    }

    // ═══════════════════════════════════════════════════════════════════════
    // BEGIN: TERRAIN COMBINE DEBUG
    // Логирует параметры terrain блоков при размещении.
    // Скачивает JSON через 8 секунд после загрузки движка.
    // Убрать после диагностики.
    // ═══════════════════════════════════════════════════════════════════════
    (() => {
      const _log = { events: [], snapshots: [] };

      function _snapBlock(label, block) {
        if (!block) return;
        const pos = block.body?.GetPosition();
        const entry = {
          label,
          t: Math.round(performance.now()),
          uid: block.uid,
          isTerrain: block.isTerrain,
          hasShapeGravity: block.hasShapeGravity,
          multiVerts: block.multiVerts ? block.multiVerts.length : null,
          vertices: block.vertices ? block.vertices.length : null,
          size: block.size,
          savedMass: block.savedMass ?? null,
          getMass: block.body ? block.body.GetMass() : null,
          bodyType: block.body ? block.body.GetType() : null,
          pos: pos ? { x: +pos.get_x().toFixed(3), y: +pos.get_y().toFixed(3) } : null,
          inShapeGravityBodies: shapeGravityBodies.has(block),
          shapeGravityBodiesSize: shapeGravityBodies.size,
        };
        _log.snapshots.push(entry);
        console.log('[TERRAIN DEBUG]', label, entry);
      }

      // Перехватываем handleWallToolDown — патчим после addBlock
      const _origHandleWall = handleWallToolDown;
      let _terrainCount = 0;
      window._terrainDebugSnap = _snapBlock;

      // Патчим rebuildTerrainSurface чтобы логировать после каждого rebuild
      const _origRebuild = rebuildTerrainSurface;
      window.rebuildTerrainSurface = function() {
        _origRebuild();
        const terrainBlocks = state.blocks.filter(b => b.isTerrain);
        _log.events.push({
          t: Math.round(performance.now()),
          event: 'rebuildTerrainSurface',
          terrainCount: terrainBlocks.length,
          surfaceSegs: state.terrainSurface?.length ?? 0,
          shapeGravCount: shapeGravityBodies.size,
          blocks: terrainBlocks.map(b => ({
            uid: b.uid,
            multiVerts: b.multiVerts?.length ?? null,
            hasGrav: b.hasShapeGravity,
            inSet: shapeGravityBodies.has(b),
            getMass: b.body ? b.body.GetMass() : null,
            savedMass: b.savedMass ?? null,
          }))
        });
      };

      // Патчим addBlock чтобы поймать момент создания terrain
      const _origAddBlock = addBlock;
      window._debugAddBlock = function(x, y, options) {
        const block = _origAddBlock(x, y, options);
        if (block && (options?.isTerrain || block.isTerrain)) {
          _terrainCount++;
          _snapBlock(
            block.multiVerts ? `terrain_combined_#${_terrainCount}` : `terrain_single_#${_terrainCount}`,
            block
          );
        }
        return block;
      };

      // Скачать через 8 секунд
      setTimeout(() => {
        const out = {
          meta: { recorded: new Date().toISOString(), engine: 'DreamLightEngine' },
          snapshots: _log.snapshots,
          events: _log.events,
          finalState: {
            terrainBlocks: state.blocks.filter(b => b.isTerrain).map(b => ({
              uid: b.uid,
              multiVerts: b.multiVerts?.length ?? null,
              vertices: b.vertices?.length ?? null,
              hasShapeGravity: b.hasShapeGravity,
              inShapeGravityBodies: shapeGravityBodies.has(b),
              getMass: b.body?.GetMass() ?? null,
              savedMass: b.savedMass ?? null,
              bodyType: b.body?.GetType() ?? null,
            })),
            shapeGravityBodiesSize: shapeGravityBodies.size,
            terrainSurfaceSegs: state.terrainSurface?.length ?? 0,
          }
        };
        const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'terrain_debug_' + Date.now() + '.json';
        a.click();
        URL.revokeObjectURL(a.href);
        console.log('[TERRAIN DEBUG] Downloaded.');
      }, 8000);
    })();
    // END: TERRAIN COMBINE DEBUG

    </script>
