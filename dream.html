    // ─── SAT overlap: проецируем оба полигона на каждую нормаль ───
    // Возвращает true если выпуклые полигоны пересекаются

    // Sutherland-Hodgman: пересечение двух выпуклых полигонов
    // Возвращает массив вершин пересечения (или [] если нет)
    function _clipPolygons(subject, clip) {
      let output = subject.slice();
      if (!output.length) return [];

      for (let i = 0; i < clip.length; i++) {
        if (!output.length) return [];
        const input = output;
        output = [];
        const a = clip[i], b = clip[(i + 1) % clip.length];
        // Нормаль внутрь клипирующего ребра
        const nx = -(b.y - a.y), ny = b.x - a.x;

        for (let j = 0; j < input.length; j++) {
          const cur  = input[j];
          const prev = input[(j + input.length - 1) % input.length];
          const curIn  = (cur.x  - a.x) * nx + (cur.y  - a.y) * ny >= 0;
          const prevIn = (prev.x - a.x) * nx + (prev.y - a.y) * ny >= 0;

          if (curIn) {
            if (!prevIn) {
              // Пересечение prev→cur с ребром
              const dx = cur.x - prev.x, dy = cur.y - prev.y;
              const denom = dx * nx + dy * ny;
              if (Math.abs(denom) > 1e-9) {
                const t = ((a.x - prev.x) * nx + (a.y - prev.y) * ny) / denom;
                output.push({ x: prev.x + t * dx, y: prev.y + t * dy });
              }
            }
            output.push(cur);
          } else if (prevIn) {
            // Пересечение prev→cur с ребром
            const dx = cur.x - prev.x, dy = cur.y - prev.y;
            const denom = dx * nx + dy * ny;
            if (Math.abs(denom) > 1e-9) {
              const t = ((a.x - prev.x) * nx + (a.y - prev.y) * ny) / denom;
              output.push({ x: prev.x + t * dx, y: prev.y + t * dy });
            }
          }
        }
      }
      return output;
    }

    function _satOverlap(vertsA, vertsB) {
      // If vertsB is a collection of pieces (multiVerts), check overlap against EACH piece
      if (Array.isArray(vertsB[0]) && typeof vertsB[0][0] === 'object') {
        for (const piece of vertsB) {
          if (_satOverlap(vertsA, piece)) return true;
        }
        return false;
      }

      const polys = [vertsA, vertsB];
      for (let p = 0; p < 2; p++) {
        const poly = polys[p];
        const n = poly.length;
        for (let i = 0; i < n; i++) {
          const a = poly[i], b = poly[(i + 1) % n];
          const nx = -(b.y - a.y), ny = b.x - a.x;
          let minA = Infinity, maxA = -Infinity;
          let minB = Infinity, maxB = -Infinity;
          for (const v of vertsA) { const d = v.x*nx + v.y*ny; if (d < minA) minA = d; if (d > maxA) maxA = d; }
          for (const v of vertsB) { const d = v.x*nx + v.y*ny; if (d < minB) minB = d; if (d > maxB) maxB = d; }
          if (maxA < minB || maxB < minA) return false;
        }
      }
      return true;
    }

    function _blockWorldVerts(block) {
      if (!block.body || !block.vertices) return null;
      const pos   = block.body.GetPosition();
      const angle = block.body.GetAngle();
      const cos   = Math.cos(angle), sin = Math.sin(angle);
      const sz    = block.size;
      const px = pos.get_x(), py = pos.get_y();

      const transform = (v) => ({
        x: px + (v.x * sz) * cos - (v.y * sz) * sin,
        y: py + (v.x * sz) * sin + (v.y * sz) * cos
      });

      // NEW: Handle multi-fixture blocks correctly
      if (block.multiVerts && Array.isArray(block.multiVerts)) {
        return block.multiVerts.map(loop => loop.map(transform));
      }

      return block.vertices.map(transform);
    }

    // Получить вершины размещаемого блока (по шейпу, без поворота)
    function _placementVerts(x, y, size, shapeId) {
      const shape = window.shapeCatalog?.find(s => s.id === shapeId);
      const verts = shape?.vertices;
      if (verts && verts.length >= 3) {
        return verts.map(v => ({ x: x + v.x * size, y: y + v.y * size }));
      }
      // Fallback: box
      const h = size / 2;
      return [
        { x: x - h, y: y - h }, { x: x + h, y: y - h },
        { x: x + h, y: y + h }, { x: x - h, y: y + h }
      ];
    }

    // Check if position overlaps existing blocks — SAT по реальным вершинам
    function isPositionBlocked(x, y, size, shapeId) {
      shapeId = shapeId ?? currentShapeId;
      const placementVerts = _placementVerts(x, y, size, shapeId);

      for (const block of state.blocks) {
        if (!block.body) continue;

        const blockVerts = _blockWorldVerts(block);
        if (!blockVerts) {
          // Нет вершин — fallback AABB
          const pos  = block.body.GetPosition();
          const bh   = (block.size || BLOCK_SIZE) / 2;
          if (Math.abs(x - pos.get_x()) < (size/2 + bh) &&
              Math.abs(y - pos.get_y()) < (size/2 + bh)) return true;
          continue;
        }

        if (_satOverlap(placementVerts, blockVerts)) return true;
      }
      return false;
    }


    // ═══════════════════════════════════════════════════════════════════════
    // DEBUG SNAPSHOT — overlap analysis
    // ═══════════════════════════════════════════════════════════════════════
    const _overlapDebug = {
      snap1: null,  // первый снапшот (статичный блок)
      snap2: null,  // второй снапшот (момент клика)
      active: false // режим ожидания второго снапшота
    };

    function _takeOverlapSnapshot(label, worldX, worldY) {
      const blocks = state.blocks.map(b => {
        if (!b.body) return null;
        const pos = b.body.GetPosition();
        return {
          id: b.uid ?? null,
          shape: b.shape,
          shapeId: b.shapeId,
          size: b.size,
          isTerrain: b.isTerrain ?? false,
          pos: { x: pos.get_x(), y: pos.get_y() },
          angle: b.body.GetAngle(),
          vertices: b.vertices ?? null,
          worldVerts: _blockWorldVerts(b)
        };
      }).filter(Boolean);

      const sizeMultiplier = window.terrainMode ? 5 : 1;
      const placementSize  = BLOCK_SIZE * sizeMultiplier;
      const placementVerts = worldX != null
        ? _placementVerts(worldX, worldY, placementSize, currentShapeId)
        : null;

      return {
        label,
        timestamp: Date.now(),
        cursor: worldX != null ? { x: worldX, y: worldY } : null,
        placementSize,
        shapeId: currentShapeId,
        placementVerts,
        blocks,
        scaledTileSize,
        zoom,
        panX, panY
      };
    }

    function _downloadOverlapDebug() {
      const data = {
        snap1: _overlapDebug.snap1,
        snap2: _overlapDebug.snap2,
        note: 'snap1 = static scene, snap2 = at click moment'
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'overlap_debug_' + Date.now() + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      console.log('[OverlapDebug] Downloaded. Resetting.');
      _overlapDebug.snap1 = null;
      _overlapDebug.snap2 = null;
      _overlapDebug.active = false;
    }

    // Триггер: Shift+D
    // Первое нажатие → snap1 (сцена без cursor)
    // Второй снапшот берётся автоматически при следующем клике на canvas (wall tool)
    function triggerOverlapDebug() {
      if (!_overlapDebug.active) {
        _overlapDebug.snap1 = _takeOverlapSnapshot('before_placement', null, null);
        _overlapDebug.active = true;
        console.log('[OverlapDebug] Snap1 taken. Now click to place — snap2 will fire automatically.');
      } else {
        // Повторное Shift+D сбрасывает
        _overlapDebug.snap1 = null;
        _overlapDebug.snap2 = null;
        _overlapDebug.active = false;
        console.log('[OverlapDebug] Reset.');
      }
    }

    function addBlock(x, y, options = {}) {
      if (!state.world || !Physics.ready) return null;

      const sizeMultiplier = options.sizeMultiplier ?? 1;
      const size = (options.size ?? BLOCK_SIZE) * sizeMultiplier;
      const shapeId = options.shapeId ?? currentShapeId;

      // Prevent overlapping placement (unless loading from save or combine mode)
      if (!options.fromSave && !options.combine && isPositionBlocked(x, y, size)) {
        return null;  // Can't place here - blocked
      }

      // Look up shape in catalog
      const catalogShape = window.shapeCatalog?.find(s => s.id === shapeId);

      const body = createDynamicBody(state.world, x, y, {
        linearDamping: options.linearDamping ?? 0,
        angularDamping: options.angularDamping ?? 0
      });

      // COMBINE multiVerts: каждый кусок — отдельный fixture, одно тело
      if (options.multiVerts && Array.isArray(options.multiVerts)) {
        const sz = options.size ?? (BLOCK_SIZE * (options.sizeMultiplier ?? 1));
        options.multiVerts.forEach(piece => {
          const flat = piece.flatMap(v => [v.x, v.y]);
          try {
            const indices = PolyK.Triangulate(flat);
            for (let i = 0; i < indices.length; i += 3) {
              const tri = [
                { x: piece[indices[i]].x   * sz, y: piece[indices[i]].y   * sz },
                { x: piece[indices[i+1]].x * sz, y: piece[indices[i+1]].y * sz },
                { x: piece[indices[i+2]].x * sz, y: piece[indices[i+2]].y * sz }
              ];
              addPolygonFixture(body, tri, { density: options.density ?? 2, friction: 0.8, restitution: 0.1 });
            }
          } catch(e) {}
        });
        // Сохранить объединённые вершины для рендера
        const block = {
          uid: options.uid || physicsWorker.getUid(),
          body, size: sz,
          shapeId: options.shapeId ?? currentShapeId,
          shape: 'polygon',
          vertices: options.multiVerts[0] || [], // Use first piece for fallback
          multiVerts: options.multiVerts,
          surfaceVerts: options.surfaceVerts || null,
          color: options.color || (colorPicker ? colorPicker.colors[1].hexString : '#4ECDC4'),
          tile_ID: options.tile_ID ?? 0,
          isWall: options.isWall ?? false,
          integrity: options.integrity ?? 100,
          burned: options.burned ?? false,
          gravity: options.gravity ?? null,
          isTerrain: options.isTerrain ?? false
        };
        setBodyUserData(body, { type: 'block', ref: block });
        block._colorDirty = true;
        state.blocks.push(block);
        return block;
      }

      // Determine shape type and add appropriate fixture
      let shapeType = 'box';  // for rendering

      if (catalogShape) {
        if (catalogShape.type === 'primitive' && catalogShape.primitive === 'box') {
          // Box primitive
          shapeType = 'box';
          addBoxFixture(body, size / 2, size / 2, {
            density: options.density ?? 2,
            friction: 0.8,
            restitution: options.restitution ?? 0.1
          });
        } else if (catalogShape.id === 'circle') {
          // Circle - use fan triangulation (more efficient)
          shapeType = 'circle';
          addCircleFixture(body, size / 2, {
            density: options.density ?? 2,
            friction: 0.8,
            restitution: options.restitution ?? 0.3
          });
        } else if (catalogShape.type === 'polygon' || catalogShape.vertices) {
          // Custom polygon - use triangles for Box2D
          shapeType = 'polygon';
          const triangles = catalogShape.triangles || [];
          const vertices = options.vertices || catalogShape.vertices || [];

          if (triangles.length > 0) {
            // Add each triangle as a separate fixture
            let fixturesAdded = 0;
            triangles.forEach((tri, idx) => {
              const scaledVerts = tri.map(v => ({ x: v.x * size, y: v.y * size }));
              const ok = addPolygonFixture(body, scaledVerts, {
                density: options.density ?? 2,
                friction: 0.8,
                restitution: options.restitution ?? 0.1
              });
              if (ok) fixturesAdded++;
            });
            if (fixturesAdded < triangles.length) {
            }
          } else if (vertices.length >= 3) {
            // Triangulate on the fly
            const flat = vertices.flatMap(v => [v.x, v.y]);
            const indices = PolyK.Triangulate(flat);
            for (let i = 0; i < indices.length; i += 3) {
              const tri = [
                { x: vertices[indices[i]].x * size, y: vertices[indices[i]].y * size },
                { x: vertices[indices[i+1]].x * size, y: vertices[indices[i+1]].y * size },
                { x: vertices[indices[i+2]].x * size, y: vertices[indices[i+2]].y * size }
              ];
              addPolygonFixture(body, tri, {
                density: options.density ?? 2,
                friction: 0.8,
                restitution: options.restitution ?? 0.1
              });
            }
          }
        }
      } else {
        // Fallback to legacy shape parameter
        const shape = options.shape ?? blockShape;
        shapeType = shape;
        if (shape === 'circle') {
          addCircleFixture(body, size / 2, {
            density: options.density ?? 2,
            friction: 0.8,
            restitution: options.restitution ?? 0.3
          });
        } else {
          addBoxFixture(body, size / 2, size / 2, {
            density: options.density ?? 2,
            friction: 0.8,
            restitution: options.restitution ?? 0.1
          });
        }
      }

      const uid = options.uid || physicsWorker.getUid();

      // Default vertices for primitives (normalized -0.5 to 0.5)
      let blockVertices = options.vertices || catalogShape?.vertices || null;
      if (!blockVertices) {
        if (shapeType === 'box') {
          blockVertices = [
            { x: -0.5, y: -0.5 }, { x: 0.5, y: -0.5 },
            { x: 0.5, y: 0.5 }, { x: -0.5, y: 0.5 }
          ];
        } else if (shapeType === 'circle') {
          // Generate circle vertices based on size (normalized to 0.5 radius)
          // Use same logic as generateCircleVertices but normalized
          const fullRadius = size / 2;
          let numVerts = 32;
          if (fullRadius < 0.8) numVerts = 16;
          else if (fullRadius > 1.6) numVerts = 64;

          blockVertices = [];
          for (let i = 0; i < numVerts; i++) {
            const angle = (i / numVerts) * Math.PI * 2;
            blockVertices.push({ x: Math.cos(angle) * 0.5, y: Math.sin(angle) * 0.5 });
          }
        }
      }

      const block = {
        uid,
        body,
        size,
        shapeId,  // Store catalog shape ID
        shape: shapeType, // Store shape type for rendering
        vertices: blockVertices, // Store vertices for polygon rendering & terrain gravity
        color: options.color || catalogShape?.color || (colorPicker ? colorPicker.colors[1].hexString : '#4ECDC4'),
        tile_ID: options.tile_ID ?? 0,
        isWall: options.isWall ?? false,
        integrity: options.integrity ?? 100,
        burned: options.burned ?? false,
        // Per-block gravity properties (null = use global)
        gravity: options.gravity ?? null,  // { radius, strength, minDist } or null
        isTerrain: options.isTerrain ?? false
      };

      setBodyUserData(body, { type: 'block', ref: block });

      if (typeof options.angle === 'number') {
        const pos = body.GetPosition();
        body.SetTransform(pos, options.angle);
      }
      if (options.velocity) {
        body.SetLinearVelocity(getVec2(options.velocity.x, options.velocity.y));
      }
      if (typeof options.angularVelocity === 'number') {
        body.SetAngularVelocity(options.angularVelocity);
      }

      // Register with Physics Worker
      physicsWorker.createBody(uid, x, y, size, shapeType, {
          isStatic: false,
          density: options.density ?? 2,
          friction: 0.8,
          restitution: options.restitution ?? 0.1,
          angle: options.angle || 0,
          velocity: options.velocity,
          linearDamping: options.linearDamping ?? 0.05,
          angularDamping: options.angularDamping ?? 0.05
      });

      block._colorDirty = true;
      state.blocks.push(block);
      return block;
    }

    function addBlockFromData(data) {
      // For polygon shapes with saved vertices, ensure they're in the catalog
      const shapeId = data.shapeId ?? data.shape ?? 'box';

      if (data.shape === 'polygon' && data.vertices && !window.shapeCatalog.find(s => s.id === shapeId)) {
        // Use pre-saved triangles if available (already has correct winding order)
        let triangles = data.triangles || null;

        // Triangulate if no saved triangles (legacy data)
        if (!triangles) {
          const flat = data.vertices.flatMap(v => [v.x, v.y]);
          const indices = PolyK.Triangulate(flat);
          triangles = [];
          for (let i = 0; i < indices.length; i += 3) {
            triangles.push([
              data.vertices[indices[i]],
              data.vertices[indices[i + 1]],
              data.vertices[indices[i + 2]]
            ]);
          }
        }
        window.shapeCatalog.push({
          id: shapeId,
          name: 'Custom',
          type: 'polygon',
          vertices: data.vertices,
          triangles: triangles,
          color: data.color
        });
      }

      return addBlock(
        data.position?.x ?? 0,
        data.position?.y ?? 0,
        {
          uid: data.uid,
          color: data.color,
          tile_ID: data.tile_ID ?? 0,
          isWall: data.isWall ?? false,
          size: data.size,
          shape: data.shape ?? 'box',
          shapeId: shapeId,
          vertices: data.vertices,
          integrity: data.integrity ?? 100,
          burned: data.burned ?? false,
          angle: data.angle,
          velocity: data.velocity,
          angularVelocity: data.angularVelocity,
          gravity: data.gravity ?? null,  // Per-block gravity
          isTerrain: data.isTerrain ?? false,  // Terrain flag
          multiVerts: data.multiVerts,     // Restore multi-fixture structure
          fromSave: true  // Skip overlap check when loading
        }
      );
    }

    function addLight(x, y, angle = 0, options = {}) {
      if (!state.world || !Physics.ready) return null;

      const body = createDynamicBody(state.world, x, y, {
        linearDamping: options.linearDamping ?? 0,   // No damping - pure Newtonian physics
        angularDamping: options.angularDamping ?? 0  // No damping - spins forever in zero-g
      });

      addCircleFixture(body, 0.4, {
        density: options.density ?? 0.9,
        friction: 0.2,
        restitution: 0.7
      });

      const color = Array.isArray(options.color)
        ? options.color.slice(0, 3)
        : hexToRgb(options.color || (colorPicker ? colorPicker.colors[0].hexString : '#FFFFFF'));

      const light = {
        body,
        angle,
        rays: options.rays ?? lightRays,
        maxDist: options.maxDist ?? lightDist,
        fov: options.fov ?? lightFov,
        color,
        brightness: options.brightness ?? lightBrightness,  // Light intensity (0.1 - 2.0)
        integrity: options.integrity ?? 100,
        burned: options.burned ?? false
      };

      setBodyUserData(body, { type: 'light', ref: light });

      if (options.velocity) {
        body.SetLinearVelocity(getVec2(options.velocity.x, options.velocity.y));
      }
      if (typeof options.angularVelocity === 'number') {
        body.SetAngularVelocity(options.angularVelocity);
      }

      light._colorDirty = true;
      state.lights.push(light);
      return light;
    }

    function addLightFromData(data) {
      return addLight(
        data.position?.x ?? 0,
        data.position?.y ?? 0,
        data.angle ?? 0,
        {
          rays: data.rays,
          maxDist: data.maxDist,
          fov: data.fov,
          color: data.color,
          brightness: data.brightness ?? 1.0,
          integrity: data.integrity ?? 100,
          burned: data.burned ?? false,
          velocity: data.velocity,
          angularVelocity: data.angularVelocity
        }
      );
    }

    function removeBlock(block,  emitEvent = true) {
      if (!block || !block.body) return;

      // Remove from worker
      if (block.uid) {
        physicsWorker.destroyBody(block.uid);
      }

      // Free named shape
      if (renderer) renderer.freeShape(block);

      const idx = state.blocks.indexOf(block);
      if (idx !== -1) { state.blocks.splice(idx, 1); if (block.isTerrain) rebuildTerrainSurface(); }

      // Clean up thruster bindings
      for (const key in thrusterBindings) {
        if (thrusterBindings[key]?.block === block) {
          thrusterBindings[key] = null;
        }
      }

      try {
        state.world.DestroyBody(block.body);
      } catch (e) {}

      block.body = null;
      if (emitEvent) eventBus.emit('block_destroyed');
    }

    function removeLight(light) {
      if (!light || !light.body) return;

      // Free named shape
      if (renderer) renderer.freeShape(light);

      const idx = state.lights.indexOf(light);
      if (idx !== -1) state.lights.splice(idx, 1);

      // Clean up lazer binding
      if (lazerBinding.light === light) {
        lazerBinding.light = null;
      }

      try {
        state.world.DestroyBody(light.body);
      } catch (e) {}

      light.body = null;
      eventBus.emit('light_destroyed');
    }


    // ═══════════════════════════════════════════════════════════════════════
    // WELLS — particle emitter objects
    // ═══════════════════════════════════════════════════════════════════════

    function addWell(x, y, options = {}) {
      // Well — образная точка в мире, без физического тела.
      // Координаты статичны; источник испускает частицы по таймеру.
      const well = {
        x:        x,
        y:        y,
        type:     options.type     ?? liquidDream.currentType ?? 'water',
        interval: options.interval ?? 0.5,
        life:     options.life     ?? -1,
        force:    options.force    ?? null,
        forceOn:  options.forceOn  ?? false,
        radius:   options.radius   ?? 0.4,
        _age:     0,
        _timer:   0
      };
      state.wells.push(well);
      return well;
    }

    function removeWell(well) {
      const idx = state.wells.indexOf(well);
      if (idx !== -1) state.wells.splice(idx, 1);
    }

    // Проверить перекрытие Well: любой блок или лайт в радиусе = источник заблокирован
    function isWellBlocked(x, y, radius) {
      const r = radius;
      for (const block of state.blocks) {
        if (!block.body) continue;
        const pos = block.body.GetPosition();
        const dx = x - pos.get_x();
        const dy = y - pos.get_y();
        const bHalf = (block.size || BLOCK_SIZE) / 2;
        if (Math.abs(dx) < (r + bHalf) && Math.abs(dy) < (r + bHalf)) return true;
      }
      for (const light of state.lights) {
        if (!light.body) continue;
        const pos = light.body.GetPosition();
        const dx = x - pos.get_x();
        const dy = y - pos.get_y();
        if (dx * dx + dy * dy < (r + 0.4) * (r + 0.4)) return true;
      }
      return false;
    }


    function updateWells(dt) {
      for (let i = state.wells.length - 1; i >= 0; i--) {
        const well = state.wells[i];

        if (well.life > 0) {
          well._age += dt;
          if (well._age >= well.life) {
            state.wells.splice(i, 1);
            continue;
          }
        }

        well._timer += dt;
        if (well._timer >= well.interval) {
          well._timer -= well.interval;
          // Источник заблокирован — пропустить тик
          if (!isWellBlocked(well.x, well.y, well.radius)) {
            const opts = {
              type:   well.type,
              radius: well.radius,
              color:  liquidDream.colors[well.type] ?? liquidDream.colors.water
            };
            if (well.forceOn && well.force) {
              opts.velocity = { x: well.force.x, y: well.force.y };
            }
            createParticleGroup(well.x, well.y, opts);
            _sceneDirty = true;
          }
        }
      }
    }

    function rebuildWorld(data = {}) {
      // CRITICAL: Physics must be initialized
      if (!Physics.ready || !Physics.b2World) {
        return;
      }

      stopPhysics(true);
      clearZdogShapes();

      // 0. Restore custom shapes to catalog first
      if (Array.isArray(data.customShapes)) {
        data.customShapes.forEach(shape => {
          if (!window.shapeCatalog.find(s => s.id === shape.id)) {
            window.shapeCatalog.push(shape);
          }
        });
        window.dispatchEvent(new CustomEvent('shape-catalog-updated'));
      }

      // 1. Restore camera
      if (typeof data.camZoom === 'number' && isFinite(data.camZoom) && data.camZoom > 0) {
        zoom = data.camZoom;
      } else if (!isFinite(zoom) || zoom <= 0) {
        zoom = 1;
      }
      const dpr = window.devicePixelRatio || 1;
      scaledTileSize = tileSize * dpr * zoom;

      if (typeof data.camPanX === 'number' && isFinite(data.camPanX)) panX = data.camPanX;
      else if (!isFinite(panX)) panX = 0;
      if (typeof data.camPanY === 'number' && isFinite(data.camPanY)) panY = data.camPanY;
      else if (!isFinite(panY)) panY = 0;

      // Extract data arrays
      const prevBlocks = Array.isArray(data.blocks) ? data.blocks : null;
      const prevLights = Array.isArray(data.lights) ? data.lights : null;
      const prevDebris = Array.isArray(data.debris) ? data.debris : null;
      const prevJoints = Array.isArray(data.joints) ? data.joints : null;
      const prevThrusters = data.thrusters || {};

      // 2. Destroy old world completely (prevents memory leak)
      if (state.world) {
        // Debris bodies are part of the world, will be destroyed with it
        debris.length = 0;

        // Destroy particle system first
        // Уничтожаем System A (единственная система)
        if (state.particleSystemA) {
          try { state.world.DestroyParticleSystem(state.particleSystemA); } catch (e) {}
          state.particleSystemA = null;
        }
        state.particleSystem = null;

        // Destroy the old world - this destroys all bodies, joints, fixtures
        try {
          Physics.b2?.destroy?.(state.world);
        } catch (e) {}
        state.world = null;
      }

      // 3. Create fresh physics world
      const gravity = getVec2(0, 0);
      state.world = new Physics.b2World(gravity);
      if (renderer) renderer.freeAll();
      state.blocks = [];
      state.lights = [];
      state.wells  = [];
      state.joints = [];

      // 4. Create particle systems
      // ═══ SIMPLE DUAL SYSTEM ═══
      // System A = WATER only (collides with hero)
      // System B = FOG/AIR only (collides with hero)
      // Water and fog pass through each other (different systems)!
      if (Physics.b2ParticleSystemDef) {
        // System A - WATER (like old version: no damping, no pressure)
        const psdA = new Physics.b2ParticleSystemDef();
        psdA.set_radius(0.03);                         // Water size
        psdA.set_surfaceTensionNormalStrength(0.05);   // Cohesion — поверхностное натяжение
        psdA.set_surfaceTensionPressureStrength(0.012);// Внутреннее давление — упругость
        // NO damping, NO pressure - pure free-flowing
        state.particleSystemA = state.world.CreateParticleSystem(psdA);

        // System B удалена — газы будут реализованы через LiquidFun flags в System A

        // Legacy alias for compatibility
        state.particleSystem = state.particleSystemA;
      }

      // 5. Restore blocks
      if (prevBlocks) {
        prevBlocks.forEach(addBlockFromData);
      }

      // 6. Restore lights
      if (prevLights) {
        prevLights.forEach(addLightFromData);
      }

      // 7. Restore debris
      if (prevDebris) {
        prevDebris.forEach(d => {
          if (!d.verts || d.verts.length < 3) return;
          try {
            const centroid = { x: 0, y: 0 };
            d.verts.forEach(v => { centroid.x += v.x; centroid.y += v.y; });
            centroid.x /= d.verts.length;
            centroid.y /= d.verts.length;

            const body = createDynamicBody(state.world, d.position?.x ?? centroid.x, d.position?.y ?? centroid.y, {
              linearDamping: 0,
              angularDamping: 0
            });

            addPolygonFixture(body, d.verts, { density: 2, friction: 0.8, restitution: 0.1 });

            if (d.velocity) body.SetLinearVelocity(getVec2(d.velocity.x, d.velocity.y));
            if (d.angularVelocity) body.SetAngularVelocity(d.angularVelocity);
            if (d.angle) {
              const pos = body.GetPosition();
              body.SetTransform(pos, d.angle);
            }

            setBodyUserData(body, { type: 'debris' });

            // Restore texture from base64
            let texture = null;
            if (d.textureDataURL) {
              texture = document.createElement('canvas');
              const img = new Image();
              img.onload = () => {
                texture.width = img.width;
                texture.height = img.height;
                texture.getContext('2d').drawImage(img, 0, 0);
              };
              img.src = d.textureDataURL;
            }

            debris.push({
              body,
              color: d.color,
              verts: d.verts,
              texture,
              texBounds: d.texBounds
            });
          } catch (e) {}
        });
      }

      // 8. Restore joints (AFTER all bodies exist)
      if (prevJoints) {
        prevJoints.forEach(jData => {
          const blockA = state.blocks[jData.bodyAIndex];
          const blockB = state.blocks[jData.bodyBIndex];
          if (!blockA?.body || !blockB?.body) return;

          try {
            const localA = new Physics.b2Vec2(jData.localAnchorA?.x ?? 0, jData.localAnchorA?.y ?? 0);
            const localB = new Physics.b2Vec2(jData.localAnchorB?.x ?? 0, jData.localAnchorB?.y ?? 0);

            if (jData.type === 'distance') {
              createDistanceJoint(state.world, blockA.body, blockB.body, localA, localB, jData);
            } else if (jData.type === 'revolute') {
              createRevoluteJoint(state.world, blockA.body, blockB.body, localA, localB, jData);
            } else if (jData.type === 'weld') {
              createWeldJoint(state.world, blockA.body, blockB.body, localA, localB, jData);
            } else if (jData.type === 'rope') {
              createRopeJoint(state.world, blockA.body, blockB.body, localA, localB, jData);
            } else if (jData.type === 'prismatic') {
              const axis = getVec2(jData.axis?.x ?? 1, jData.axis?.y ?? 0);
              createPrismaticJoint(state.world, blockA.body, blockB.body, localA, localB, axis, jData);
            }

            Physics.destroy?.(localA);
            Physics.destroy?.(localB);
          } catch (e) {}
        });
      }

      // 9. Restore particles
      if (data.particles && data.particles.count > 0 && state.particleSystem && Physics.b2ParticleDef) {
        const { count, positions, colors } = data.particles;
        const b2 = Physics.b2;

        // Create particle definition
        const pd = new Physics.b2ParticleDef();
        pd.set_flags(Physics.b2_waterParticle || 0);

        for (let i = 0; i < count; i++) {
          const x = positions[i * 2];
          const y = positions[i * 2 + 1];
          pd.get_position().set_x(x);
          pd.get_position().set_y(y);

          // Set color if available
          if (colors) {
            const col = pd.get_color();
            col.Set(colors[i * 4], colors[i * 4 + 1], colors[i * 4 + 2], colors[i * 4 + 3]);
          }

          state.particleSystem.CreateParticle(pd);
        }

        Physics.destroy?.(pd);
      }

      // Restore thruster bindings
      for (const key in prevThrusters) {
        const binding = prevThrusters[key];
        if (binding && typeof binding.blockIndex === 'number') {
          const block = state.blocks[binding.blockIndex];
          if (block) {
            thrusterBindings[key] = { block, edgeIndex: binding.edgeIndex };
            // Update UI button
            const btnId = getThrusterButtonId(key);
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = '✓';
          }
        }
      }
      // Clear UI for unbound thrusters
      for (const key in thrusterBindings) {
        if (!thrusterBindings[key]) {
          const btnId = getThrusterButtonId(key);
          const btn = document.getElementById(btnId);
          if (btn) btn.textContent = '✕';
        }
      }

      // Restore lazer binding
      if (data.lazer && typeof data.lazer.lightIndex === 'number') {
        const light = state.lights[data.lazer.lightIndex];
        if (light) {
          lazerBinding.light = light;
          lazerBinding.pewRays = data.lazer.pewRays ?? 60;
          lazerBinding.pewFov = data.lazer.pewFov ?? 360;
          if (data.lazer.sound) {
            lazerBinding.sound = data.lazer.sound;
            setupLazerSound(data.lazer.sound);
          }
        }
      }

      // Restore event sounds
      if (data.eventSounds) {
        for (const key in data.eventSounds) {
          if (data.eventSounds[key]) {
            eventSounds[key] = data.eventSounds[key];
            if (key.startsWith('engine_')) {
              const engineType = key.replace('engine_', '');
              setupEngineSound(engineType, data.eventSounds[key]);
            }
          }
        }
      }

      // Restore blocks with attached gravity to shapeGravityBodies set
      shapeGravityBodies.clear();
      state.blocks.forEach(block => {
        if (block.gravity) {
          block.hasShapeGravity = true;
          block.savedMass = block.body.GetMass();
          // Restore isTerrain flag from gravity object
          if (block.gravity.isTerrain) {
            block.isTerrain = true;
          }
          shapeGravityBodies.add(block);
          // Convert to kinematic (gravity sources don't move)
          block.body.SetType(Physics.b2_kinematicBody);
          block.body.SetLinearVelocity(getVec2(0, 0));
          block.body.SetAngularVelocity(0);
        }
      });

    }
    window.rebuildWorld = rebuildWorld;
    window.rebuildTerrainSurface = rebuildTerrainSurface;
    // После загрузки — пересчитать поверхность
    const _origRebuildWorld = rebuildWorld;
    rebuildWorld = function(data) { _origRebuildWorld(data); rebuildTerrainSurface(); };
    window.rebuildWorld = rebuildWorld;

    function findBodyByIndex(index) {
      if (index == null) return null;
      const allBodies = [...state.blocks, ...state.lights];
      if (index >= 0 && index < allBodies.length) {
        return allBodies[index].body;
      }
      return null;
    }

    function getBodyIndex(body) {
      const allBodies = [...state.blocks.map(b => b.body), ...state.lights.map(l => l.body)];
      return allBodies.indexOf(body);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // JOINT CREATION (UI)
    // ═════════════════���═════════════════════════════════════════════════════

    function createJointFromUI(bodyA, bodyB, anchorAx, anchorAy, anchorBx, anchorBy) {
      if (!state.world || !bodyA || !bodyB) return;

      const jointType = currentJointType;

      // IMPORTANT: Create NEW b2Vec2 objects - don't use getVec2 pool!
      const worldAnchorA = new Physics.b2Vec2(anchorAx, anchorAy);
      const worldAnchorB = new Physics.b2Vec2(anchorBx, anchorBy);

      // Convert world coords to local coords
      // CRITICAL: GetLocalPoint returns a POOLED object - copy values IMMEDIATELY!
      const localAnchorARaw = bodyA.GetLocalPoint(worldAnchorA);
      // Copy A values RIGHT NOW before calling GetLocalPoint again
      const localAx = localAnchorARaw.get_x();
      const localAy = localAnchorARaw.get_y();

      const localAnchorBRaw = bodyB.GetLocalPoint(worldAnchorB);
      // Copy B values
      const localBx = localAnchorBRaw.get_x();
      const localBy = localAnchorBRaw.get_y();

      // Now create fresh b2Vec2 with copied values
      const localAnchorA = new Physics.b2Vec2(localAx, localAy);
      const localAnchorB = new Physics.b2Vec2(localBx, localBy);

      const collideConnected = jointCollide;

      try {
        if (jointType === 'revolute') {
          createRevoluteJoint(state.world, bodyA, bodyB, localAnchorA, localAnchorB, {
            enableMotor: jointMotorEnabled,
            motorSpeed: jointMotorSpeed,
            maxMotorTorque: jointMaxTorque,
            enableLimit: jointLimitEnabled,
            lowerAngle: jointLowerAngle * Math.PI / 180,
            upperAngle: jointUpperAngle * Math.PI / 180,
            collideConnected
          });
        } else if (jointType === 'distance') {
          // Box2D 2.4+ uses stiffness/damping (not frequencyHz/dampingRatio)
          // stiffness=0 means rigid constraint, higher values make it springy
          createDistanceJoint(state.world, bodyA, bodyB, localAnchorA, localAnchorB, {
            stiffness: 0,  // Rigid distance constraint
            damping: 0,
            collideConnected
          });
        }
        eventBus.emit('joint_created');
      } catch (e) {
        
      }
    }

    // ═════════════════════════════════════════���═════════════════════════════
    // PHYSICS LOOP
    // ═══════════════════════════════════════════════════════════════════════

    let physicsAnimFrame = null;
    let lastPhysicsTime = 0;

    function startPhysics() {
      if (window.isPlaying) return;
      window.isPlaying = true;
      // Tweakpane playback binding is updated via tpPanes.playbackParams if needed
      lastPhysicsTime = performance.now();
      physicsAnimFrame = requestAnimationFrame(physicsLoop);
    }

    function stopPhysics(silent = false) {
      window.isPlaying = false;
      // Don't cancel RAF - cursor needs to keep rendering
    }

    function togglePlay() {
      if (window.isPlaying) {
        stopPhysics();
      } else {
        startPhysics();
      }
    }

    function toggleFullscreen() {
      if (!document.body.classList.contains('fake-fullscreen')) {
        // Enter fake fullscreen
        document.body.classList.add('fake-fullscreen');
        if (fullscreenIcon) fullscreenIcon.textContent = '⛶';
        if (fullscreenText) fullscreenText.textContent = 'Exit';
        setTimeout(() => {
          resizeCanvas();
          draw();
        }, 50);
      } else {
        // Exit fake fullscreen
        document.body.classList.remove('fake-fullscreen');
        if (fullscreenIcon) fullscreenIcon.textContent = '⛶';
        if (fullscreenText) fullscreenText.textContent = 'Fullscreen';
        setTimeout(() => {
          resizeCanvas();
          draw();
        }, 50);
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PHASE 3: Fixed Timestep Loop (from original loop.ts)
    // ═══════════════════════════════════════════════════════════════════════
    const FRAME_RATE = 60;
    const FRAME_INTERVAL_MS = 1000 / FRAME_RATE;  // 16.666ms
    const FRAME_INTERVAL_SEC = 1 / FRAME_RATE;    // 0.01666s
    const TOLERANCE_MS = 0.2;                      // "close enough" to 1/60th
    const MAX_INTERVAL_MS = FRAME_INTERVAL_MS * 5; // Max 5 frames of debt (83ms)
    const PHYSICS_DEADLINE_MS = FRAME_INTERVAL_MS * 0.9;  // 90% budget for physics (~15ms)

    let timeDebtMs = 0;
    let simulationSpeed = 100;  // percentage

    function physicsLoop(time) {
      // Always render cursor (independent of physics state)
      zdogCursor.render();

      if (!window.isPlaying) {
        if (_sceneDirty) { draw(); _sceneDirty = false; }
        physicsAnimFrame = requestAnimationFrame(physicsLoop);
        return;
      }

      const elapsedMs = time - lastPhysicsTime;
      lastPhysicsTime = time;

      // Fixed timestep with time debt accumulation
      const intendedMs = elapsedMs + timeDebtMs;
      let toSimulateMs = intendedMs;
      let iterations = 0;
      let badDebtMs = 0;
      const beforePhysicsMs = performance.now();

      // Simulate in fixed 1/60th steps
      while (toSimulateMs >= FRAME_INTERVAL_MS - TOLERANCE_MS) {
        // Check physics deadline (throttle if CPU struggling)
        if (iterations > 0) {
          const computationTimeMs = performance.now() - beforePhysicsMs;
          const avgIterationMs = computationTimeMs / iterations;
          if (computationTimeMs + avgIterationMs > PHYSICS_DEADLINE_MS) {
            // Not enough time - throttle to let CPU cool
            badDebtMs = toSimulateMs;
            toSimulateMs = 0;
            break;
          }
        }

        iterations++;
        const stepMs = Math.min(toSimulateMs, FRAME_INTERVAL_MS + TOLERANCE_MS);
        const stepSec = stepMs / 1000;

        // Apply forces before step
        if (gravityEnabled && pointer.active) {
          applyPointerGravity();
        }
        applyShapeGravity();
        // Color-переходы частиц — ровно один раз на step, независимо от
        // количества гравитационных источников (раньше вызывалось внутри
        // applyShapeGravity: N источников = N× скорость, 0 источников = стоп)
        stepParticleColorTransitions(FRAME_INTERVAL_SEC);
        applyThrusterForces();

        // Apply hero movement (simulate mode) - BEFORE physics step
        if (simulateMode && heroSpawned) {
          applyHeroMovement();
          // Update contact count and check grounding
          updateHeroContactCount();
          const grounded = isHeroGrounded();
          // Can jump only when grounded
          heroCanJump = grounded;
          // Update gravity state
          heroHasGravity = gravityEnabled || shapeGravityBodies.size > 0;
          // Update hero systems (hunger decay, stamina regen)
          updateHeroSystems(stepSec);
          // Update hero status UI (throttled to 10fps — DOM writes are expensive)
          if (time - _heroUILastUpdate > 100) {
            updateHeroStatusUI();
            _heroUILastUpdate = time;
          }
        }

        // Step physics with fixed timestep
        if (state.world) {
          state.world.Step(FRAME_INTERVAL_SEC, 4, 2, 5);  // Always 1/60th for stability
        }
        physicsWorker.step(FRAME_INTERVAL_SEC);

        // PLUGIN_UPDATE hook - runs every physics step
        window.DreamPlugins.runUpdate(FRAME_INTERVAL_SEC);

        toSimulateMs -= stepMs;
      }

      // Accumulate remaining time as debt (capped)
      timeDebtMs = Math.min(toSimulateMs, MAX_INTERVAL_MS);

      // Calculate simulation speed for stats
      const actuallySimulatedMs = intendedMs - toSimulateMs - badDebtMs;
      simulationSpeed = intendedMs > 0 ? (actuallySimulatedMs / intendedMs * 100) : 100;

      // Update systems that use real delta (animations, not physics)
      const realDelta = elapsedMs / 1000;
      updateLazerAnimation(realDelta);
      if (window.Qube) window.Qube.update(realDelta);
      updateDebris(realDelta);
      updateWells(realDelta);

      // Update camera follow hero (simulate mode) - AFTER physics step
      if (simulateMode && heroSpawned) {
        updateCameraFollowHero();
      }

      // Draw (skip if nothing simulated - throttled)
      if (iterations > 0) {
        draw();
      }

      // FPS counter
      frameCount++;
      if (time - lastFrameTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastFrameTime = time;
      }

      physicsAnimFrame = requestAnimationFrame(physicsLoop);
    }

    // Reusable temp variables for hot paths (avoid GC pressure)
    const _tempGravity = { dx: 0, dy: 0, dist: 0, strength: 0, nx: 0, ny: 0 };

    function applyPointerGravity() {
      const mult = gravityMode === 'repel' ? -1 : 1;
      const t = _tempGravity;
      let pos, body;

      // Process blocks
      for (let i = 0, len = state.blocks.length; i < len; i++) {
        body = state.blocks[i].body;
        if (!body) continue;
        pos = body.GetPosition();
        t.dx = pointer.x - pos.get_x();
        t.dy = pointer.y - pos.get_y();
        t.dist = Math.sqrt(t.dx * t.dx + t.dy * t.dy);

        if (t.dist < gravityRadius && t.dist > gravityMinDist) {
          t.strength = gravityStrength / (t.dist * t.dist + 0.1);
          t.nx = t.dx / t.dist;
          t.ny = t.dy / t.dist;
          body.ApplyForceToCenter(getVec2(t.nx * t.strength * mult, t.ny * t.strength * mult), true);
        }
      }

      // Process lights if enabled
      if (gravityAffectLights) {
        for (let i = 0, len = state.lights.length; i < len; i++) {
          body = state.lights[i].body;
          if (!body) continue;
          pos = body.GetPosition();
          t.dx = pointer.x - pos.get_x();
          t.dy = pointer.y - pos.get_y();
          t.dist = Math.sqrt(t.dx * t.dx + t.dy * t.dy);

          if (t.dist < gravityRadius && t.dist > gravityMinDist) {
            t.strength = gravityStrength / (t.dist * t.dist + 0.1);
            t.nx = t.dx / t.dist;
            t.ny = t.dy / t.dist;
            body.ApplyForceToCenter(getVec2(t.nx * t.strength * mult, t.ny * t.strength * mult), true);
          }
        }
      }

      // Process hero in simulate mode (pointer = constant force toward cursor)
      if (simulateMode && heroBody) {
        pos = heroBody.GetPosition();
        t.dx = pointer.x - pos.get_x();
        t.dy = pointer.y - pos.get_y();
        t.dist = Math.sqrt(t.dx * t.dx + t.dy * t.dy);

        if (t.dist < gravityRadius && t.dist > gravityMinDist) {
          // Constant force toward pointer (no mass for cursor)
          t.strength = 40;  // Fixed comfortable force
          t.nx = t.dx / t.dist;
          t.ny = t.dy / t.dist;
          heroBody.ApplyForceToCenter(getVec2(t.nx * t.strength * mult, t.ny * t.strength * mult), true);
        }
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TERRAIN GRAVITY - Gravity to surface/ramp (closest point on polygon edge)
    // ═══════════════════════════════════════════════════════════════════════

    // Pre-allocated vectors for zero-GC hot path (like gl-matrix pattern)
    const _tvec1 = { x: 0, y: 0 };  // temp vector 1
    const _tvec2 = { x: 0, y: 0 };  // temp vector 2
    const _tvec3 = { x: 0, y: 0 };  // temp vector 3
    const _closestResult = { point: { x: 0, y: 0 }, distance: 0 };
    const _gravResult = { direction: { x: 0, y: 0 }, magnitude: 0, accel: 0, distance: 0 };

    // ═══════════════════════════════════════════════════════════════════════
    // ЕДИНАЯ МОДЕЛЬ ГРАВИТАЦИИ К ПОВЕРХНОСТИ
    // Одна формула для всех: блоки, герой, debris, lights, частицы.
    // accel = strength × SURFACE_GRAVITY_ACCEL × falloff, F = accel × масса тела
    // → все тела падают с одинаковым ускорением (как настоящая гравитация).
    // Масса источника НЕ участвует — силой управляет только слайдер PWR.
    // ═══════════════════════════════════════════════════════════════════════
    const GRAVITY_DEPTH = 2;            // виртуальный центр под поверхностью — сглаживает пик силы у поверхности
    const SURFACE_GRAVITY_ACCEL = 12;   // ускорение у поверхности при strength=1 (подогнано под старый дефолт)
    const MAX_GRAVITY_FORCE = 120;      // клэмп ускорения — защита от взрыва при больших PWR
    const HERO_GRAVITY_FACTOR = 0.85;   // герой на 15% легче — лучше управление (бывший HERO_GRAVITY_SCALE)
    // falloff у поверхности = 1, дальше линейно спадает
    const surfaceGravityFalloff = (distance) =>
      (GRAVITY_DEPTH + 1) / (distance + GRAVITY_DEPTH + 1);

    // Vector math helpers (mutating versions for speed)
    const vecSubTo = (out, a, b) => { out.x = a.x - b.x; out.y = a.y - b.y; return out; };
    const vecDot = (a, b) => a.x * b.x + a.y * b.y;
    const vecLenSq = (v) => v.x * v.x + v.y * v.y;
    const vecLen = (v) => Math.sqrt(v.x * v.x + v.y * v.y);
    const vecNormalizeTo = (out, v) => {
      const len = Math.sqrt(v.x * v.x + v.y * v.y);
      if (len > 0) { out.x = v.x / len; out.y = v.y / len; }
      else { out.x = 0; out.y = 0; }
      return out;
    };
    // Legacy wrappers (allocating) for compatibility
    const vecSub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const vecNormalize = (v) => {
      const len = vecLen(v);
      return len > 0 ? { x: v.x / len, y: v.y / len } : { x: 0, y: 0 };
    };

    // Find closest point on a polygon edge to a target point
    function getClosestPointOnPolygon(target, vertices, bodyPos, bodyAngle, isMulti = false) {
      let closestDist = Infinity;
      let closestPoint = null;

      const cos = Math.cos(bodyAngle);
      const sin = Math.sin(bodyAngle);

      // Helper to process a single loop of vertices
      const processLoop = (loop) => {
        if (!loop || loop.length < 2) return;
        
        // Transform loop vertices to world space
        const worldVerts = loop.map(v => ({
          x: bodyPos.x + v.x * cos - v.y * sin,
          y: bodyPos.y + v.x * sin + v.y * cos
        }));

        for (let i = 0; i < worldVerts.length; i++) {
          const v1 = worldVerts[i];
          const v2 = worldVerts[(i + 1) % worldVerts.length];

          const edgeX = v2.x - v1.x;
          const edgeY = v2.y - v1.y;
          const toTargetX = target.x - v1.x;
          const toTargetY = target.y - v1.y;
          const edgeLenSq = edgeX * edgeX + edgeY * edgeY;

          let t = 0;
          if (edgeLenSq > 0) {
            t = Math.max(0, Math.min(1, (toTargetX * edgeX + toTargetY * edgeY) / edgeLenSq));
          }

          const cx = v1.x + t * edgeX;
          const cy = v1.y + t * edgeY;
          const dx = target.x - cx;
          const dy = target.y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < closestDist) {
            closestDist = dist;
            closestPoint = { x: cx, y: cy };
          }
        }
      };

      if (isMulti && Array.isArray(vertices[0])) {
        vertices.forEach(processLoop);
      } else {
        processLoop(vertices);
      }

      return { point: closestPoint, distance: closestDist };
    }

    // ═══════════════════════════════════════════════════════════════════════
    // BEGIN: calculateSurfaceGravity
    // ЕДИНСТВЕННЫЙ источник правды для гравитации к поверхности.
    // Направление и ускорение к ближайшей точке поверхности источника:
    //   — terrain-блоки: state.terrainSurface (единый контур всей terrain-группы),
    //     параметры — state.terrainGravityParams (порядко-независимые);
    //   — обычный gravity-блок: его собственный полигон (per-block контур).
    // Возвращает { direction, accel, distance } в shared _gravResult.
    // accel — ускорение (сила на единицу массы): все тела падают одинаково.
    // Дублирование при N terrain блоках предотвращается флагом
    // terrainGravityDone в applyShapeGravity.
    // ═══════════════════════════════════════════════════════════════════════
    function calculateSurfaceGravity(targetPos, sourceBlock) {
      if (!sourceBlock.body || !(sourceBlock.vertices || sourceBlock.multiVerts)) return null;

      let point, distance, strength, radius;
      const useUnified = sourceBlock.isTerrain && state.terrainSurface && state.terrainSurface.length > 0;
      if (useUnified) {
        // Единый внешний контур всей terrain-группы
        const result = getClosestPointOnTerrainSurface(targetPos);
        point = result.point; distance = result.distance;
        // Параметры группы (max по блокам) — не зависят от порядка итерации Set
        const tg = state.terrainGravityParams;
        strength = tg?.strength ?? sourceBlock.gravity?.strength ?? gravityStrength;
        radius = tg?.radius ?? sourceBlock.gravity?.radius ?? gravityRadius;
      } else {
        // Поверхность собственного полигона блока
        const pos = sourceBlock.body.GetPosition();
        const angle = sourceBlock.body.GetAngle();
        const bodyPos = { x: pos.get_x(), y: pos.get_y() };
        const isMulti = !!sourceBlock.multiVerts;
        const baseVerts = isMulti ? sourceBlock.multiVerts : sourceBlock.vertices;
        const scale = sourceBlock.size;
        const scaledData = isMulti
          ? baseVerts.map(loop => loop.map(v => ({ x: v.x * scale, y: v.y * scale })))
          : baseVerts.map(v => ({ x: v.x * scale, y: v.y * scale }));
        const r = getClosestPointOnPolygon(targetPos, scaledData, bodyPos, angle, isMulti);
        point = r.point; distance = r.distance;
        strength = sourceBlock.gravity?.strength ?? gravityStrength;
        radius = sourceBlock.gravity?.radius ?? gravityRadius;
      }

      // Need valid point and minimum distance to compute direction
      if (!point || distance < 0.05) return null;
      if (distance > radius) return null;

      // Direction towards closest point on surface (use pre-allocated vectors)
      vecSubTo(_tvec1, point, targetPos);
      vecNormalizeTo(_tvec2, _tvec1);

      const accel = Math.min(
        strength * SURFACE_GRAVITY_ACCEL * surfaceGravityFalloff(distance),
        MAX_GRAVITY_FORCE
      );

      // Return using pre-allocated result object
      _gravResult.direction.x = _tvec2.x;
      _gravResult.direction.y = _tvec2.y;
      _gravResult.accel = accel;
      _gravResult.magnitude = accel;  // legacy alias
      _gravResult.distance = distance;
      return _gravResult;
    }
    // END: calculateSurfaceGravity

    // ═══════════════════════════════════════════════════════════════════════
    // BEGIN: applyShapeGravity
    // Применяет гравитацию от всех источников (shapeGravityBodies) к телам,
    // герою, debris, lights и частицам.
    //
    // ОДНА гравитация — к поверхности. Point gravity удалена:
    //   — terrain-блоки: сила к state.terrainSurface (единый контур группы),
    //     считается ОДИН РАЗ на step (флаг terrainGravityDone);
    //   — обычный gravity-блок: сила к поверхности его собственного полигона.
    // Формула одна для всех целей (calculateSurfaceGravity):
    //   F = accel × масса тела → одинаковое ускорение у всех тел.
    // Флаги AFFECTS (BLCK/LGHT/LQID/PLYR) из вкладки GRAVITY теперь работают.
    // ═══════════════════════════════════════════════════════════════════════
    function applyShapeGravity() {
      if (shapeGravityBodies.size === 0) return;

      // AFFECTS-флаги из UI (вкладка GRAVITY → ANCHOR)
      const gp = window.tpPanes?.gravityParams;
      const affectsBlocks = gp ? gp.affectsBlocks !== false : true;
      const affectsPlayer = gp ? gp.affectsPlayer !== false : true;
      const affectsLiquid = gp ? gp.affectsLiquid !== false : true;
      const affectsLights = gp ? gp.affectsLights !== false : true;

      // Флаг: terrain-гравитация применяется ровно один раз на step.
      // При нескольких terrain блоках (T1, T2, combined C) — первый обрабатывает всё
      // через state.terrainSurface, остальные terrain пропускаются.
      let terrainGravityDone = false;

      const _target = { x: 0, y: 0 };

      // For each gravity source
      shapeGravityBodies.forEach(sourceBlock => {
        if (!sourceBlock.body) {
          shapeGravityBodies.delete(sourceBlock);
          return;
        }

        // Terrain: первый блок обрабатывает всю группу через terrainSurface, остальные пропускаются
        if (sourceBlock.isTerrain) {
          if (terrainGravityDone) return;
          terrainGravityDone = true;
        }

        // Единая формула: F = accel × масса тела (ускорение одинаково для всех тел)
        const applyGravityToBody = (body, factor = 1) => {
          const pos = body.GetPosition();
          _target.x = pos.get_x();
          _target.y = pos.get_y();
          const grav = calculateSurfaceGravity(_target, sourceBlock);
          if (!grav) return;
          const bodyMass = body.GetMass() || 1;
          const force = grav.accel * bodyMass * factor;
          body.ApplyForceToCenter(getVec2(grav.direction.x * force, grav.direction.y * force), true);
        };

        // Attract blocks
        if (affectsBlocks) {
          for (let i = 0; i < state.blocks.length; i++) {
            const block = state.blocks[i];
            if (!block.body || block === sourceBlock) continue;
            if (shapeGravityBodies.has(block)) continue;  // Don't affect other gravity sources
            applyGravityToBody(block.body);
          }
        }

        // Attract hero in simulate mode (чуть слабее — лучше управление)
        if (affectsPlayer && simulateMode && heroBody) {
          applyGravityToBody(heroBody, HERO_GRAVITY_FACTOR);
        }

        // Attract lights
        if (affectsLights) {
          for (let i = 0; i < state.lights.length; i++) {
            const light = state.lights[i];
            if (!light.body) continue;
            applyGravityToBody(light.body);
          }
        }

        // Attract debris (sliced block pieces)
        for (let i = 0; i < debris.length; i++) {
          const d = debris[i];
          if (!d.body) continue;
          applyGravityToBody(d.body);
        }

        // Attract particles (liquid/steam/sand etc)
        if (affectsLiquid) {
          applyGravityToParticleSystem(state.particleSystemA, 'A');
        }

        function applyGravityToParticleSystem(particleSys, systemId) {
          if (!particleSys) return;
          const count = particleSys.GetParticleCount();
          if (count === 0) return;

          const posBuffer = particleSys.GetPositionBuffer();
          const velBuffer = particleSys.GetVelocityBuffer();
          const b2 = Physics.b2;
          const HEAPF32 = Physics.HEAPF32 || b2.HEAPF32;
          const getPointer = Physics.getPointer || b2.getPointer;

          if (!HEAPF32 || !getPointer || !velBuffer) return;

          const pos_p = getPointer(posBuffer);
          const vel_p = getPointer(velBuffer);
          const PARTICLE_GRAVITY = 0.02;
          // Filter groups by system (A or B)
          const groups = liquidDream.particleGroups.filter(g => g.system === systemId);

          for (let i = 0; i < count; i++) {
            const posOffset = (pos_p >> 2) + i * 2;
            _target.x = HEAPF32[posOffset];
            _target.y = HEAPF32[posOffset + 1];
            const velOffset = (vel_p >> 2) + i * 2;

            const grav = calculateSurfaceGravity(_target, sourceBlock);
            if (!grav) continue;

            // Get particle weight from groups
            let particleWeight = 1;
            for (let gi = 0; gi < groups.length; gi++) {
              const grp = groups[gi];
              if (i >= grp.startIndex && i < grp.endIndex) {
                particleWeight = grp.weight;
                break;
              }
            }

            // Та же формула, что и для тел, с частицным масштабом и клэмпом
            const strength = Math.min(PARTICLE_GRAVITY * grav.accel * particleWeight, 0.5);
            HEAPF32[velOffset] += grav.direction.x * strength;
            HEAPF32[velOffset + 1] += grav.direction.y * strength;
          }
        }
      });
    }
    // END: applyShapeGravity

    function updateDebris(delta) {
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        const pos = d.body.GetPosition();
        if (Math.abs(pos.get_x()) > 1000 || Math.abs(pos.get_y()) > 1000) {
          removeZdogShape(d.body.ptr);
          state.world.DestroyBody(d.body);
          debris.splice(i, 1);
        }
      }
    }

    function updateLazerAnimation(delta) {
      if (!lazerBinding.light) return;

      const target = lazerBinding.pew ? { rays: lazerBinding.pewRays, fov: lazerBinding.pewFov }
                                       : { rays: 0, fov: 1 };

      const speed = 8;
      lazerBinding.currentRays += (target.rays - lazerBinding.currentRays) * speed * delta;
      lazerBinding.currentFov += (target.fov - lazerBinding.currentFov) * speed * delta;

      lazerBinding.light.rays = Math.round(lazerBinding.currentRays);
      lazerBinding.light.fov = lazerBinding.currentFov;
    }

    // ═════════════════���═════════════════════════════════════════════════════
    // THRUSTER SYSTEM
    // ═══════════════════════════════════════════════���═══════════════════════

    function getEdgeCenter(block, edgeIndex) {
      if (!block || !block.body) return null;
      const pos = block.body.GetPosition();
      const angle = block.body.GetAngle();
      const halfSize = block.size / 2;

      const corners = [
        { x: -halfSize, y: -halfSize },
        { x: halfSize, y: -halfSize },
        { x: halfSize, y: halfSize },
        { x: -halfSize, y: halfSize }
      ];

      const edge = [corners[edgeIndex], corners[(edgeIndex + 1) % 4]];
      const localCenter = {
        x: (edge[0].x + edge[1].x) / 2,
        y: (edge[0].y + edge[1].y) / 2
      };

      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      return {
        x: pos.get_x() + localCenter.x * cos - localCenter.y * sin,
        y: pos.get_y() + localCenter.x * sin + localCenter.y * cos
      };
    }

    // Pre-allocated edge normals (never changes)
    const _edgeNormals = [
      { x: 0, y: -1 },
      { x: 1, y: 0 },
      { x: 0, y: 1 },
      { x: -1, y: 0 }
    ];
    // Reusable result object for getEdgeNormal
    const _edgeNormalResult = { x: 0, y: 0 };

    function getEdgeNormal(block, edgeIndex) {
      const angle = block.body.GetAngle();
      const n = _edgeNormals[edgeIndex];
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      _edgeNormalResult.x = n.x * cos - n.y * sin;
      _edgeNormalResult.y = n.x * sin + n.y * cos;
      return _edgeNormalResult;
    }

    // Helper to apply thruster force (avoids code duplication)
    function _applyThruster(binding, thrustForce, toCenter) {
      if (!binding?.block?.body) return false;
      const normal = getEdgeNormal(binding.block, binding.edgeIndex);
      const fx = -normal.x * thrustForce;
      const fy = -normal.y * thrustForce;
      if (toCenter) {
        binding.block.body.ApplyForceToCenter(getVec2(fx, fy), true);
      } else {
        const center = getEdgeCenter(binding.block, binding.edgeIndex);
        binding.block.body.ApplyForce(getVec2(fx, fy), getVec2(center.x, center.y), true);
      }
      return true;
    }

    function applyThrusterForces() {
      activeEngines.thruster = false;
      activeEngines.pitch = false;
      activeEngines.drone = false;

      const thrustForce = 25;
      const pitchForce = thrustForce * 0.5;

      // Main thrusters (UP arrow)
      if (arrowKeysPressed.up) {
        if (_applyThruster(thrusterBindings.thruster1, thrustForce, true)) activeEngines.thruster = true;
        if (_applyThruster(thrusterBindings.thruster2, thrustForce, true)) activeEngines.thruster = true;
      }

      // Brake (DOWN arrow)
      if (arrowKeysPressed.down) {
        if (_applyThruster(thrusterBindings.brake1, thrustForce, true)) activeEngines.thruster = true;
        if (_applyThruster(thrusterBindings.brake2, thrustForce, true)) activeEngines.thruster = true;
      }

      // Pitch left (LEFT arrow)
      if (arrowKeysPressed.left) {
        if (_applyThruster(thrusterBindings.pitchLeft1, pitchForce, false)) activeEngines.pitch = true;
        if (_applyThruster(thrusterBindings.pitchLeft2, pitchForce, false)) activeEngines.pitch = true;
      }

      // Pitch right (RIGHT arrow)
      if (arrowKeysPressed.right) {
        if (_applyThruster(thrusterBindings.pitchRight1, pitchForce, false)) activeEngines.pitch = true;
        if (_applyThruster(thrusterBindings.pitchRight2, pitchForce, false)) activeEngines.pitch = true;
      }

      // Drone engine (V key)
      if (droneKeysPressed.v) {
        if (_applyThruster(thrusterBindings.droneEngine, thrustForce, true)) activeEngines.drone = true;
      }

      // Air bursts (N, M keys)
      if (droneKeysPressed.n) {
        if (_applyThruster(thrusterBindings.airBurst1, pitchForce, false)) activeEngines.drone = true;
      }
      if (droneKeysPressed.m) {
        if (_applyThruster(thrusterBindings.airBurst2, pitchForce, false)) activeEngines.drone = true;
      }

      // ─── Звук двигателей: play/stop по факту activeEngines ───
      // (вместо audioLoop — вызывается каждый физический шаг, только когда флаги реально установлены)
      if (activeEngines.thruster && eventSounds.engine_thruster) {
        playEngineSound('thruster');
      } else {
        stopEngineSound('thruster');
      }
      if (activeEngines.pitch && eventSounds.engine_pitch) {
        playEngineSound('pitch');
      } else {
        stopEngineSound('pitch');
      }
      if (activeEngines.drone && eventSounds.engine_drone) {
        playEngineSound('drone');
      } else {
        stopEngineSound('drone');
      }
    }

    function detonateBlock() {
      const binding = thrusterBindings.detonate;
      if (!binding?.block?.body) return;

      const pos = binding.block.body.GetPosition();
      const explosionX = pos.get_x();
      const explosionY = pos.get_y();

      removeBlock(binding.block, false);
      thrusterBindings.detonate = null;

      // Apply explosion force to nearby bodies
      const explosionRadius = 8;
      const explosionForce = 50;
      let obj, objPos, dx, dy, dist, strength;

      // Process blocks
      for (let i = 0, len = state.blocks.length; i < len; i++) {
        obj = state.blocks[i];
        if (!obj.body) continue;
        objPos = obj.body.GetPosition();
        dx = objPos.get_x() - explosionX;
        dy = objPos.get_y() - explosionY;
        dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < explosionRadius && dist > 0.1) {
          strength = explosionForce * (1 - dist / explosionRadius);
          obj.body.ApplyLinearImpulse(getVec2((dx / dist) * strength, (dy / dist) * strength), getWorldCenter(obj.body), true);
        }
      }

      // Process lights
      for (let i = 0, len = state.lights.length; i < len; i++) {
        obj = state.lights[i];
        if (!obj.body) continue;
        objPos = obj.body.GetPosition();
        dx = objPos.get_x() - explosionX;
        dy = objPos.get_y() - explosionY;
        dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < explosionRadius && dist > 0.1) {
          strength = explosionForce * (1 - dist / explosionRadius);
          obj.body.ApplyLinearImpulse(getVec2((dx / dist) * strength, (dy / dist) * strength), getWorldCenter(obj.body), true);
        }
      }

      eventBus.emit('detonate');
      eventBus.emit('explosion');

      const btn = document.getElementById('detonateBtn');
      if (btn) btn.textContent = '✕';
    }

    function spawnHero(x, y) {
      if (!state.world || !Physics.ready) return;
      if (heroBody) {
        // Remove existing hero
        try { state.world.DestroyBody(heroBody); } catch (e) {}
      }

      // Create hero body (small cube, dynamic)
      heroBody = createDynamicBody(state.world, x, y, {
        linearDamping: 0,     // No air resistance
        angularDamping: 0     // No angular damping - free rotation
      });

      // DON'T fix rotation - let it tumble naturally!
      // heroBody.SetFixedRotation(true);

      // Get selected shape from global or default to box
      const shape = window.selectedHeroShape || { type: 'primitive', primitive: 'box' };
      const fixtureOpts = { density: 3, friction: 1, restitution: 0.4 };  // density уменьшено (было 10)
      const halfSize = selectedHeroSize / 2;

      if (shape.type === 'primitive') {
        if (shape.primitive === 'circle') {
          addCircleFixture(heroBody, halfSize, fixtureOpts);
          // Circle hero: recalculate mass center for proper rotation (fan triangulation fix)
          if (heroBody.ResetMassData) {
            heroBody.ResetMassData();
          }
        } else {
          // Default: box
          addBoxFixture(heroBody, halfSize, halfSize, fixtureOpts);
        }
      } else if (shape.triangles && shape.triangles.length > 0) {
        // Polygon from triangulated shape - create multiple fixtures
        shape.triangles.forEach(tri => {
          const scaledVerts = tri.map(v => ({ x: v.x * selectedHeroSize, y: v.y * selectedHeroSize }));
          addPolygonFixture(heroBody, scaledVerts, fixtureOpts);
        });
      } else if (shape.vertices && shape.vertices.length >= 3) {
        // Simple polygon (convex, <= 8 vertices)
        const scaledVerts = shape.vertices.map(v => ({ x: v.x * selectedHeroSize, y: v.y * selectedHeroSize }));
        addPolygonFixture(heroBody, scaledVerts, fixtureOpts);
      } else {
        // Fallback to box
        addBoxFixture(heroBody, halfSize, halfSize, fixtureOpts);
      }

      // Store shape for drawing
      window.currentHeroShape = shape;

      // Mark as hero in user data
      setBodyUserData(heroBody, { type: 'hero', ref: null, shape: shape });

      // CCD: при высоких скоростях герой не туннелирует сквозь terrain
      if (heroBody.SetBullet) heroBody.SetBullet(true);

      heroSpawned = true;
      heroCanJump = true;  // Can jump once after spawn
      spaceHeld = false;

      // Hide the preview element
      const preview = document.getElementById('hero-preview-el');
      if (preview) preview.style.display = 'none';

      // Update hint to gameplay mode
      const hint = document.getElementById('simulate-exit-hint');
      if (hint) {
        hint.innerHTML = '<span class="key">←→</span> ROTATE · <span class="key">SPACE</span> JUMP/THRUST · <span class="key">CTRL</span> GRAVITY · <span class="key">ESC</span> EXIT';

      // Show hero status UI
      const statusUI = document.getElementById('hero-status-ui');
      if (statusUI) statusUI.style.display = 'flex';

      // Reset hero stats and show REC HUD (bars + radar + stamina)
      resetHeroStats();
      const recHUD = document.getElementById('rec-hud');
      if (recHUD) recHUD.classList.add('active');
      const recRadar = document.getElementById('rec-radar');
      if (recRadar) recRadar.classList.add('active');
      const staminaBar = document.getElementById('stamina-bar');
      if (staminaBar) staminaBar.classList.add('active');

      // Show touch controls
      const touchControls = document.getElementById('touch-controls');
      if (touchControls) touchControls.classList.add('active');

      // Initialize camera to hero position (no jump on spawn)
      cameraPanX = -x * tileSize * zoom;
      cameraPanY = y * tileSize * zoom;
      panX = cameraPanX;
      panY = cameraPanY;

      // Save spawn point and dispatch event for DEV MODE
      window.heroSpawnPoint = { x, y };
      window.dispatchEvent(new CustomEvent('hero-spawned'));

      // Show countdown then start physics (DEV MODE cinematic sequence)
      showRecCountdown(() => {
        if (!window.isPlaying) startPhysics();
      });
    }

    function showRecCountdown(onComplete) {
      const overlay = document.createElement('div');

        animation: glitchPulse 0.15s infinite;
        user-select: none;
      `;

      // Add glitch CSS
      if (!document.getElementById('rec-countdown-css')) {
        const style = document.createElement('style');
        style.id = 'rec-countdown-css';
        style.textContent = `
          @keyframes glitchPulse {
            0%, 100% { transform: translate(0, 0) skew(0deg); opacity: 1; }
            20% { transform: translate(-3px, 2px) skew(-1deg); opacity: 0.9; }
            40% { transform: translate(3px, -2px) skew(1deg); opacity: 0.95; }
            60% { transform: translate(-2px, -1px) skew(0.5deg); opacity: 0.85; }
            80% { transform: translate(2px, 1px) skew(-0.5deg); opacity: 0.92; }
          }
          @keyframes glitchFlash {
            0%, 90%, 100% { opacity: 1; }
            92%, 98% { opacity: 0; }
            94%, 96% { opacity: 0.5; }
          }
          @keyframes recPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(255,0,0,0.9), 0 0 60px rgba(255,0,0,0.7); }
            50% { transform: scale(1.05); text-shadow: 0 0 50px rgba(255,0,0,1), 0 0 100px rgba(255,0,0,0.9); }
          }
        `;
        document.head.appendChild(style);
      }

      overlay.appendChild(countEl);
      document.body.appendChild(overlay);

      const sequence = ['3', '2', '1', '●REC'];
      let i = 0;

      const showNext = () => {
        if (i >= sequence.length) {
          // Fade out and remove
          overlay.style.transition = 'opacity 0.3s';
          overlay.style.opacity = '0';
          setTimeout(() => {
            overlay.remove();
            if (onComplete) onComplete();
          }, 300);
          return;
        }

        const text = sequence[i];
        countEl.textContent = text;

        if (text === '●REC') {
          countEl.style.color = '#ff0000';
          countEl.style.fontSize = '12vw';
          countEl.style.animation = 'recPulse 0.3s ease-in-out 3';
          setTimeout(() => { i++; showNext(); }, 900);
        } else {
          countEl.style.animation = 'glitchPulse 0.12s infinite, glitchFlash 0.5s ease-out';
          setTimeout(() => { i++; showNext(); }, 600);
        }
      };

      // Start after a tiny delay for camera to settle
      setTimeout(showNext, 100);
    }
