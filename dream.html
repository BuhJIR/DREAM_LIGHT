    // COMBINE DEBUG RECORDER  Shift+F=start  Shift+M=export  Shift+D=contour
    // ═══════════════════════════════════════════════════════════════════════
    const _combineRec = { active: false, events: [], snapshots: [] };

    function _recNotify(text, color, duration) {
      color = color || '#ff3333'; duration = duration || 1200;
      const old = document.getElementById('_rec-notify');
      if (old) old.remove();
      const el = document.createElement('div');
      el.id = '_rec-notify';
      el.style.cssText = 'position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;pointer-events:none;';
      const inner = document.createElement('div');
      inner.textContent = text;
      inner.style.cssText = `font-family:'Goblin One',monospace;font-size:8vw;font-weight:900;color:${color};text-shadow:0 0 20px ${color}cc,0 0 50px ${color}88,4px 4px 0 #000,-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000;letter-spacing:0.08em;text-align:center;white-space:pre-line;animation:_recFadeOut ${duration}ms ease-out forwards;`;
      if (!document.getElementById('_rec-notify-css')) {
        const s = document.createElement('style');
        s.id = '_rec-notify-css';
        s.textContent = '@keyframes _recFadeOut{0%{opacity:1;transform:scale(1.1)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0.95)}}';
        document.head.appendChild(s);
      }
      el.appendChild(inner);
      document.body.appendChild(el);
      setTimeout(() => el.remove(), duration);
    }

    function _recStartCountdown() {
      const seq = [{t:'3',c:'#ff3333',d:600},{t:'2',c:'#ff9900',d:600},{t:'1',c:'#ffff00',d:600},{t:'RECORD',c:'#00ffcc',d:1000}];
      let delay = 0;
      seq.forEach(({t,c,d}) => { setTimeout(() => _recNotify(t,c,d), delay); delay += d; });
      setTimeout(() => {
        _combineRec.active = true; _combineRec.events = []; _combineRec.snapshots = [];
        _recSnapshot('session_start');
      }, delay);
    }

    function _recSnapshot(label, extra) {
      extra = extra || {};
      if (!_combineRec.active && label !== 'session_start') return;
      const snap = Object.assign({ label, timestamp: Date.now() }, extra, {
        consoleTail: _consoleLog.slice(-30),
        scene: {
          scaledTileSize, zoom, panX, panY,
          blocks: state.blocks.map(b => {
            if (!b.body) return null;
            const pos = b.body.GetPosition();
            return { uid: b.uid, isTerrain: !!b.isTerrain, isCombine: !!b.multiVerts,
              pos: {x: pos.get_x(), y: pos.get_y()}, angle: b.body.GetAngle(),
              size: b.size, shapeId: b.shapeId, vertices: b.vertices,
              multiVerts: b.multiVerts || null, surfaceVerts: b.surfaceVerts || null,
              worldVerts: _blockWorldVerts(b) };
          }).filter(Boolean)
        }
      });
      _combineRec.snapshots.push(snap);
      _combineRec.events.push({ type: label, ts: Date.now() });
    }

    function _recExport() {
      _combineRec.active = false;
      _recSnapshot('session_end');
      const data = { meta: { recorded: new Date().toISOString(), snapshots: _combineRec.snapshots.length }, events: _combineRec.events, snapshots: _combineRec.snapshots };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'combine_debug_' + Date.now() + '.json'; a.click();
      URL.revokeObjectURL(a.href);
      _recNotify('EXPORTED', '#00ff88', 1500);
    }

    function _recOnCombinePlaced(blockX, blockY, pieces, surfaceVerts, newBlock) {
      if (!_combineRec.active) return;
      _recNotify('COMBINE ✓', '#ffcc00', 800);
      _recSnapshot('combine_placed', { placement: {x:blockX,y:blockY}, piecesCount: pieces.length,
        pieces, surfaceVerts, surfaceVertsCount: surfaceVerts ? surfaceVerts.length : 0, blockUid: newBlock && newBlock.uid });
    }

    // ── MANUAL CONTOUR TOOL ──
    let _manualContourMode = false;
    let _manualContourPoints = [];


    function _contourSnapPoint(wx, wy) {
      const SNAP_R = 0.8; // метры
      let best = null, bestDist = SNAP_R;

      for (const block of state.blocks) {
        if (!block.body || !block.isTerrain) continue;
        const wv = _blockWorldVerts(block);
        if (!wv) continue;
        const loops = Array.isArray(wv[0]) ? wv : [wv];

        for (const loop of loops) {
          const n = loop.length;
          for (let i = 0; i < n; i++) {
            const v = loop[i];
            // Вершина
            const dv = Math.hypot(wx - v.x, wy - v.y);
            if (dv < bestDist) { bestDist = dv; best = {wx: v.x, wy: v.y}; }
            // Midpoint ребра
            const v2 = loop[(i+1)%n];
            const mx = (v.x+v2.x)/2, my = (v.y+v2.y)/2;
            const dm = Math.hypot(wx - mx, wy - my);
            if (dm < bestDist) { bestDist = dm; best = {wx: mx, wy: my}; }
          }
        }
      }

      return best || {wx, wy};
    }

    function _contourEnter() {
      _manualContourMode = true; _manualContourPoints = [];
      _recNotify('CONTOUR\nMODE', '#00ccff', 1200);
    }
    function _contourAddPoint(wx, wy) {
      _manualContourPoints.push({wx, wy});
      _recNotify('POINT ' + _manualContourPoints.length, '#ffffff', 500);
      _sceneDirty = true;
    }
    function _contourRemoveLast() {
      if (_manualContourPoints.length > 0) { _manualContourPoints.pop(); _recNotify('REMOVED', '#ff9900', 500); _sceneDirty = true; }
    }
    function _contourCommit() {
      if (_manualContourPoints.length < 2) { _recNotify('NEED\nMORE POINTS', '#ff3333', 900); return; }
      _recSnapshot('manual_contour', { points: _manualContourPoints.slice(), pointCount: _manualContourPoints.length });
      _recNotify('SAVED\n' + _manualContourPoints.length + ' PTS', '#00ff88', 1000);
      _manualContourMode = false; _manualContourPoints = []; _sceneDirty = true;
    }
    function _contourCancel() {
      _manualContourMode = false; _manualContourPoints = [];
      _recNotify('CANCELLED', '#ff3333', 700); _sceneDirty = true;
    }
    function drawManualContour() {
      if (!_manualContourMode && _manualContourPoints.length === 0) return;
      const pts = _manualContourPoints;
      if (pts.length === 0) return;
      const dpr = window.devicePixelRatio || 1;
      const toSx = wx => canvas.width  / 2 + wx * scaledTileSize + panX * dpr;
      const toSy = wy => canvas.height / 2 - wy * scaledTileSize + panY * dpr;
      ctx.save();
      ctx.strokeStyle = '#00ccff'; ctx.lineWidth = 2; ctx.setLineDash([]);
      ctx.beginPath();
      pts.forEach((p, i) => { if (i===0) ctx.moveTo(toSx(p.wx),toSy(p.wy)); else ctx.lineTo(toSx(p.wx),toSy(p.wy)); });
      ctx.stroke();
      if (pts.length >= 3) {
        ctx.setLineDash([6,5]); ctx.strokeStyle = 'rgba(0,204,255,0.4)';
        ctx.beginPath(); ctx.moveTo(toSx(pts[pts.length-1].wx),toSy(pts[pts.length-1].wy)); ctx.lineTo(toSx(pts[0].wx),toSy(pts[0].wy)); ctx.stroke();
        ctx.setLineDash([]);
      }
      pts.forEach((p, i) => {
        const sx=toSx(p.wx), sy=toSy(p.wy), last=i===pts.length-1;
        ctx.beginPath(); ctx.arc(sx,sy,last?10:7,0,Math.PI*2);
        ctx.fillStyle=last?'#00ccff':'rgba(0,180,255,0.7)'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
        ctx.fillStyle='#000'; ctx.font=`bold ${last?11:9}px monospace`;
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(i+1),sx,sy);
      });
      if (_manualContourMode) {
        // Snap preview — показать к чему прилипнет следующая точка
        if (typeof pointer !== 'undefined' && pointer.active === false) {
          const snap = _contourSnapPoint(pointer.x || 0, pointer.y || 0);
          const snapSx = toSx(snap.wx), snapSy = toSy(snap.wy);
          ctx.beginPath(); ctx.arc(snapSx, snapSy, 5, 0, Math.PI*2);
          ctx.strokeStyle='#00ffcc'; ctx.lineWidth=1.5; ctx.stroke();
        }
        ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(canvas.width/2-180,18,360,28);
        ctx.fillStyle='#00ccff'; ctx.font='bold 12px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('CLICK=add  BACKSPACE=undo  ENTER/Shift+D=save  ESC=cancel', canvas.width/2, 32);
      }
      ctx.restore();
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TERRAIN GROUP SURFACE
    // Единый внешний контур всех terrain-блоков сцены.
    // Пересчитывается при добавлении/удалении terrain.
    // Хранится в state.terrainSurface как [{p1,p2}] в мировых координатах.
    // ═══════════════════════════════════════════════════════════════════════
    function rebuildTerrainSurface() {
      const EPS = 1e-4;

      // Собрать рёбра только terrain-блоков С гравитацией —
      // блоки без гравитации не участвуют в притяжении.
      // Заодно считаем параметры гравитации группы (max по блокам) —
      // раньше брались параметры «первого» блока из Set (порядок = лотерея).
      const allSegs = [];
      let groupStrength = 0, groupRadius = 0, hasParams = false;
      for (const block of state.blocks) {
        if (!block.body || !block.isTerrain || !block.hasShapeGravity) continue;
        groupStrength = Math.max(groupStrength, block.gravity?.strength ?? gravityStrength);
        groupRadius = Math.max(groupRadius, block.gravity?.radius ?? gravityRadius);
        hasParams = true;
        const wv = _blockWorldVerts(block);
        if (!wv) continue;
        const loops = Array.isArray(wv[0]) ? wv : [wv];
        for (const loop of loops) {
          const n = loop.length;
          for (let i = 0; i < n; i++) {
            allSegs.push({ p1: loop[i], p2: loop[(i+1)%n] });
          }
        }
      }
      state.terrainGravityParams = hasParams
        ? { strength: groupStrength, radius: groupRadius }
        : null;

      if (!allSegs.length) { state.terrainSurface = []; return; }

      // subtractOverlap: вычесть коллинеарные перекрытия между рёбрами разных блоков
      const EPS2 = 1e-4;
      const collinear2 = (a1,a2,b1,b2) => {
        const dx=a2.x-a1.x, dy=a2.y-a1.y;
        return Math.abs((b1.x-a1.x)*dy-(b1.y-a1.y)*dx)<EPS2 &&
               Math.abs((b2.x-a1.x)*dy-(b2.y-a1.y)*dx)<EPS2;
      };
      const projT2 = (a1,a2,p) => {
        const dx=a2.x-a1.x,dy=a2.y-a1.y,l2=dx*dx+dy*dy;
        return l2<1e-12?0:((p.x-a1.x)*dx+(p.y-a1.y)*dy)/l2;
      };
      const lerp2 = (a1,a2,t) => ({x:a1.x+t*(a2.x-a1.x), y:a1.y+t*(a2.y-a1.y)});

      const subtractSegs = (a1,a2,others) => {
        const covered=[];
        for (const {p1,p2} of others) {
          if (!collinear2(a1,a2,p1,p2)) continue;
          let t1=projT2(a1,a2,p1), t2=projT2(a1,a2,p2);
          if(t1>t2){const tmp=t1;t1=t2;t2=tmp;}
          const s=Math.max(0,t1),e=Math.min(1,t2);
          if(e>s+EPS2) covered.push([s,e]);
        }
        if(!covered.length) return [{p1:a1,p2:a2}];
        covered.sort((a,b)=>a[0]-b[0]);
        const merged=[covered[0].slice()];
        for(let i=1;i<covered.length;i++){
          const[s,e]=covered[i],last=merged[merged.length-1];
          if(s<=last[1]+EPS2)last[1]=Math.max(last[1],e);
          else merged.push([s,e]);
        }
        const result=[];let prev=0;
        for(const[s,e]of merged){
          if(s-prev>EPS2)result.push({p1:lerp2(a1,a2,prev),p2:lerp2(a1,a2,s)});
          prev=e;
        }
        if(1-prev>EPS2)result.push({p1:lerp2(a1,a2,prev),p2:lerp2(a1,a2,1)});
        return result;
      };

      const exterior = [];
      for (let i = 0; i < allSegs.length; i++) {
        const {p1,p2} = allSegs[i];
        const others = allSegs.filter((_,j)=>j!==i);
        exterior.push(...subtractSegs(p1,p2,others));
      }

      state.terrainSurface = exterior;
    }

    // Найти ближайшую точку на поверхности terrain-группы
    function getClosestPointOnTerrainSurface(target) {
      let closestDist = Infinity;
      let closestPoint = null;
      for (const {p1,p2} of state.terrainSurface) {
        const ex=p2.x-p1.x, ey=p2.y-p1.y;
        const tx=target.x-p1.x, ty=target.y-p1.y;
        const l2=ex*ex+ey*ey;
        const t = l2>0 ? Math.max(0,Math.min(1,(tx*ex+ty*ey)/l2)) : 0;
        const cx=p1.x+t*ex, cy=p1.y+t*ey;
        const dx=target.x-cx, dy=target.y-cy;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if (dist<closestDist) { closestDist=dist; closestPoint={x:cx,y:cy}; }
      }
      return { point: closestPoint, distance: closestDist };
    }

    // ═══════════════════════════════════════════════════════════════════════
    // BUILD COMBINE SURFACE — subtract collinear overlaps, trace exterior contour
    // ═══════════════════════════════════════════════════════════════════════
    function buildCombineSurface(pieces, boundaryEdges) {
      if (!pieces || pieces.length === 0) return null;
      if (pieces.length === 1) return pieces[0].slice();
      const EPS = 1e-5;
      const collinear = (a1,a2,b1,b2) => {
        const dx=a2.x-a1.x, dy=a2.y-a1.y;
        return Math.abs((b1.x-a1.x)*dy-(b1.y-a1.y)*dx)<EPS && Math.abs((b2.x-a1.x)*dy-(b2.y-a1.y)*dx)<EPS;
      };
      const projT = (a1,a2,p) => {
        const dx=a2.x-a1.x,dy=a2.y-a1.y,l2=dx*dx+dy*dy;
        return l2<1e-12?0:((p.x-a1.x)*dx+(p.y-a1.y)*dy)/l2;
      };
      const lerp = (a1,a2,t) => ({x:a1.x+t*(a2.x-a1.x), y:a1.y+t*(a2.y-a1.y)});
      const subtractOverlap = (a1,a2,others) => {
        const covered=[];
        for (const {p1,p2} of others) {
          if (!collinear(a1,a2,p1,p2)) continue;
          let t1=projT(a1,a2,p1), t2=projT(a1,a2,p2);
          if(t1>t2){const tmp=t1;t1=t2;t2=tmp;}
          const s=Math.max(0,t1),e=Math.min(1,t2);
          if(e>s+EPS) covered.push([s,e]);
        }
        if(!covered.length) return [{p1:a1,p2:a2}];
        covered.sort((a,b)=>a[0]-b[0]);
        const merged=[covered[0]];
        for(let i=1;i<covered.length;i++){
          const[s,e]=covered[i],last=merged[merged.length-1];
          if(s<=last[1]+EPS)merged[merged.length-1]=[last[0],Math.max(last[1],e)];
          else merged.push([s,e]);
        }
        const result=[];let prev=0;
        for(const[s,e]of merged){
          if(s-prev>EPS)result.push({p1:lerp(a1,a2,prev),p2:lerp(a1,a2,s)});
          prev=e;
        }
        if(1-prev>EPS)result.push({p1:lerp(a1,a2,prev),p2:lerp(a1,a2,1)});
        return result;
      };
      const allSegs=[];
      for(let pi=0;pi<pieces.length;pi++){
        const pc=pieces[pi];
        for(let i=0;i<pc.length;i++) allSegs.push({pi,p1:pc[i],p2:pc[(i+1)%pc.length]});
      }
      const exterior=[];
      if (boundaryEdges && boundaryEdges.length > 0) {
        // Быстрый путь: ребро — boundary если совпадает с одним из boundaryEdges
        const isB = (p1,p2) => boundaryEdges.some(({p1:b1,p2:b2}) =>
          (Math.hypot(p1.x-b1.x,p1.y-b1.y)<EPS && Math.hypot(p2.x-b2.x,p2.y-b2.y)<EPS) ||
          (Math.hypot(p1.x-b2.x,p1.y-b2.y)<EPS && Math.hypot(p2.x-b1.x,p2.y-b1.y)<EPS)
        );
        for (const {p1,p2} of allSegs) { if (!isB(p1,p2)) exterior.push({p1,p2}); }
      } else {
        for(const {pi,p1,p2} of allSegs){
          const others=allSegs.filter(s=>s.pi!==pi).map(s=>({p1:s.p1,p2:s.p2}));
          exterior.push(...subtractOverlap(p1,p2,others));
        }
      }
      if(!exterior.length) return null;
      const vkey=v=>`${v.x.toFixed(6)},${v.y.toFixed(6)}`;
      const ekey=(a,b)=>{const ka=vkey(a),kb=vkey(b);return ka<kb?`${ka}|${kb}`:`${kb}|${ka}`;};
      const graph=new Map(),vmap=new Map();
      for(const{p1,p2}of exterior){
        const ka=vkey(p1),kb=vkey(p2);
        if(!graph.has(ka))graph.set(ka,[]);if(!graph.has(kb))graph.set(kb,[]);
        graph.get(ka).push({k:kb,v:p2});graph.get(kb).push({k:ka,v:p1});
        vmap.set(ka,p1);vmap.set(kb,p2);
      }
      let startK=null;
      for(const[k,v]of vmap)
        if(!startK||v.y<vmap.get(startK).y||(v.y===vmap.get(startK).y&&v.x<vmap.get(startK).x)) startK=k;
      const startV=vmap.get(startK);
      const first=graph.get(startK).reduce((b,c)=>
        Math.atan2(c.v.y-startV.y,c.v.x-startV.x)<Math.atan2(b.v.y-startV.y,b.v.x-startV.x)?c:b);
      const angleTurn=(prev,cur,nxt)=>{
        const dx1=cur.x-prev.x,dy1=cur.y-prev.y,dx2=nxt.x-cur.x,dy2=nxt.y-cur.y;
        return Math.atan2(dx1*dy2-dy1*dx2,dx1*dx2+dy1*dy2);
      };
      const path=[startV];const visited=new Set();
      let prevV=startV,curK=first.k,curV=first.v;
      visited.add(ekey(startV,curV));
      for(let iter=0;iter<exterior.length+2;iter++){
        if(curK===startK)break;
        path.push(curV);
        const cands=graph.get(curK).filter(nb=>!visited.has(ekey(curV,nb.v)));
        if(!cands.length)break;
        const best=cands.length===1?cands[0]:cands.reduce((b,c)=>angleTurn(prevV,curV,c.v)<angleTurn(prevV,curV,b.v)?c:b);
        visited.add(ekey(curV,best.v));
        prevV=curV;curV=best.v;curK=best.k;
      }
      const seen=new Set();
      return path.filter(v=>{const k=vkey(v);if(seen.has(k))return false;seen.add(k);return true;});
    }

    // DEBUG: Draw combine body curve groups - shows the actual surface of combined bodies
    function drawCombineBodiesDebug() {
      if (!window.combineDebugEnabled) return;
      
      const dpr = window.devicePixelRatio || 1;
      
      ctx.save();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#ff0000';
      ctx.globalAlpha = 1.0;
      
      // Draw all terrain blocks with their fixture outlines
      for (const block of state.blocks) {
        if (!block.body || !block.isTerrain) continue;
        
        const pos = block.body.GetPosition();
        const angle = block.body.GetAngle();
        
        // Get world vertices for each fixture/piece
        const worldVerts = _blockWorldVerts(block);
        if (!worldVerts) continue;
        
        // If multi-piece (array of arrays), draw each piece
        if (Array.isArray(worldVerts[0])) {
          for (const piece of worldVerts) {
            ctx.beginPath();
            piece.forEach((v, i) => {
              const sx = canvas.width / 2 + v.x * scaledTileSize + panX * dpr;
              const sy = canvas.height / 2 - v.y * scaledTileSize + panY * dpr;
              if (i === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            });
            ctx.closePath();
            ctx.stroke();
          }
        } else {
          // Single piece
          ctx.beginPath();
          worldVerts.forEach((v, i) => {
            const sx = canvas.width / 2 + v.x * scaledTileSize + panX * dpr;
            const sy = canvas.height / 2 - v.y * scaledTileSize + panY * dpr;
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          });
          ctx.closePath();
          ctx.stroke();
        }
      }
      
      ctx.restore();
    }

    function draw() {
      // FPS Graph - begin measurement
      if (fpsGraph) fpsGraph.begin();

      if (!ctx) return;

      // Lazy Init Renderer
      if (!renderer) {
         // Create renderer attached to main canvas 'c'
         renderer = new ZdogRenderer('c');
         // Initialize pools immediately
         renderer.init();
      }

      // Ensure scaledTileSize is always valid before any drawing
      if (!isFinite(scaledTileSize) || scaledTileSize <= 0) {
        const dprFix = window.devicePixelRatio || 1;
        if (!isFinite(zoom) || zoom <= 0) zoom = 1;
        if (!isFinite(panX)) panX = 0;
        if (!isFinite(panY)) panY = 0;
        scaledTileSize = tileSize * dprFix * zoom;
      }

      // 1. UPDATE CAMERA & CULLING
      // This calculates the viewport bounds for culling
      renderer.updateCamera(panX, panY, zoom, rotationAngle);

      // 2. RENDER MAIN SCENE (Delegated to ZdogRenderer)
      // This clears the canvas and draws visible blocks/lights/debris from pools
      renderer.render(
          { blocks: state.blocks, lights: state.lights, debris: debris },
          { panX, panY, zoom, rotationAngle, scaledTileSize }
      );

      // 3. RENDER OVERLAYS (On top of Zdog)
      // Note: ZdogRenderer clears the canvas, so everything below is drawn on top

      // Grid
      if (snapToGrid && (currentTool === 'wall' || currentTool === 'light')) {
        drawGrid();
      }

      // Particles (WASM direct render)
      // Must be called AFTER Zdog because Zdog clears the canvas
      renderZdogParticles();

      // Light Rays (Canvas 2D lines)
      drawLightsRays();

      // Draw joints
      drawJoints();

      // Overlap intersections (wall tool only)
      if (currentTool === 'wall') drawOverlapIntersections();

      // DEBUG: Combine bodies curve groups (red stroke - shows actual surface)
      drawCombineBodiesDebug();
      drawManualContour();

      // Ghost block now drawn on zdogCursor layer

      // Draw light drag preview (shows direction while dragging)
      if (currentTool === 'light' && dragging && dragStart) {
        drawLightDragPreview();
      }

      // Ghost light now drawn on zdogCursor layer

      // Draw joint preview line
      if (jointPreviewLine) {
        drawJointPreviewLine();
      }

      // Draw slice line
      if (sliceLine) {
        drawSliceLine();
      }

      // Draw thruster binding preview
      if (thrusterBindMode && selectedBlockForThruster) {
        drawThrusterBindingPreview();
      }

      // Draw selected element highlight
      if (pointerSelectedElement) {
        drawSelectedHighlight();
      }

      // Draw hero (simulate mode)
      if (simulateMode) {
        if (heroSpawned) {
          drawHero();
        } else {
          drawHeroPreview();
        }
      }

      // QUBE System Draw (for ShapeEditor and other modes)
      if (window.Qube) window.Qube.draw(ctx);

      // PLUGIN_RENDER hook - runs after main render
      window.DreamPlugins.runRender(ctx);


      // FPS Graph - end measurement
      if (fpsGraph) fpsGraph.end();

      // Update stats in Tweakpane
      updateTweakpaneStats();
    }

    function updateTweakpaneStats() {
      if (!tpPanes.statsParams) return;
      const stats = tpPanes.statsParams;
      stats.blocks = state.blocks.length;
      stats.lights = state.lights.length;
      stats.joints = state.joints.length;
      stats.particles = state.particleSystemA ? state.particleSystemA.GetParticleCount() : 0;
      if (window.updateStatsDisplay) window.updateStatsDisplay();
    }

    function drawGrid() {
      const dpr = window.devicePixelRatio || 1;
      // Grid spacing in world units matches gridSize exactly
      const worldSpacing = gridSize;
      // Convert to screen pixels
      const spacing = worldSpacing * scaledTileSize;

      // Skip if spacing is too small (performance)
      if (spacing < 4) return;

      // Screen center in pixels
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // World origin offset in screen space
      const originX = centerX + panX * dpr;
      const originY = centerY + panY * dpr;

      // Calculate phase - where grid lines fall relative to screen edges
      const phaseX = ((originX % spacing) + spacing) % spacing;
      const phaseY = ((originY % spacing) + spacing) % spacing;

      ctx.save();
      // Neon pink grid
      ctx.strokeStyle = '#ff2d95';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();

      // Vertical lines
      for (let x = phaseX; x <= canvas.width; x += spacing) {
        const px = Math.round(x) + 0.5;
        ctx.moveTo(px, 0);
        ctx.lineTo(px, canvas.height);
      }

      // Horizontal lines
      for (let y = phaseY; y <= canvas.height; y += spacing) {
        const py = Math.round(y) + 0.5;
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
      }

      ctx.stroke();
      ctx.restore();
    }

    // Reusable screen coord for lights (separate from general one)
    const _lightScreen = { x: 0, y: 0 };


    // Draw only light rays (Zdog handles the light bodies)
    function drawLightsRays() {
      const lights = state.lights;
      const len = lights.length;

      for (let i = 0; i < len; i++) {
        const light = lights[i];
        if (!light.body) continue;

        const pos = light.body.GetPosition();
        const wx = pos.get_x();
        const wy = pos.get_y();

        const screenPos = worldToScreen(wx, wy);
        const sx = screenPos.x;
        const sy = screenPos.y;
        _lightScreen.x = sx;
        _lightScreen.y = sy;

        // Cast rays only
        if (light.rays > 0 && light.maxDist > 0) {
          castRays(light, wx, wy, sx, sy);
        }
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // BOX2D RAYCAST
    // ═���═════════════════════════════════════════════════════════════════════

    let _rayCallback = null;
    let _rayHitFraction = 1;
    let _rayExcludeBodyPtr = 0;
    let _rayHitNormalX = 0;
    let _rayHitNormalY = 0;
    let _rayHitBody = null;  // For color inheritance from hit block (actual body ref)

    function initRaycastCallback() {
      if (_rayCallback || !Physics.JSRayCastCallback) return;

      const b2 = Physics.b2;

      _rayCallback = Object.assign(new Physics.JSRayCastCallback(), {
        ReportFixture: (fixture_p, point_p, normal_p, fraction) => {
          // Unwrap fixture pointer
          const fixture = b2.wrapPointer(fixture_p, Physics.b2Fixture);
          const body = fixture.GetBody();

          // Exclude the light's own body
          if (_rayExcludeBodyPtr && body.ptr === _rayExcludeBodyPtr) {
            return -1; // Ignore and continue
          }

          // Store closest hit + normal + body for reflection
          if (fraction < _rayHitFraction) {
            _rayHitFraction = fraction;
            // Unwrap normal vector
            const normal = b2.wrapPointer(normal_p, b2.b2Vec2);
            _rayHitNormalX = normal.get_x();
            _rayHitNormalY = normal.get_y();
            _rayHitBody = body;  // Store body reference for color lookup
          }
          return fraction; // Clip ray to this point
        },
        // LiquidFun: ignore particles for light rays
        ShouldQueryParticleSystem: (particleSystem_p) => {
          return false;
        }
      });

    }

    function castRays(light, wx, wy, screenX, screenY) {
      const col = light.color;
      const r = col[0], g = col[1], b = col[2];
      const brightness = light.brightness ?? 1.0;
      const maxDist = light.maxDist;
      const fovRad = light.fov * Math.PI / 180;
      const startAngle = light.angle - fovRad / 2;

      // For 360° FOV: divide by rays; otherwise by (rays-1) to include both endpoints
      // Boolean coercion: (fov < 360) → 1, (fov >= 360) → 0
      const step = fovRad / Math.max(light.rays - (light.fov < 360), 1);

      // Set excluded body for raycast callback
      _rayExcludeBodyPtr = light.body ? light.body.ptr : 0;

      // Alpha based on brightness (0.0-2.0 → 0.0-0.3 alpha)
      const alpha = Math.min(0.3, 0.15 * brightness);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      ctx.lineWidth = Math.max(1, brightness);

      let angle, dx, dy, hitDist, endWorldX, endWorldY;

      // Batch all rays into single path for better performance
      ctx.beginPath();

      for (let i = 0, rays = light.rays; i < rays; i++) {
        angle = startAngle + step * i;
        dx = Math.cos(angle);
        dy = Math.sin(angle);

        // Use Box2D RayCast (respects rotated shapes!)
        _rayHitFraction = 1;
        _rayHitNormalX = 0;
        _rayHitNormalY = 0;
        const p1 = getVec2(wx, wy);
        const p2 = getVec2(wx + dx * maxDist, wy + dy * maxDist);
        state.world.RayCast(_rayCallback, p1, p2);
        hitDist = maxDist * _rayHitFraction;

        // Calculate end point in world coords, then convert to screen
        endWorldX = wx + dx * hitDist;
        endWorldY = wy + dy * hitDist;
        const endScreen = worldToScreen(endWorldX, endWorldY);

        ctx.moveTo(screenX, screenY);
        ctx.lineTo(endScreen.x, endScreen.y);

      }

      ctx.stroke();

      // Draw reflections when enabled
      if (lightReflect) {
        const reflectAlpha = Math.min(0.3, 0.15 * brightness);
        ctx.lineWidth = 2;

        for (let i = 0, rays = light.rays; i < rays; i++) {
          const angle = startAngle + step * i;
          const dx = Math.cos(angle);
          const dy = Math.sin(angle);

          _rayHitFraction = 1;
          _rayHitNormalX = 0;
          _rayHitNormalY = 0;
          _rayHitBody = null;
          const p1 = getVec2(wx, wy);
          const p2 = getVec2(wx + dx * maxDist, wy + dy * maxDist);
          state.world.RayCast(_rayCallback, p1, p2);

          if (_rayHitFraction < 1 && (_rayHitNormalX !== 0 || _rayHitNormalY !== 0)) {
            const hitDist = maxDist * _rayHitFraction;
            const hitX = wx + dx * hitDist;
            const hitY = wy + dy * hitDist;
            const hitScreen = worldToScreenNew(hitX, hitY);

            // Reflect direction: R = D - 2(D·N)N
            const dot = dx * _rayHitNormalX + dy * _rayHitNormalY;
            const reflectDx = dx - 2 * dot * _rayHitNormalX;
            const reflectDy = dy - 2 * dot * _rayHitNormalY;

            // Reflection length = remaining ray distance
            const reflectLen = maxDist - hitDist;
            const reflectEndX = hitX + reflectDx * reflectLen;
            const reflectEndY = hitY + reflectDy * reflectLen;
            const reflectEndScreen = worldToScreenNew(reflectEndX, reflectEndY);

            // Color: blend light color with hit block color
            let rr = r, rg = g, rb = b;
            let blockColorStr = 'none';
            if (_rayHitBody) {
              // Compare body references directly
              const hitBlock = state.blocks.find(bl => bl.body === _rayHitBody);
              if (hitBlock && hitBlock.color) {
                // Parse block color and blend 50/50 with light
                const bc = hitBlock.color;
                blockColorStr = bc;
                if (bc.startsWith('#')) {
                  const hex = bc.slice(1);
                  const br = parseInt(hex.substr(0, 2), 16);
                  const bg = parseInt(hex.substr(2, 2), 16);
                  const bb = parseInt(hex.substr(4, 2), 16);
                  rr = (r + br) >> 1;
                  rg = (g + bg) >> 1;
                  rb = (b + bb) >> 1;
                }
              }
            }

            ctx.strokeStyle = `rgba(${rr}, ${rg}, ${rb}, ${reflectAlpha})`;
            ctx.beginPath();
            ctx.moveTo(hitScreen.x, hitScreen.y);
            ctx.lineTo(reflectEndScreen.x, reflectEndScreen.y);
            ctx.stroke();
          }
        }
      }
    }

    function rayBoxIntersect(rx, ry, dx, dy, bx, by, size) {
      const halfSize = size / 2;
      const minX = bx - halfSize;
      const maxX = bx + halfSize;
      const minY = by - halfSize;
      const maxY = by + halfSize;

      let tmin = -Infinity;
      let tmax = Infinity;

      if (dx !== 0) {
        const t1 = (minX - rx) / dx;
        const t2 = (maxX - rx) / dx;
        tmin = Math.max(tmin, Math.min(t1, t2));
        tmax = Math.min(tmax, Math.max(t1, t2));
      } else if (rx < minX || rx > maxX) {
        return -1;
      }

      if (dy !== 0) {
        const t1 = (minY - ry) / dy;
        const t2 = (maxY - ry) / dy;
        tmin = Math.max(tmin, Math.min(t1, t2));
        tmax = Math.min(tmax, Math.max(t1, t2));
      } else if (ry < minY || ry > maxY) {
        return -1;
      }

      if (tmax < 0 || tmin > tmax) return -1;
      return tmin > 0 ? tmin : tmax;
    }

    function rayPolygonIntersect(rx, ry, dx, dy, debris) {
      // Simplified polygon intersection
      const pos = debris.body.GetPosition();
      const angle = debris.body.GetAngle();
      let minDist = Infinity;

      const cos = Math.cos(angle);
      const sin = Math.sin(angle);

      for (let i = 0; i < debris.verts.length; i++) {
        const v1 = debris.verts[i];
        const v2 = debris.verts[(i + 1) % debris.verts.length];

        const x1 = pos.get_x() + v1.x * cos - v1.y * sin;
        const y1 = pos.get_y() + v1.x * sin + v1.y * cos;
        const x2 = pos.get_x() + v2.x * cos - v2.y * sin;
        const y2 = pos.get_y() + v2.x * sin + v2.y * cos;

        const dist = rayLineIntersect(rx, ry, dx, dy, x1, y1, x2, y2);
        if (dist > 0 && dist < minDist) {
          minDist = dist;
        }
      }

      return minDist === Infinity ? -1 : minDist;
    }

    function rayLineIntersect(rx, ry, dx, dy, x1, y1, x2, y2) {
      const ex = x2 - x1;
      const ey = y2 - y1;
      const cross = dx * ey - dy * ex;

      if (Math.abs(cross) < 0.0001) return -1;

      const sx = rx - x1;
      const sy = ry - y1;

      const t = (sx * ey - sy * ex) / cross;
      const u = (sx * dy - sy * dx) / cross;

      if (t > 0 && u >= 0 && u <= 1) {
        return t;
      }

      return -1;
    }

    // Draw joints with debug visualization
    function drawJoints() {
      if (!state.joints || state.joints.length === 0) return;

      ctx.save();

      for (const jData of state.joints) {
        const { joint, bodyA, bodyB, type, localAnchorA, localAnchorB } = jData;

        // Skip if bodies were destroyed or joint invalid
        if (!bodyA || !bodyB || !joint) continue;

        // Get anchor positions from stored local anchors
        // IMPORTANT: Don't use joint.GetAnchorA/B - they return pooled objects!
        let waX, waY, wbX, wbY;

        try {
          // Always use stored local anchors - more reliable
          // CRITICAL: GetWorldPoint returns pooled object - copy values IMMEDIATELY!
          const localA = new Physics.b2Vec2(localAnchorA.x, localAnchorA.y);
          const worldA = bodyA.GetWorldPoint(localA);
          // Copy A values RIGHT NOW before next GetWorldPoint call
          waX = worldA.get_x();
          waY = worldA.get_y();
          Physics.destroy?.(localA);

          // Now safe to call GetWorldPoint again
          const localB = new Physics.b2Vec2(localAnchorB.x, localAnchorB.y);
          const worldB = bodyB.GetWorldPoint(localB);
          wbX = worldB.get_x();
          wbY = worldB.get_y();
          Physics.destroy?.(localB);
        } catch (e) {
          continue;
        }

        // Screen coords - use worldToScreenNew to get NEW objects (not pooled!)
        const screenA = worldToScreenNew(waX, waY);
        const screenB = worldToScreenNew(wbX, wbY);

        // Body positions and angles - use worldToScreenNew for all!
        const posA = bodyA.GetPosition();
        const posB = bodyB.GetPosition();
        const angleA = bodyA.GetAngle();
        const angleB = bodyB.GetAngle();
        const centerA = worldToScreenNew(posA.get_x(), posA.get_y());
        const centerB = worldToScreenNew(posB.get_x(), posB.get_y());

        // Calculate distance
        const dist = Math.sqrt((wbX - waX)**2 + (wbY - waY)**2);

        // Calculate angle of the joint line
        const jointAngle = Math.atan2(wbY - waY, wbX - waX);

        // Calculate local anchor angles (relative to body)
        const anchorAngleA = Math.atan2(localAnchorA.y, localAnchorA.x);
        const anchorAngleB = Math.atan2(localAnchorB.y, localAnchorB.x);

        // World angles of anchor directions
        const worldAnchorAngleA = angleA + anchorAngleA;
        const worldAnchorAngleB = angleB + anchorAngleB;

        // ═══════════════════════════════════════════���═══════════════
        // 1. JOINT LINE (green for distance, orange for revolute)
        // ═══════════════════════════════════════════════════════════
        const isRevolute = type === 'revolute';
        ctx.strokeStyle = isRevolute ? '#ff9800' : '#00ff88';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(screenA.x, screenA.y);
        ctx.lineTo(screenB.x, screenB.y);
        ctx.stroke();

        // ═══════════════════════════════════════════════════════════
        // 2. TYPE + DISTANCE LABEL (at midpoint)
        // ═══════════════════════════════════════════════════════════
        const midX = (screenA.x + screenB.x) / 2;
        const midY = (screenA.y + screenB.y) / 2;

        const labelText = isRevolute ? `R ${dist.toFixed(1)}` : `D ${dist.toFixed(1)}`;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(midX - 28, midY - 10, 56, 20);
        ctx.fillStyle = isRevolute ? '#ff9800' : '#00ff88';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(labelText, midX, midY);

        // ═══════════════════════════════════════════════════════════
        // 3. ANCHOR POINTS with labels
        // ═══════════════════════════════════════════════════════════
        // Anchor A (red)
        ctx.fillStyle = '#ff4444';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(screenA.x, screenA.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('A', screenA.x, screenA.y);

        // Anchor B (blue)
        ctx.fillStyle = '#4488ff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(screenB.x, screenB.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.fillText('B', screenB.x, screenB.y);

        // ═══════════════════════════════════════════════════════════
        // 4. BODY CENTER to ANCHOR lines (dashed)
        // ═══════════════════════════════════════════════════════════
        ctx.setLineDash([4, 4]);

        // Body A center to anchor A
        ctx.strokeStyle = 'rgba(255, 100, 100, 0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerA.x, centerA.y);
        ctx.lineTo(screenA.x, screenA.y);
        ctx.stroke();

        // Body B center to anchor B
        ctx.strokeStyle = 'rgba(100, 100, 255, 0.7)';
        ctx.beginPath();
        ctx.moveTo(centerB.x, centerB.y);
        ctx.lineTo(screenB.x, screenB.y);
        ctx.stroke();

        ctx.setLineDash([]);

        // ═══════════════════���══════════════════════════════════════���
        // 5. BODY ROTATION indicators (yellow lines from center)
        // ═══════════���════════════════════════════════════════���══════
        const rotLen = 25;
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 3;

        // Body A rotation
        ctx.beginPath();
        ctx.moveTo(centerA.x, centerA.y);
        ctx.lineTo(centerA.x + Math.cos(angleA) * rotLen, centerA.y + Math.sin(angleA) * rotLen);
        ctx.stroke();

        // Body B rotation
        ctx.beginPath();
        ctx.moveTo(centerB.x, centerB.y);
        ctx.lineTo(centerB.x + Math.cos(angleB) * rotLen, centerB.y + Math.sin(angleB) * rotLen);
        ctx.stroke();

        // ═══════════════════════════════════════════════════════════
        // 6. ANCHOR ANGLE indicators (from anchor point, showing "freedom")
        // ═══════════════════════════════════════════════════════════
        const anchorLen = 35;

        // Anchor A - direction pointing from body center through anchor
        ctx.strokeStyle = '#ff8888';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(screenA.x, screenA.y);
        ctx.lineTo(screenA.x + Math.cos(worldAnchorAngleA) * anchorLen, screenA.y + Math.sin(worldAnchorAngleA) * anchorLen);
        ctx.stroke();

        // Arc showing freedom of rotation at A
        ctx.strokeStyle = 'rgba(255, 136, 136, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(screenA.x, screenA.y, anchorLen * 0.8, worldAnchorAngleA - Math.PI/4, worldAnchorAngleA + Math.PI/4);
        ctx.stroke();

        // Anchor B - direction pointing from body center through anchor
        ctx.strokeStyle = '#8888ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(screenB.x, screenB.y);
        ctx.lineTo(screenB.x + Math.cos(worldAnchorAngleB) * anchorLen, screenB.y + Math.sin(worldAnchorAngleB) * anchorLen);
        ctx.stroke();

        // Arc showing freedom of rotation at B
        ctx.strokeStyle = 'rgba(136, 136, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(screenB.x, screenB.y, anchorLen * 0.8, worldAnchorAngleB - Math.PI/4, worldAnchorAngleB + Math.PI/4);
        ctx.stroke();

        // ════════════════════════════════════════════���══════════════
        // 7. ANGLE LABELS (show degrees)
        // ═══════════════════════════════════════════════════════════
        ctx.font = '9px monospace';
        ctx.textAlign = 'left';

        // Angle A label
        const labelOffsetA = 20;
        ctx.fillStyle = '#ff8888';
        ctx.fillText(
          (angleA * 180 / Math.PI).toFixed(0) + '°',
          screenA.x + labelOffsetA,
          screenA.y - labelOffsetA
        );

        // Angle B label
        ctx.fillStyle = '#8888ff';
        ctx.fillText(
          (angleB * 180 / Math.PI).toFixed(0) + '°',
          screenB.x + labelOffsetA,
          screenB.y - labelOffsetA
        );
      }

      ctx.restore();
    }

          _contourAddPoint(snapped.wx, snapped.wy);
          draw();
        } else if (e.button === 2) { _contourRemoveLast(); draw(); }
        return;
      }
      // Overlap debug snap2: поймать момент клика при wall tool
      if (_overlapDebug.active && currentTool === 'wall') {
        _overlapDebug.snap2 = _takeOverlapSnapshot('at_click', worldPos.wx, worldPos.wy);
        _downloadOverlapDebug();
      }
      pointer.active = true;
      pointer.x = worldPos.wx;
      pointer.y = worldPos.wy;
      pointer.cssX = worldPos.cssX;
      pointer.cssY = worldPos.cssY;

      // ═══ SIMULATE MODE POINTER HANDLING ═══
      if (simulateMode) {
        // Right-click - teleport hero
        if (e.button === 2) {
          e.preventDefault();
          if (heroSpawned && heroBody) {
            teleportHero(worldPos.wx, worldPos.wy);
          }
          return;
        }
        // Left-click - spawn hero
        if (e.button === 0 && !heroSpawned) {
          spawnHero(worldPos.wx, worldPos.wy);
          draw();
          return;
        }
        return;
      }

      // ═══ EDITOR MODE POINTER HANDLING ═══

      // Right/middle click - panning
      if (e.button === 2 || e.button === 1) {
        panning = true;
        panPointerId = e.pointerId;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panOriginX = panX;
        panOriginY = panY;
        canvas.setPointerCapture(e.pointerId);
        return;
      }

      if (e.button !== 0) return;

      // Thruster binding mode
      if (thrusterBindMode) {
        handleThrusterBinding(worldPos);
        return;
      }

      // Lazer binding mode
      if (lazerBindMode) {
        handleLazerBinding(worldPos);
        return;
      }

      // Tool-specific handling
      if (currentTool === 'eraser') {
        eraseAtPosition(worldPos.wx, worldPos.wy);
        canvas.setPointerCapture(e.pointerId);
        return;
      }

      if (currentTool === 'pointer') {
        handlePointerToolDown(worldPos);
        return;
      }

      if (currentTool === 'wall') {
        handleWallToolDown(worldPos, e);
        return;
      }

      if (currentTool === 'tilepaint') {
        handleTilepaintToolDown(worldPos, e);
        return;
      }

      if (currentTool === 'joint') {
        handleJointToolDown(worldPos, e);
        return;
      }

      if (currentTool === 'liquiddream') {
        handleLiquidDreamToolDown(worldPos, e);
        return;
      }

      // Default: light tool - start dragging
      dragging = true;
      dragPointerId = e.pointerId;
      if (snapToGrid && ghostBlockPos) {
        dragStart = { x: ghostBlockPos.x, y: ghostBlockPos.y };
      } else {
        dragStart = { x: worldPos.wx, y: worldPos.wy };
      }
      currentAngle = 0;
      canvas.setPointerCapture(e.pointerId);
    }

    function handleThrusterBinding(worldPos) {
      if (!selectedBlockForThruster) {
        const clickedBlock = findClosestBlock(worldPos.wx, worldPos.wy, 2);
        if (clickedBlock) {
          selectedBlockForThruster = clickedBlock;
          draw();
        }
      } else {
        const edgeIndex = getClosestEdge(selectedBlockForThruster, worldPos.wx, worldPos.wy);
        if (edgeIndex !== -1) {
          thrusterBindings[thrusterBindMode] = {
            block: selectedBlockForThruster,
            edgeIndex
          };

          // Update button
          const btnId = getThrusterButtonId(thrusterBindMode);
          const btn = document.getElementById(btnId);
          if (btn) {
            btn.textContent = '✓';
            btn.style.boxShadow = '';
          }

          thrusterBindMode = null;
          selectedBlockForThruster = null;
          draw();
        }
      }
    }

    function getThrusterButtonId(mode) {
      if (mode.startsWith('thruster')) return 'thrusterUpBtn' + mode.replace('thruster', '');
      if (mode.startsWith('brake')) return 'brakeBtn' + mode.replace('brake', '');
      if (mode.startsWith('pitchLeft')) return 'pitchLeftBtn' + mode.replace('pitchLeft', '');
      if (mode.startsWith('pitchRight')) return 'pitchRightBtn' + mode.replace('pitchRight', '');
      if (mode === 'detonate') return 'detonateBtn';
      if (mode === 'droneEngine') return 'droneEngineBtn';
      if (mode.startsWith('airBurst')) return 'airBurstBtn' + mode.replace('airBurst', '');
      return null;
    }

    function handleLazerBinding(worldPos) {
      const clickedLight = findClosestLight(worldPos.wx, worldPos.wy, 2);
      if (clickedLight) {
        lazerBinding.pewRays = clickedLight.rays;
        lazerBinding.pewFov = clickedLight.fov;
        clickedLight.rays = 0;
        clickedLight.fov = 1;
        lazerBinding.currentRays = 0;
        lazerBinding.currentFov = 1;
        lazerBinding.pew = false;
        lazerBinding.light = clickedLight;
        lazerBindMode = false;

        const btn = document.getElementById('lazerBtn');
        if (btn) {
          btn.textContent = '✓';
          btn.style.boxShadow = '';
        }
        draw();
      }
    }

    function handlePointerToolDown(worldPos) {
      if (pointerSliceMode) {
        sliceLine = { startX: worldPos.wx, startY: worldPos.wy, endX: worldPos.wx, endY: worldPos.wy };
        canvas.setPointerCapture(event.pointerId);
        draw();
        return;
      }

      const block = findClosestBlock(worldPos.wx, worldPos.wy, 2);
      const light = findClosestLight(worldPos.wx, worldPos.wy, 2);

      if (block && light) {
        const blockPos = block.body.GetPosition();
        const lightPos = light.body.GetPosition();
        const blockDist = Math.hypot(blockPos.get_x() - worldPos.wx, blockPos.get_y() - worldPos.wy);
        const lightDistVal = Math.hypot(lightPos.get_x() - worldPos.wx, lightPos.get_y() - worldPos.wy);
        pointerSelectedElement = blockDist < lightDistVal ? { type: 'block', ref: block } : { type: 'light', ref: light };
      } else if (block) {
        pointerSelectedElement = { type: 'block', ref: block };
      } else if (light) {
        pointerSelectedElement = { type: 'light', ref: light };
      } else {
        pointerSelectedElement = null;
      }

      // Apply damage
      if (pointerApplyDamage && pointerSelectedElement) {
        const target = pointerSelectedElement.ref;
        if (typeof target.integrity === 'number') {
          target.integrity -= 25;
          if (target.integrity <= 20 && !target.burned) {
            target.burned = true;
          }
          if (target.integrity <= 0) {
            if (pointerSelectedElement.type === 'block') {
              removeBlock(target, false);
            } else {
              removeLight(target);
            }
            pointerSelectedElement = null;
          }
        }
      }

      // Attach/detach shape gravity to block - ONE CLICK system
      if (pointerAttachGravity) {
        // Find block directly, don't rely on selection
        const clickedBlock = findClosestBlock(worldPos.wx, worldPos.wy, 2);
        if (clickedBlock) {
          if (shapeGravityBodies.has(clickedBlock)) {
            // Remove shape gravity - restore to dynamic body
            shapeGravityBodies.delete(clickedBlock);
            clickedBlock.hasShapeGravity = false;
            clickedBlock.gravity = null;  // Clear per-block gravity
            clickedBlock.body.SetType(Physics.b2_dynamicBody);
            clickedBlock.body.SetAwake(true);
          } else {
            // Save mass BEFORE converting to kinematic (kinematic has mass=0)
            clickedBlock.savedMass = clickedBlock.body.GetMass();
            // Add shape gravity - make kinematic (fixed in space, won't be pushed)
            shapeGravityBodies.add(clickedBlock);
            clickedBlock.hasShapeGravity = true;
            // Store per-block gravity using current attached settings
            const gp = window.tpPanes?.gravityParams;
            clickedBlock.gravity = {
              strength: gp?.attachedForce?.x ?? gravityStrength,
              radius: gp?.attachedForce?.y ?? gravityRadius,
              minDist: gp?.attachedForce?.z ?? gravityMinDist,
              isTerrain: !!clickedBlock.isTerrain
            };
            clickedBlock.body.SetType(Physics.b2_kinematicBody);
            clickedBlock.body.SetLinearVelocity(getVec2(0, 0));
            clickedBlock.body.SetAngularVelocity(0);
          }
          rebuildTerrainSurface();
          draw();
          return;  // Don't continue with other pointer logic
        }
      }

      updatePointerInfo();
      draw();
    }

    function handleWallToolDown(worldPos, e) {
      let blockX = worldPos.wx;
      let blockY = worldPos.wy;

      if (ghostBlockPos) {
        blockX = ghostBlockPos.x;
        blockY = ghostBlockPos.y;
      }

      // TERRAIN mode: x5 size, kinematic, shape gravity
      const blockOptions = {
        color: colorPicker?.colors[1].hexString
      };
      if (terrainMode) {
        blockOptions.sizeMultiplier = 5;
        blockOptions.isTerrain = true;
      }

      // ─── BEGIN: COMBINE placement ───────────────────────────────────────
      // Настоящее слияние: pieces добавляются как fixtures к host телу (первый
      // overlapping terrain блок). Новый отдельный блок НЕ создаётся.
      // Остальные overlapping блоки поглощаются host'ом (их fixtures переносятся,
      // записи из state.blocks удаляются).
      if (terrainMode && combineMode && typeof computeCombineClip === 'function') {
        const sizeMultiplier = 5;
        const size = BLOCK_SIZE * sizeMultiplier;
        const pieces = computeCombineClip(blockX, blockY, size, currentShapeId);

        if (pieces === null) {
          // Нет пересечения — обычное размещение
        } else if (pieces.length === 0) {
          // Полностью поглощён — ничего не добавляем
          return;
        } else {
          const overlapping = pieces._overlappingBlocks || [];
          // Host = первый overlapping terrain блок
          const hostBlock = overlapping[0];

          if (!hostBlock || !hostBlock.body) {
            // Нет host'а — обычное размещение с multiVerts (fallback)
            blockOptions.multiVerts = pieces;
            blockOptions.combine = true;
            blockOptions.surfaceVerts = buildCombineSurface(pieces, pieces._boundaryEdges);
          } else {
            // ── Добавить pieces как fixtures к host телу ──
            const hostPos   = hostBlock.body.GetPosition();
            const hostAngle = hostBlock.body.GetAngle();
            const hostX = hostPos.get_x(), hostY = hostPos.get_y();
            const cosA = Math.cos(-hostAngle), sinA = Math.sin(-hostAngle);

            // World → local host
            const toLocal = (wx, wy) => {
              const dx = wx - hostX, dy = wy - hostY;
              return { x: dx * cosA - dy * sinA, y: dx * sinA + dy * cosA };
            };

            pieces.forEach(piece => {
              // Денормализуем piece из placement-space в world, затем в local host
              const worldVerts = piece.map(v => ({
                x: blockX + v.x * size,
                y: blockY + v.y * size
              }));
              const localVerts = worldVerts.map(v => toLocal(v.x, v.y));

              const flat = localVerts.flatMap(v => [v.x, v.y]);
              try {
                const indices = PolyK.Triangulate(flat);
                for (let i = 0; i < indices.length; i += 3) {
                  const tri = [
                    localVerts[indices[i]],
                    localVerts[indices[i + 1]],
                    localVerts[indices[i + 2]]
                  ];
                  addPolygonFixture(hostBlock.body, tri, { density: 2, friction: 0.8, restitution: 0.1 });
                }
              } catch(e) {}
            });

            // ── Поглотить остальные overlapping блоки (перенести их fixtures) ──
            for (let oi = 1; oi < overlapping.length; oi++) {
              const absorbed = overlapping[oi];
              if (!absorbed.body) continue;
              // Пропустить если уже шарит тело host'а (предыдущая итерация или _sharedBody)
              if (absorbed.body === hostBlock.body || absorbed._sharedBody) continue;

              // Перенести все fixtures absorbed → host в local coords host
              let fix = absorbed.body.GetFixtureList();
              while (fix) {
                const shape = fix.GetShape();
                const shapeType = shape.GetType();
                if (shapeType === 2) {
                  const poly = Physics.b2.castObject(shape, Physics.b2PolygonShape);
                  const count = poly.get_m_count();
                  const absPos   = absorbed.body.GetPosition();
                  const absAngle = absorbed.body.GetAngle();
                  const cosB = Math.cos(absAngle), sinB = Math.sin(absAngle);
                  const absX = absPos.get_x(), absY = absPos.get_y();

                  const worldFixVerts = [];
                  for (let vi = 0; vi < count; vi++) {
                    const v = poly.get_m_vertices(vi);
                    const lx = v.get_x(), ly = v.get_y();
                    worldFixVerts.push({
                      x: absX + lx * cosB - ly * sinB,
                      y: absY + lx * sinB + ly * cosB
                    });
                  }
                  const localFixVerts = worldFixVerts.map(v => toLocal(v.x, v.y));
                  addPolygonFixture(hostBlock.body, localFixVerts, { density: 2, friction: 0.8, restitution: 0.1 });
                }
                fix = fix.GetNext?.() ?? null;
              }

              // Absorbed блок: уничтожаем его отдельное физическое тело,
              // переключаем на shared body host'а.
              // Запись остаётся в state.blocks со своим hasShapeGravity.
              const absPos = absorbed.body.GetPosition();
              const absX = absPos.get_x(), absY = absPos.get_y();
              const absAngle = absorbed.body.GetAngle();
              const absSize = absorbed.size;
              try { state.world.DestroyBody(absorbed.body); } catch(e) {}
              absorbed.body = hostBlock.body; // shared body
              absorbed._sharedBody = true;

              // Перенормализовать вершины absorbed в координатах host тела
              const renorm = (verts) => verts.map(v => {
                // local absorbed → world
                const cosA2 = Math.cos(absAngle), sinA2 = Math.sin(absAngle);
                const wx = absX + (v.x * absSize) * cosA2 - (v.y * absSize) * sinA2;
                const wy = absY + (v.x * absSize) * sinA2 + (v.y * absSize) * cosA2;
                // world → local host (hostAngle≈0 т.к. terrain кинематик)
                return { x: (wx - hostX) / hostBlock.size, y: (wy - hostY) / hostBlock.size };
              });

              if (absorbed.multiVerts) {
                absorbed.multiVerts = absorbed.multiVerts.map(renorm);
              } else if (absorbed.vertices) {
                absorbed.multiVerts = [renorm(absorbed.vertices)];
              }
              absorbed.size = hostBlock.size;
              absorbed._zdogShape = null;
              absorbed._colorDirty = true;
              // shapeGravityBodies — сохраняем state absorbed как было
              if (absorbed.hasShapeGravity && !shapeGravityBodies.has(absorbed)) {
                shapeGravityBodies.add(absorbed);
              } else if (!absorbed.hasShapeGravity) {
                shapeGravityBodies.delete(absorbed);
              }
            }

            // shouldHaveGravity для нового сегмента — по кнопке GRAVITY
            const segShouldHaveGravity = nextBlockGravity;

            // ── Добавить новые pieces как отдельный блок-сегмент ──
            // Новый сегмент шарит body host'а, имеет своё hasShapeGravity
            const newSegMultiVerts = pieces.map(p =>
              p.map(v => ({
                x: (blockX + v.x * size - hostX) / hostBlock.size,
                y: (blockY + v.y * size - hostY) / hostBlock.size,
              }))
            );
            const newSegBlock = {
              uid: physicsWorker.getUid(),
              body: hostBlock.body,  // shared
              _sharedBody: true,
              size: hostBlock.size,
              shapeId: currentShapeId,
              shape: 'polygon',
              vertices: newSegMultiVerts[0] || [],
              multiVerts: newSegMultiVerts,
              surfaceVerts: null,
              color: blockOptions.color || hostBlock.color,
              tile_ID: 0,
              isWall: false,
              integrity: 100,
              burned: false,
              gravity: segShouldHaveGravity ? {
                enabled: true, strength: gravityStrength,
                radius: gravityRadius, mode: 0, isTerrain: true
              } : null,
              isTerrain: true,
              hasShapeGravity: segShouldHaveGravity,
            };
            setBodyUserData(hostBlock.body, { type: 'block', ref: hostBlock });
            state.blocks.push(newSegBlock);
            if (segShouldHaveGravity) shapeGravityBodies.add(newSegBlock);

            // host.multiVerts не меняем — он рисует свой оригинальный кусок
            // (absorbed и newSeg рисуются как отдельные записи state.blocks)

            rebuildTerrainSurface();
            // host block savedMass update
            hostBlock.savedMass = hostBlock.body.GetMass();

            draw();
            captureStateDeferred();
            canvas.setPointerCapture(e.pointerId);
            return;
          }
        }
      }
      // ─── END: COMBINE placement ─────────────────────────────────────────

      const newBlock = addBlock(blockX, blockY, blockOptions);
      if (window._pendingRecHook) {
        const h = window._pendingRecHook;
        _recOnCombinePlaced(h.blockX, h.blockY, h.pieces, h.surfaceVerts, newBlock);
        window._pendingRecHook = null;
      }
      // ─── BEGIN: terrain kinematic + gravity assignment ──────────────────
      // Terrain всегда kinematic. Gravity по умолчанию включена для terrain;
      // кнопка GRAVITY = выключить для terrain / включить для обычного блока.
      if (terrainMode && newBlock && newBlock.body) {
        newBlock.savedMass = newBlock.body.GetMass();
        newBlock.body.SetType(Physics.b2_kinematicBody);
        newBlock.isTerrain = true;
      }
      // Gravity logic:
      // - terrain: гравитация ВКЛЮЧЕНА когда кнопка GRAVITY нажата (nextBlockGravity=true)
      // - обычный блок: гравитация ВКЛЮЧЕНА когда кнопка GRAVITY нажата (nextBlockGravity=true)
      const shouldHaveGravity = nextBlockGravity;
      if (newBlock && newBlock.body && shouldHaveGravity) {
        newBlock.hasShapeGravity = true;
        // Параметры из ANCHOR-секции — как при attach кликом (раньше этот путь
        // брал настройки POINTER-гравитации: два пути давали разные параметры)
        const gp = window.tpPanes?.gravityParams;
        newBlock.gravity = {
          enabled: true,
          strength: gp?.attachedForce?.x ?? gravityStrength,
          radius: gp?.attachedForce?.y ?? gravityRadius,
          minDist: gp?.attachedForce?.z ?? gravityMinDist,
          mode: 0,
          isTerrain: !!terrainMode
        };
        if (!terrainMode) {
          // Источник гравитации фиксирован в пространстве — как при attach
          // кликом и при загрузке мира (раньше блок оставался dynamic до
          // первого сохранения/загрузки)
          newBlock.savedMass = newBlock.body.GetMass();
          newBlock.body.SetType(Physics.b2_kinematicBody);
          newBlock.body.SetLinearVelocity(getVec2(0, 0));
          newBlock.body.SetAngularVelocity(0);
        }
        shapeGravityBodies.add(newBlock);
      }
      // ─── END: terrain kinematic + gravity assignment ─────────────────────
      if (newBlock && newBlock.isTerrain) rebuildTerrainSurface();
      draw();
      captureStateDeferred();
      canvas.setPointerCapture(e.pointerId);
    }

    function handleTilepaintToolDown(worldPos, e) {
      const closestBlock = findClosestBlock(worldPos.wx, worldPos.wy, 2);
      if (closestBlock) {
        closestBlock.tile_ID = currentTileID;
        closestBlock._colorDirty = true;
        draw();
        captureStateDeferred();
      }
      canvas.setPointerCapture(e.pointerId);
    }

    function handleJointToolDown(worldPos, e) {
      if (!jointFirstPoint) {
        // === FIRST CLICK - set anchor A ===
        const closestBody = findClosestBody(worldPos.wx, worldPos.wy, 3);
        if (closestBody) {
          // IMPORTANT: Create a NEW b2Vec2 to avoid pool issues
          const worldPoint = new Physics.b2Vec2(worldPos.wx, worldPos.wy);
          const localAnchorRaw = closestBody.GetLocalPoint(worldPoint);

          // Copy values immediately before pool reuse
          const localAnchorCopy = {
            x: localAnchorRaw.get_x(),
            y: localAnchorRaw.get_y()
          };

          // Store both the copy and create a fresh b2Vec2 for later use
          jointFirstPoint = {
            body: closestBody,
            localAnchor: new Physics.b2Vec2(localAnchorCopy.x, localAnchorCopy.y),
            localAnchorCopy: localAnchorCopy,
            worldClickPos: { x: worldPos.wx, y: worldPos.wy }
          };

          // Clean up temp vector
          Physics.destroy?.(worldPoint);

          if (window.isPlaying) {
            wasPlayingBeforeJoint = true;
            togglePlay();
          } else {
            wasPlayingBeforeJoint = false;
          }
          draw();
        }
      } else {
        // === SECOND CLICK - set anchor B and create joint ===
        const closestBody = findClosestBody(worldPos.wx, worldPos.wy, 3);
        if (closestBody && closestBody !== jointFirstPoint.body) {
          // Use stored world click position directly (more reliable than GetWorldPoint)
          const waX = jointFirstPoint.worldClickPos.x;
          const waY = jointFirstPoint.worldClickPos.y;

          // For anchor B, use the click position directly
          const wbX = worldPos.wx;
          const wbY = worldPos.wy;

          createJointFromUI(
            jointFirstPoint.body, closestBody,
            waX, waY,
            wbX, wbY
          );
          draw();
          captureStateDeferred();
        }

        // Clean up
        if (jointFirstPoint.localAnchor) {
          Physics.destroy?.(jointFirstPoint.localAnchor);
        }

        if (wasPlayingBeforeJoint && !window.isPlaying) {
          togglePlay();
        }
        jointFirstPoint = null;
        jointPreviewLine = null;
        wasPlayingBeforeJoint = false;
      }
      canvas.setPointerCapture(event.pointerId);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // LIQUID DREAM - Tool Handler
    // ════════════════════════���══════════════════════════════════════════════

    let liquidDreamDragging = false;
    let liquidDreamLastSpawn = 0;
    const LIQUID_SPAWN_INTERVAL = 50; // ms between spawns when dragging

    function handleLiquidDreamToolDown(worldPos, e) {
      // WELL mode: разместить источник частиц
      if (window.wellPlaceMode && window.wellPlaceMode()) {
        const wp = window.wellParams;
        addWell(worldPos.wx, worldPos.wy, {
          type:     liquidDream.currentType ?? 'water',
          interval: wp.intervalValues[wp.intervalIndex],
          life:     wp.life,
          force:    wp.forceOn ? { ...wp.force } : null,
          forceOn:  wp.forceOn,
          radius:   (tpPanes.toolParams?.liquidRadius ?? 1) * 0.3
        });
        captureStateDeferred();
        return;
      }
      liquidDreamDragging = true;
      canvas.setPointerCapture(e.pointerId);
      spawnLiquidDreamParticles(worldPos.wx, worldPos.wy);
    }

    function handleLiquidDreamToolMove(worldPos) {
      if (!liquidDreamDragging) return;

      const now = performance.now();
      if (now - liquidDreamLastSpawn > LIQUID_SPAWN_INTERVAL) {
        spawnLiquidDreamParticles(worldPos.wx, worldPos.wy);
        liquidDreamLastSpawn = now;
      }
    }

    function handleLiquidDreamToolUp() {
      liquidDreamDragging = false;
    }

    function spawnLiquidDreamParticles(wx, wy) {
      // Get current type from liquidDream state (set by Tweakpane UI)
      const currentType = liquidDream.currentType || 'water';

      // Get radius from toolParams if available, otherwise use defaults
      const baseRadius = (typeof tpPanes !== 'undefined' && tpPanes.toolParams)
        ? (tpPanes.toolParams.liquidRadius || 1)
        : 1;

      let options = {
        radius: baseRadius * 0.3,
        type: currentType,
        color: liquidDream.colors[currentType] || liquidDream.colors.water
      };

      // Adjust parameters based on particle type
      switch (currentType) {
        case 'water':
        case 'oil':
        case 'acid':
        case 'lava':
        case 'honey':
          options.type = currentType;
          break;

        case 'fire':
          options.type = 'fire';
          options.radius = 0.3;
          break;

        case 'fog':
          options.type = 'fog';  // Special fog type
          options.radius = 1.0;
          break;

        case 'jelly':
          options.type = 'jelly';
          options.radius = 0.8;
          break;

        case 'sand':
        case 'gravel':
        case 'snow':
        case 'dirt':
          options.type = 'powder';
          options.radius = 0.4;
          break;
      }



      createParticleGroup(wx, wy, options);
      draw();
    }

    function handleCanvasPointerMove(e) {
      const worldPos = pointerToWorld(e);
      pointer.active = true;
      pointer.x = worldPos.wx;
      pointer.y = worldPos.wy;
      pointer.cssX = worldPos.cssX;
      pointer.cssY = worldPos.cssY;

      // ═══ SIMULATE MODE - Update hero preview position ═══
      if (simulateMode && !heroSpawned) {
        heroPreviewPos = { x: worldPos.wx, y: worldPos.wy };
        _sceneDirty = true;
        return;
      }

      // Update ghost block position
      if (currentTool === 'wall' || currentTool === 'light') {
        if (snapToGrid) {
          const cornerX = Math.floor(worldPos.wx / gridSize) * gridSize;
          const cornerY = Math.floor(worldPos.wy / gridSize) * gridSize;

          if (currentTool === 'wall') {
            const halfSize = BLOCK_SIZE / 2;
            ghostBlockPos = { x: cornerX + halfSize, y: cornerY + halfSize };
          } else {
            const centerX = cornerX + gridSize / 2;
            const centerY = cornerY + gridSize / 2;
            const distCorner = (worldPos.wx - cornerX) ** 2 + (worldPos.wy - cornerY) ** 2;
            const distCenter = (worldPos.wx - centerX) ** 2 + (worldPos.wy - centerY) ** 2;
            ghostBlockPos = distCorner < distCenter
              ? { x: cornerX, y: cornerY }
              : { x: centerX, y: centerY };
          }
        } else {
          ghostBlockPos = { x: worldPos.wx, y: worldPos.wy };
        }
        _sceneDirty = true;
      } else {
        ghostBlockPos = null;
      }

      // Panning
      if (panning && e.pointerId === panPointerId) {
        const dx = e.clientX - panStartX;
        const dy = e.clientY - panStartY;
        panX = panOriginX + dx * (window.devicePixelRatio || 1);
        panY = panOriginY + dy * (window.devicePixelRatio || 1);
        _sceneDirty = true;
        return;
      }

      // Joint preview
      if (currentTool === 'joint' && jointFirstPoint) {
        const worldAnchorA = jointFirstPoint.body.GetWorldPoint(jointFirstPoint.localAnchor);
        jointPreviewLine = {
          x1: worldAnchorA.get_x(),
          y1: worldAnchorA.get_y(),
          x2: worldPos.wx,
          y2: worldPos.wy
        };
        _sceneDirty = true;
      }

      // Liquid Dream tool - continuous spawn while dragging
      if (currentTool === 'liquiddream') {
        handleLiquidDreamToolMove(worldPos);
      }

      // Slice line
      if (currentTool === 'pointer' && sliceLine) {
        sliceLine.endX = worldPos.wx;
        sliceLine.endY = worldPos.wy;
        _sceneDirty = true;
      }

      // Light dragging - update angle
      if (dragging && dragStart) {
        const dx = worldPos.wx - dragStart.x;
        const dy = worldPos.wy - dragStart.y;
        currentAngle = Math.atan2(-dy, dx);
      }

      // Eraser dragging
      if (currentTool === 'eraser' && e.buttons === 1) {
        eraseAtPosition(worldPos.wx, worldPos.wy);
      }

      // Tilepaint dragging
      if (currentTool === 'tilepaint' && e.buttons === 1) {
        const closestBlock = findClosestBlock(worldPos.wx, worldPos.wy, 2);
        if (closestBlock && closestBlock.tile_ID !== currentTileID) {
          closestBlock.tile_ID = currentTileID;
          closestBlock._colorDirty = true;
          _sceneDirty = true;
        }
      }

      // Wall dragging
      if (currentTool === 'wall' && e.buttons === 1) {
        let blockX = ghostBlockPos ? ghostBlockPos.x : worldPos.wx;
        let blockY = ghostBlockPos ? ghostBlockPos.y : worldPos.wy;
        const existing = findClosestBlock(blockX, blockY, BLOCK_SIZE * 0.4);
        if (!existing) {
          addBlock(blockX, blockY, { color: colorPicker?.colors[1].hexString });
        }
      }

      // Сцена не перерисовывается здесь — physicsLoop подхватит _sceneDirty
      if (_manualContourMode) _sceneDirty = true;
    }

    function handleCanvasPointerUp(e) {
      if (panning && e.pointerId === panPointerId) {
        panning = false;
        panPointerId = null;
        canvas.releasePointerCapture(e.pointerId);
        return;
      }

      // Liquid Dream tool up
      if (currentTool === 'liquiddream') {
        handleLiquidDreamToolUp();
        canvas.releasePointerCapture(e.pointerId);
        return;
      }

      // Slice complete
      if (sliceLine) {
        sliceBlocksWithLine(sliceLine.startX, sliceLine.startY, sliceLine.endX, sliceLine.endY);
        sliceLine = null;
        draw();
      }

      // Light placement complete
      if (dragging && dragStart) {
        const worldPos = pointerToWorld(e);
        const dx = worldPos.wx - dragStart.x;
        const dy = worldPos.wy - dragStart.y;
        const dist = Math.hypot(dx, dy);

        let lightAngle = 0;
        let velocity = null;

        if (dist > 0.5) {
          // Use the same angle calculation as the visual arrow for consistency
          lightAngle = Math.atan2(-dy, dx);

          // Calculate velocity based on drag distance and direction
          // Scale factor to make velocity reasonable
          const velocityScale = 5.0;
          velocity = {
            x: dx * velocityScale,
            y: dy * velocityScale
          };
        }

        const newLight = addLight(dragStart.x, dragStart.y, lightAngle, {
          color: colorPicker?.colors[0].hexString,
          velocity: velocity
        });

        draw();
        captureStateDeferred();
      }

      dragging = false;
      dragStart = null;
      canvas.releasePointerCapture(e.pointerId);
    }

    function handleCanvasWheel(e) {
      e.preventDefault();

      // Calculate new zoom with exponential scaling for smoother feel
      const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
      const newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom * zoomFactor));

      if (newZoom !== zoom) {
        const dpr = window.devicePixelRatio || 1;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // In PLAY mode: zoom directly to hero (no cursor anchor)
        if (simulateMode && heroSpawned && heroBody) {
          const heroPos = heroBody.GetPosition();
          const hx = heroPos.get_x();
          const hy = heroPos.get_y();

          // Apply new zoom
          zoom = newZoom;
          scaledTileSize = tileSize * zoom * dpr;

          // Center camera on hero (zoom to hero, not cursor)
          cameraPanX = -hx * tileSize * zoom;
          cameraPanY = hy * tileSize * zoom;
          panX = cameraPanX;
          panY = cameraPanY;
        } else {
          // Editor mode: zoom to cursor position
          const worldPos = pointerToWorld(e);
          const anchorWX = worldPos.wx;
          const anchorWY = worldPos.wy;

          // Get screen position of cursor
          const rect = canvas.getBoundingClientRect();
          const cssX = e.clientX - rect.left;
          const cssY = e.clientY - rect.top;
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const screenX = cssX * scaleX;
          const screenY = cssY * scaleY;

          // Apply new zoom
          zoom = newZoom;
          scaledTileSize = tileSize * zoom * dpr;

          // Calculate where anchor point would be with new zoom (using worldToScreen formula)
          const newAnchorScreenX = cx + (anchorWX * scaledTileSize) + panX * dpr;
          const newAnchorScreenY = cy - (anchorWY * scaledTileSize) + panY * dpr;

          // Adjust pan (in CSS pixels) to keep anchor at same screen position
          const deltaX = (screenX - newAnchorScreenX) / dpr;
          const deltaY = (screenY - newAnchorScreenY) / dpr;
          panX += deltaX;
          panY += deltaY;
        }

        draw();
      }
    }
