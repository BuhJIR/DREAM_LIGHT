    /**
     * Unifies event handling across browsers
     *
     * - Allows registering and unregistering of event handlers
     * - Injects event object and involved DOM element to listener
     *
     * @author Mark Rolich
     */
    var Event = function () {
        "use strict";
        this.attach = function (evtName, element, listener, capture) {
            var evt = '',
                useCapture = (capture === undefined) ? true : capture,
                handler = null;

            if (window.addEventListener === undefined) {
                evt = 'on' + evtName;
                handler = function (evt, listener) {
                    element.attachEvent(evt, listener);
                    return listener;
                };
            } else {
                evt = evtName;
                handler = function (evt, listener, useCapture) {
                    element.addEventListener(evt, listener, useCapture);
                    return listener;
                };
            }

            return handler.apply(element, [evt, function (ev) {
                var e = ev || event,
                    src = e.srcElement || e.target;
                listener(e, src);
            }, useCapture]);
        };

        this.detach = function (evtName, element, listener, capture) {
            var evt = '',
                useCapture = (capture === undefined) ? true : capture;

            if (window.removeEventListener === undefined) {
                evt = 'on' + evtName;
                element.detachEvent(evt, listener);
            } else {
                evt = evtName;
                element.removeEventListener(evt, listener, useCapture);
            }
        };

        this.stop = function (evt) {
            evt.cancelBubble = true;
            if (evt.stopPropagation) {
                evt.stopPropagation();
            }
        };

        this.prevent = function (evt) {
            if (evt.preventDefault) {
                evt.preventDefault();
            } else {
                evt.returnValue = false;
            }
        };
    };

// MODULE: HERO MODE ADAPTER (Uses global functions like OPIUM)
// ═══════════════════════════════════════════════════════════════════════
// This is a thin adapter for QubeSystem that delegates to global hero functions

class HeroMode {
  constructor() {
    this.name = "PLAY AS SHAPE";
    this.description = "Select a shape and control it in the world.";
    this.id = "mode_hero";
    this.selectedShapeId = 'box';
    this.selectorOverlay = null;
  }

  mount() {
    // Show shape selector first
    this.showShapeSelector();
  }

  showShapeSelector() {
    // Create overlay
    this.selectorOverlay = document.createElement('div');
    this.selectorOverlay.id = 'shape-selector-overlay';
    Object.assign(this.selectorOverlay.style, {
      position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
      background: 'rgba(5, 10, 15, 0.95)', zIndex: '9998',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center'
    });

    // Title
    const title = document.createElement('div');
    title.innerHTML = 'SELECT YOUR SHAPE';
    Object.assign(title.style, {
      color: '#0ff', fontSize: '1.5em', fontFamily: 'monospace',
      letterSpacing: '3px', marginBottom: '30px', textTransform: 'uppercase'
    });

    // Grid container
    const grid = document.createElement('div');
    Object.assign(grid.style, {
      display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(100px, 1fr))',
      gap: '15px', maxWidth: '600px', width: '90%', padding: '20px'
    });

    // Create shape buttons from catalog
    window.shapeCatalog.forEach(shape => {
      const btn = document.createElement('button');
      Object.assign(btn.style, {
        width: '100%', aspectRatio: '1', background: 'rgba(0,255,255,0.05)',
        border: '2px solid rgba(0,255,255,0.3)', borderRadius: '8px',
        cursor: 'pointer', display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center', gap: '8px',
        transition: 'all 0.15s', padding: '10px'
      });

      // Shape preview canvas
      const canvas = document.createElement('canvas');
      canvas.width = 60; canvas.height = 60;
      const ctx = canvas.getContext('2d');
      this.drawShapePreview(ctx, shape, 60);
      btn.appendChild(canvas);

      // Label
      const label = document.createElement('div');
      label.textContent = shape.name;
      Object.assign(label.style, { color: '#0ff', fontSize: '0.8em', fontFamily: 'monospace' });
      btn.appendChild(label);

      btn.onmouseenter = () => {
        btn.style.background = 'rgba(0,255,255,0.15)';
        btn.style.borderColor = '#0ff';
        btn.style.transform = 'scale(1.05)';
      };
      btn.onmouseleave = () => {
        btn.style.background = 'rgba(0,255,255,0.05)';
        btn.style.borderColor = 'rgba(0,255,255,0.3)';
        btn.style.transform = 'scale(1)';
      };

      btn.onclick = () => {
        this.selectedShapeId = shape.id;
        window.selectedHeroShape = shape;
        this.startPlay();
      };

      grid.appendChild(btn);
    });

    // Cancel button
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '✕ CANCEL';
    Object.assign(cancelBtn.style, {
      marginTop: '30px', padding: '12px 30px', background: 'transparent',
      border: '1px solid #555', color: '#888', fontFamily: 'monospace',
      cursor: 'pointer', borderRadius: '4px', transition: 'all 0.15s'
    });
    cancelBtn.onmouseenter = () => { cancelBtn.style.borderColor = '#f55'; cancelBtn.style.color = '#f55'; };
    cancelBtn.onmouseleave = () => { cancelBtn.style.borderColor = '#555'; cancelBtn.style.color = '#888'; };
    cancelBtn.onclick = () => {
      this.closeSelectorAndStop();
    };

    this.selectorOverlay.appendChild(title);
    this.selectorOverlay.appendChild(grid);
    this.selectorOverlay.appendChild(cancelBtn);
    document.body.appendChild(this.selectorOverlay);
  }

  drawShapePreview(ctx, shape, size) {
    const cx = size / 2, cy = size / 2, s = size * 0.35;
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = shape.color || '#0ff';
    ctx.strokeStyle = shape.color || '#0ff';
    ctx.lineWidth = 2;

    if (shape.type === 'primitive') {
      if (shape.primitive === 'box') {
        ctx.fillRect(cx - s * 0.7, cy - s * 0.7, s * 1.4, s * 1.4);
      } else if (shape.primitive === 'circle') {
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (shape.vertices) {
      ctx.beginPath();
      shape.vertices.forEach((v, i) => {
        const x = cx + v.x * s * 2, y = cy - v.y * s * 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
    }
  }

  startPlay() {
    // Close selector
    if (this.selectorOverlay) {
      this.selectorOverlay.remove();
      this.selectorOverlay = null;
    }
    // Start game with selected shape
    if (window.enterSimulateMode) {
      window.enterSimulateMode();
    }
  }

  closeSelectorAndStop() {
    if (this.selectorOverlay) {
      this.selectorOverlay.remove();
      this.selectorOverlay = null;
    }
    // Return to QUBE OS
    if (window.Qube) {
      window.Qube.activeModule = null;
    }
  }

  unmount() {
    // Close selector if open
    if (this.selectorOverlay) {
      this.selectorOverlay.remove();
      this.selectorOverlay = null;
    }
    // Delegate to global function
    if (window.exitSimulateMode) {
      window.exitSimulateMode();
    }
  }

  update(dt) {
    // Movement and camera are now called from physicsLoop directly
  }

  draw(ctx) {
    // Drawing is now done in main draw() function
  }
}

// Global Shape Catalog - фигуры загружаются сюда
// Triangles are pre-computed for Box2D (each array is 3 vertices forming a convex triangle)
// Generate circle vertices (32 points for catalog default)
function generateCircleCatalogVertices(numVerts = 16) {
  const verts = [];
  for (let i = 0; i < numVerts; i++) {
    const angle = (i / numVerts) * Math.PI * 2;
    verts.push({ x: Math.cos(angle) * 0.5, y: Math.sin(angle) * 0.5 });
  }
  return verts;
}

// Generate fan triangulation from first vertex (like hexagon, NOT from center)
function generateCircleCatalogTriangles(numVerts = 16) {
  const verts = generateCircleCatalogVertices(numVerts);
  const triangles = [];
  // Fan from vertex 0 to all other edges
  for (let i = 1; i < numVerts - 1; i++) {
    triangles.push([verts[0], verts[i], verts[i + 1]]);
  }
  return triangles;
}

window.shapeCatalog = [
  { id: 'box', name: 'Box', type: 'primitive', primitive: 'box' },
  { id: 'circle', name: 'Circle', type: 'polygon',
    vertices: generateCircleCatalogVertices(16),
    // 16-gon with fan triangulation from first vertex (like hexagon)
    triangles: generateCircleCatalogTriangles(16) },
  { id: 'triangle', name: 'Triangle', type: 'polygon',
    vertices: [{x:0, y:0.5}, {x:-0.433, y:-0.25}, {x:0.433, y:-0.25}],
    // Triangle is already convex - one fixture
    triangles: [[{x:0, y:0.5}, {x:-0.433, y:-0.25}, {x:0.433, y:-0.25}]],
    color: '#4FC3F7' },
  { id: 'diamond', name: 'Diamond', type: 'polygon',
    vertices: [{x:0, y:0.5}, {x:-0.4, y:0}, {x:0, y:-0.5}, {x:0.4, y:0}],
    // Diamond splits into 2 triangles
    triangles: [
      [{x:0, y:0.5}, {x:-0.4, y:0}, {x:0, y:-0.5}],
      [{x:0, y:0.5}, {x:0, y:-0.5}, {x:0.4, y:0}]
    ],
    color: '#CE93D8' },
  { id: 'hexagon', name: 'Hexagon', type: 'polygon',
    vertices: [
      {x:0.5, y:0}, {x:0.25, y:0.433}, {x:-0.25, y:0.433},
      {x:-0.5, y:0}, {x:-0.25, y:-0.433}, {x:0.25, y:-0.433}
    ],
    // Hexagon splits into 4 triangles (fan from first vertex)
    triangles: [
      [{x:0.5, y:0}, {x:0.25, y:0.433}, {x:-0.25, y:0.433}],
      [{x:0.5, y:0}, {x:-0.25, y:0.433}, {x:-0.5, y:0}],
      [{x:0.5, y:0}, {x:-0.5, y:0}, {x:-0.25, y:-0.433}],
      [{x:0.5, y:0}, {x:-0.25, y:-0.433}, {x:0.25, y:-0.433}]
    ],
    color: '#81C784' }
];

// DEV MODE - Place creations, test with simulation
// Two panels: RUN (simulate) and STUFF (create/load)
// ═══════════════════════════════════════════════════════════════════════
class DevMode {
  constructor() {
    this.name = "DEV MODE";
    this.description = "Place creations from repository, test with simulation.";
    this.id = "mode_dev";

    this.category = 'buildings';
    this.creations = [];
    this.selectedCreation = null;
    this.savedState = null;
    this.isSimulating = false;
    this.isPlaying = false;  // PLAY mode (hero control in simulate)

    // Tweakpane panels
    this.runPane = null;
    this.stuffPane = null;
    this.activeTab = 'make'; // 'make' or 'form'
  }

  mount() {
    this.createRunPanel();
    this.createStuffPanel();

    // Hide unnecessary panels in DEV MODE (COSMOS, OVERCLOCK, AUDIO, COMMAND)
    this.hiddenPanelIds = ['universe', 'overclock', 'sounds', 'mission'];
    this.hiddenPanelIds.forEach(id => {
      const panel = document.getElementById(`tp-${id}`);
      if (panel) panel.style.display = 'none';
    });

    // Keyboard shortcuts
    this.keyHandler = (e) => {
      if (e.target.matches('input, textarea')) return;

      // Space = toggle REC/STOP (physics simulation)
      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        this.toggleSimulation();
      }

      // Enter = restart (for PLAY mode)
      if (e.code === 'Enter' && !e.repeat && this.isPlaying) {
        e.preventDefault();
        this.restartPlay();
      }

      // ESC = exit PLAY
      if (e.code === 'Escape' && this.isPlaying) {
        e.preventDefault();
        this.stopPlay();
      }
    };
    window.addEventListener('keydown', this.keyHandler);
  }

  unmount() {
    if (this.runPane) { this.runPane.dispose(); this.runPane = null; }
    if (this.stuffPane) { this.stuffPane.dispose(); this.stuffPane = null; }
    if (this.isPlaying) this.stopPlay();
    if (this.keyHandler) {
      window.removeEventListener('keydown', this.keyHandler);
      this.keyHandler = null;
    }

    // Restore hidden panels (COSMOS, OVERCLOCK, AUDIO, COMMAND)
    if (this.hiddenPanelIds) {
      this.hiddenPanelIds.forEach(id => {
        const panel = document.getElementById(`tp-${id}`);
        if (panel) panel.style.display = '';
      });
    }
  }

  // ─── RUN PANEL ───────────────────────────────────────────────────────
  createRunPanel() {
    if (!window.Tweakpane) return;
    const Pane = window.Tweakpane.Pane;

    this.runPane = new Pane({ title: '🎬 REC', expanded: true });

    const container = this.runPane.element.querySelector('.tp-rotv_c');
    if (!container) return;

    // RECORD / EJECT button (sci-fi grid pattern style)
    const gameBtn = document.createElement('button');
    gameBtn.id = 'dev-game-btn';
    gameBtn.textContent = 'RECORD';
    gameBtn.style.cssText = `
      width: 100%; padding: 10px 16px; margin: 5px 0;
      cursor: pointer; text-transform: uppercase;
      letter-spacing: 3px; font-weight: 700; font-size: 11px;
      background:
        radial-gradient(circle, rgba(255,60,60,0.25) 0%, rgba(0,0,0,0) 70%),
        linear-gradient(rgba(255,60,60,0.08) 1px, transparent 1px),
        linear-gradient(to right, rgba(255,60,60,0.08) 1px, transparent 1px);
      background-size: cover, 12px 12px, 12px 12px;
      background-position: center, center, center;
      border: none;
      border-top: 1px solid; border-bottom: 1px solid;
      border-image: radial-gradient(circle, rgba(255,80,80,0.8) 0%, rgba(0,0,0,0) 100%) 1;
      color: rgba(255,100,100,0.9);
      transition: all 0.2s ease-in-out;
      text-shadow: 0 0 8px rgba(255,60,60,0.4);
    `;

    gameBtn.onmouseenter = () => {
      if (!this.isPlaying) {
        gameBtn.style.backgroundSize = 'cover, 8px 8px, 8px 8px';
        gameBtn.style.color = '#ff6666';
        gameBtn.style.textShadow = '0 0 12px rgba(255,60,60,0.6)';
      }
    };

    gameBtn.onmouseleave = () => {
      if (!this.isPlaying) {
        gameBtn.style.backgroundSize = 'cover, 12px 12px, 12px 12px';
        gameBtn.style.color = 'rgba(255,100,100,0.9)';
        gameBtn.style.textShadow = '0 0 8px rgba(255,60,60,0.4)';
      }
    };

    gameBtn.onclick = () => this.togglePlay();
    this.gameBtn = gameBtn;
    container.appendChild(gameBtn);

    // Register as draggable
    if (window.registerTweakpane) {
      window.registerTweakpane(this.runPane, 'dev-run', { x: 12, y: 218 });
    }
  }

  // ─── STUFF PANEL ────────────────────────────────���────────────────────

    if (!window.Tweakpane) return;
    const Pane = window.Tweakpane.Pane;

    this.stuffPane = new Pane({ expanded: true });

    // Native Tweakpane tabs (like GRAVITY/SETUP)

      pages: [
        { title: 'MAKE' },
        { title: 'FORM' }

    // === MAKE Tab (page 0) ===
    const makePage = this.propsTab.pages[0];
    const makeContainer = makePage.element.querySelector('.tp-brkv') || makePage.element;

    // Category row: buttons + CREATE
    this.catContainer = document.createElement('div');
    this.catContainer.style.cssText = 'display: flex; gap: 3px; margin: 4px; padding: 4px;';

    ['buildings', 'mechanisms', 'vehicles', 'tera'].forEach((cat, i) => {
      const btn = document.createElement('button');
      btn.textContent = ['🏠', '⚙️', '🚗', '🪨'][i];
      btn.title = cat;
      btn.dataset.cat = cat;
      btn.style.cssText = `
        flex: 1; padding: 5px;
        border: 1px solid ${i === 0 ? '#fc0' : 'rgba(255,255,255,0.2)'};
        border-radius: 3px;
        background: ${i === 0 ? 'rgba(255,200,0,0.15)' : 'rgba(0,0,0,0.3)'};
        color: ${i === 0 ? '#fc0' : 'rgba(255,255,255,0.5)'};
        cursor: pointer; font-size: 12px; transition: all 0.15s;

      btn.onclick = () => {
        this.catContainer.querySelectorAll('button[data-cat]').forEach(b => {
          b.style.background = 'rgba(0,0,0,0.3)';
          b.style.borderColor = 'rgba(255,255,255,0.2)';
          b.style.color = 'rgba(255,255,255,0.5)';

        btn.style.background = 'rgba(255,200,0,0.15)';
        btn.style.borderColor = '#fc0';
        btn.style.color = '#fc0';
        this.category = cat;
        this.loadList();
      };
      this.catContainer.appendChild(btn);

    // CREATE button
    const createBtn = document.createElement('button');
    createBtn.textContent = '+';
    createBtn.title = 'Create new';
    createBtn.style.cssText = `
      padding: 5px 8px;

    createBtn.onmouseleave = () => { createBtn.style.background = 'rgba(0,255,0,0.1)'; createBtn.style.color = 'rgba(0,255,0,0.7)'; };

    this.loadList();

  async loadList() {

  drawShapePreview(ctx, shape, size) {
    const cx = size / 2, cy = size / 2, s = size * 0.35;
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = shape.color || '#0ff';
    ctx.strokeStyle = shape.color || '#0ff';
    ctx.lineWidth = 2;

    if (shape.type === 'primitive') {
      if (shape.primitive === 'box') {
        ctx.fillRect(cx - s * 0.7, cy - s * 0.7, s * 1.4, s * 1.4);
      } else if (shape.primitive === 'circle') {
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (shape.vertices) {
      ctx.beginPath();
      shape.vertices.forEach((v, i) => {
        const x = cx + v.x * s * 2, y = cy - v.y * s * 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
    }
  }

  startPlay() {
    // Save state for restart
    if (window.serializeScene) {
      this.savedState = window.serializeScene();
    }

    this.isPlaying = true;
    this.isSimulating = true;
    window.simulateMode = true;

    // Use enterSimulateMode - it sets up all UI properly
    // User clicks to spawn hero, we capture spawn point via listener
    if (window.enterSimulateMode) {
      window.enterSimulateMode();
    }

    // Listen for hero spawn to capture spawn point
    this.spawnListener = () => {
      if (window.heroSpawnPoint) {
        this.spawnX = window.heroSpawnPoint.x;
        this.spawnY = window.heroSpawnPoint.y;
        console.log('[DEV] Spawn point captured:', this.spawnX.toFixed(1), this.spawnY.toFixed(1));
      }
    };
    window.addEventListener('hero-spawned', this.spawnListener);

    if (this.gameBtn) {
      this.gameBtn.textContent = 'EJECT';
      this.gameBtn.style.background = `
        radial-gradient(circle, rgba(0,255,100,0.35) 0%, rgba(0,0,0,0) 70%),
        linear-gradient(rgba(0,255,100,0.12) 1px, transparent 1px),
        linear-gradient(to right, rgba(0,255,100,0.12) 1px, transparent 1px)`;
      this.gameBtn.style.backgroundSize = 'cover, 8px 8px, 8px 8px';
      this.gameBtn.style.borderImage = 'radial-gradient(circle, rgba(0,255,100,0.9) 0%, rgba(0,0,0,0) 100%) 1';
      this.gameBtn.style.color = '#6f6';
      this.gameBtn.style.textShadow = '0 0 12px rgba(0,255,100,0.5)';
    }

    console.log('[DEV] PLAY mode - click to spawn hero');
  }

  stopPlay() {
    this.isPlaying = false;
    this.isSimulating = false;
    window.simulateMode = false;

    // Remove listener
    if (this.spawnListener) {
      window.removeEventListener('hero-spawned', this.spawnListener);
      this.spawnListener = null;
    }

    // Use exitSimulateMode for proper cleanup
    if (window.exitSimulateMode) {
      window.exitSimulateMode();
    }

    // Restore original state
    if (this.savedState && window.rebuildWorld) {
      window.rebuildWorld(this.savedState);
      if (window.draw) window.draw();
    }

    // Reset Panel Button fully
    if (this.gameBtn) {
      this.gameBtn.textContent = 'RECORD';
      this.gameBtn.style.background = `
        radial-gradient(circle, rgba(255,60,60,0.25) 0%, rgba(0,0,0,0) 70%),

      this.gameBtn.style.color = 'rgba(255,100,100,0.9)';
      this.gameBtn.style.textShadow = '0 0 8px rgba(255,60,60,0.4)';
    }

    console.log('[DEV] REC mode stopped');
  }

  restartPlay() {
    // Only restart if we have a spawn point
    if (this.spawnX === undefined) {
      console.log('[DEV] No spawn point yet - click to spawn first');
      return;
    }

    // Destroy hero, rebuild world, respawn at same point

      <button id="se-clear" style="background:#4a2020; border:1px solid #f44; color:#f88; padding:8px 16px; border-radius:4px; cursor:pointer;">Clear</button>
      <button id="se-save" style="background:#204a20; border:1px solid #4f4; color:#8f8; padding:8px 16px; border-radius:4px; cursor:pointer;">💾 Save</button>
      <button id="se-close" style="background:#333; border:1px solid #666; color:#aaa; padding:8px 16px; border-radius:4px; cursor:pointer;">✕ Close</button>

  resizeCanvas() {
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = rect.width;
    this.canvas.height = rect.height;
    this.redraw();
  }

  bindEvents() {
    // Mouse events on canvas
    this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
    this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
    this.canvas.addEventListener('mouseup', () => this.onMouseUp());
    this.canvas.addEventListener('dblclick', (e) => this.onDoubleClick(e));
    this.canvas.addEventListener('contextmenu', (e) => this.onRightClick(e));

    // Touch support
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      this.onMouseDown({ clientX: touch.clientX, clientY: touch.clientY, button: 0 });
    });
    this.canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      this.onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
    });
    this.canvas.addEventListener('touchend', () => this.onMouseUp());

    // Toolbar buttons
    this.overlay.querySelector('#se-clear').onclick = () => {
      this.poly = [];
      this.updatePointCount();
      this.redraw();
    };
    this.overlay.querySelector('#se-save').onclick = () => this.saveShape();
    this.overlay.querySelector('#se-close').onclick = () => window.Qube.stop();

    this.overlay.querySelector('#se-name').oninput = (e) => {
      this.shapeName = e.target.value || 'Custom';
    };
    this.overlay.querySelector('#se-color').oninput = (e) => {
      this.shapeColor = e.target.value;
      this.redraw();
    };
  }

  getMousePos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  findDotAt(mx, my) {
    const n = this.poly.length / 2;
    for (let i = 0; i < n; i++) {
      const dx = this.poly[i * 2] - mx;
      const dy = this.poly[i * 2 + 1] - my;
      if (dx * dx + dy * dy < 20 * 20) return i;  // 20px radius for easy grab
    }
    return -1;
  }

  onMouseDown(e) {
    const { x, y } = this.getMousePos(e);
    const dotIdx = this.findDotAt(x, y);

    if (dotIdx !== -1) {
      // Start dragging existing point
      this.dragged = dotIdx;
      this.canvas.style.cursor = 'grabbing';
    } else {
      // Add new point
      this.poly.push(x, y);
      this.dragged = this.poly.length / 2 - 1;  // Drag the new point
      this.updatePointCount();
      this.redraw();
    }
  }

  onMouseMove(e) {
    const { x, y } = this.getMousePos(e);

    if (this.dragged !== null) {
      this.poly[this.dragged * 2] = x;
      this.poly[this.dragged * 2 + 1] = y;
      this.redraw();
    } else {
      // Update cursor
      const dotIdx = this.findDotAt(x, y);
      this.canvas.style.cursor = dotIdx !== -1 ? 'grab' : 'crosshair';
    }
  }

  onMouseUp() {
    this.dragged = null;
    this.canvas.style.cursor = 'crosshair';
  }

  onDoubleClick(e) {
    const { x, y } = this.getMousePos(e);
    const dotIdx = this.findDotAt(x, y);

    if (dotIdx !== -1 && this.poly.length > 6) {  // Keep at least 3 points
      this.poly.splice(dotIdx * 2, 2);
      this.updatePointCount();
      this.redraw();
    }
  }

  onRightClick(e) {
    e.preventDefault();
    const { x, y } = this.getMousePos(e);
    const dotIdx = this.findDotAt(x, y);

    // Delete point on right-click (same logic as double-click)
    if (dotIdx !== -1 && this.poly.length > 6) {  // Keep at least 3 points
      this.poly.splice(dotIdx * 2, 2);
      this.updatePointCount();
      this.redraw();
    }
  }

  loadPreset(type) {
    const cx = this.canvas.width / 2;
    const cy = this.canvas.height / 2;
    const r = Math.min(cx, cy) * 0.6;

    this.poly = [];

    if (type === 'star') {
      const innerR = r * 0.4;
      for (let i = 0; i < 10; i++) {
        const angle = (i / 10) * Math.PI * 2 - Math.PI / 2;
        const radius = i % 2 === 0 ? r : innerR;
        this.poly.push(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
      }
    }

    this.updatePointCount();
    this.redraw();
  }

  updatePointCount() {
    const el = this.overlay.querySelector('#se-point-count');
    if (el) el.textContent = `${this.poly.length / 2} pts`;
  }

  // ════════════════════════ RENDERING (IvanK style) ════════════════════════

  redraw() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;

    // Clear with dark background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, w, h);

    // Grid
    ctx.strokeStyle = '#252540';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < w; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let y = 0; y < h; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    const n = this.poly.length / 2;
    if (n < 1) return;

    // Fill polygon with triangulation (PolyK)
    if (n >= 3) {
      const tgs = PolyK.Triangulate(this.poly);

      // Fill triangles
      ctx.fillStyle = this.shapeColor;
      ctx.beginPath();
      for (let i = 0; i < tgs.length; i += 3) {
        const i0 = tgs[i], i1 = tgs[i + 1], i2 = tgs[i + 2];
        ctx.moveTo(this.poly[i0 * 2], this.poly[i0 * 2 + 1]);
        ctx.lineTo(this.poly[i1 * 2], this.poly[i1 * 2 + 1]);
        ctx.lineTo(this.poly[i2 * 2], this.poly[i2 * 2 + 1]);
        ctx.closePath();
      }
      ctx.fill();

      // Draw triangle edges
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      for (let i = 0; i < tgs.length; i += 3) {
        const i0 = tgs[i], i1 = tgs[i + 1], i2 = tgs[i + 2];
        ctx.beginPath();
        ctx.moveTo(this.poly[i0 * 2], this.poly[i0 * 2 + 1]);
        ctx.lineTo(this.poly[i1 * 2], this.poly[i1 * 2 + 1]);
        ctx.lineTo(this.poly[i2 * 2], this.poly[i2 * 2 + 1]);
        ctx.closePath();
        ctx.stroke();
      }
    }

    // Outline
    ctx.beginPath();
    ctx.moveTo(this.poly[0], this.poly[1]);
    for (let i = 1; i < n; i++) ctx.lineTo(this.poly[i * 2], this.poly[i * 2 + 1]);
    if (n >= 3) ctx.closePath();
    ctx.strokeStyle = '#f00';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Draw dots (IvanK style - outer shadow + white center)
    for (let i = 0; i < n; i++) {
      const vx = this.poly[i * 2];
      const vy = this.poly[i * 2 + 1];

      // Outer shadow
      ctx.beginPath();
      ctx.arc(vx, vy, 16, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fill();

      // White center
      ctx.beginPath();
      ctx.arc(vx, vy, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();

      // Number label
      ctx.fillStyle = '#000';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), vx, vy);
    }
  }

  // ════════════════════════ SAVE ═══════════════════════���

  saveShape() {
    const n = this.poly.length / 2;
    if (n < 3) {
      return;
    }

    // Triangulate in screen coordinates (before any transforms)
    const screenIndices = PolyK.Triangulate(this.poly);
    if (screenIndices.length < 3) return;

    // Step 3: Find bounds for normalization
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < n; i++) {
      minX = Math.min(minX, this.poly[i * 2]);
      maxX = Math.max(maxX, this.poly[i * 2]);
      minY = Math.min(minY, this.poly[i * 2 + 1]);
      maxY = Math.max(maxY, this.poly[i * 2 + 1]);
    }

    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const scale = Math.max(maxX - minX, maxY - minY);

    // Step 4: Normalize vertices to -0.5..0.5 range, flip Y for physics coords
    const vertices = [];
    for (let i = 0; i < n; i++) {
      vertices.push({
        x: (this.poly[i * 2] - cx) / scale,
        y: -(this.poly[i * 2 + 1] - cy) / scale  // Flip Y: screen Y down -> physics Y up
      });
    }

    // Step 5: Build triangles using the pre-computed indices
    // Note: ensureCCW in addPolygonFixture will fix winding order for Box2D
    const triangles = [];
    for (let i = 0; i < screenIndices.length; i += 3) {
      const i0 = screenIndices[i];
      const i1 = screenIndices[i + 1];
      const i2 = screenIndices[i + 2];
      triangles.push([vertices[i0], vertices[i1], vertices[i2]]);
    }

    const shape = {
      id: 'custom_' + Date.now(),
      name: this.shapeName,
      type: 'polygon',
      vertices: vertices,
      triangles: triangles,
      color: this.shapeColor
    };

    window.shapeCatalog.push(shape);

    window.dispatchEvent(new CustomEvent('shape-catalog-updated', { detail: shape }));

    // Close editor
    window.Qube.stop();
  }

  // Required by QUBE
  update(dt) {}
  draw(ctx) {}
}

    container.appendChild(header);
    container.appendChild(list);
    container.appendChild(closeBtn);
    overlay.appendChild(container);

    document.body.appendChild(overlay);
    this.ui = overlay;
  }

  closeUI() {
    if (this.ui) {
      this.ui.remove();
      this.ui = null;
    }
    this.active = false;
  }

  // ═════════���══════════════ RUNTIME ════════════════════════

  load(moduleId) {
    const mod = this.modules.find(m => m.id === moduleId);
    if (!mod) return;

    this.closeUI();

    if (this.activeModule) {
      this.activeModule.unmount();
    }

    this.activeModule = mod;
    this.activeModule.mount();
  }

  stop() {
    if (this.activeModule) {
      this.activeModule.unmount();
      this.activeModule = null;
    }
  }

  // Called from Main Loop
  update(dt) {
    if (this.activeModule) {
      this.activeModule.update(dt);
    }
  }

  draw(ctx) {
    if (this.activeModule) {
      this.activeModule.draw(ctx);
    }
  }
}

// Global Instance
window.Qube = new QubeSystem();

      Physics.b2_wallParticle = b2.b2_wallParticle ?? (1 << 12);           // Wall - less compressible

    function generateCircleVertices(radius, numVertices = null) {

        else if (radius <= 1.6) numVertices = 32;

      for (let i = 0; i < verts.length; i++) {

      const ccwVerts = ensureCCW(vertices.slice(0, count));

          const floatSize = 4;
          const vecSize = 2 * floatSize;

          if (typeof shape._Set === 'function') {

            const vec = b2.wrapPointer(ptr, Physics.b2Vec2);
            shape.Set(vec, count);
            success = true;
          }

          b2._free(ptr);
        } catch (e) {
        }
      }

      if (!success) {
        try {
          // Allocate b2Vec2 array - some Emscripten builds need this approach
          const vecs = [];
          for (let i = 0; i < count; i++) {
            vecs.push(new Physics.b2Vec2(ccwVerts[i].x, ccwVerts[i].y));
          }

          if (typeof shape.Set === 'function') {
            shape.Set(vecs[0], count);
            success = true;
          }

          vecs.forEach(v => { try { b2.destroy(v); } catch(e){} });
        } catch (e) {}
      }

      // === Method 3: Direct vertex property access (LiquidFun lfjs style) ===
      if (!success && shape.vertices && typeof shape.vertices.push === 'function') {
        try {
          for (let i = 0; i < count; i++) {
            shape.vertices.push(new Physics.b2Vec2(ccwVerts[i].x, ccwVerts[i].y));
          }
          success = true;
        } catch (e) {}
      }

      // === Fallback: SetAsBox for quad-like shapes ===
      if (!success) {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        ccwVerts.forEach(v => {
          minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
          minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
        });
        const hw = (maxX - minX) / 2;
        const hh = (maxY - minY) / 2;
        if (hw > 0.001 && hh > 0.001) {
          shape.SetAsBox(hw, hh);
          success = true;
        }
      }

      if (!success) {
        try { b2.destroy(shape); } catch(e) {}
        return false;
      }

      // Create fixture with this shape
      ensurePhysicsDefs();
      _fixtureDef.set_shape(shape);
      _fixtureDef.set_density(options.density ?? 2);
      _fixtureDef.set_friction(options.friction ?? 0.8);
      _fixtureDef.set_restitution(options.restitution ?? 0.1);

    // Ensure vertices are in counter-clockwise order
    function ensureCCW(vertices) {
      // Calculate signed area to determine winding order
      let signedArea = 0;
      const n = vertices.length;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        signedArea += vertices[i].x * vertices[j].y;
        signedArea -= vertices[j].x * vertices[i].y;
      }
      signedArea /= 2;

      // If area is negative, vertices are clockwise - reverse them
      if (signedArea < 0) {
        return vertices.slice().reverse();
      }
      return vertices;
    }

    // ═══ GRID-BASED PARTICLE CREATION ═══
    // Particles placed on fixed grid (step = 0.1), independent of particle radius
    const PARTICLE_GRID_STEP = 0.20; // >= 2 * particle radius (0.09) — без перекрытия, без взрыва

    // Create particles at position using grid placement
    function createParticleGroup(x, y, options = {}) {
      if (!state.particleSystem || !Physics.b2ParticleDef) {
        return null;
      }

      const b2 = Physics.b2;
      const type = options.type ?? 'water';
      const groupRadius = options.radius ?? 0.5;  // Area to fill with particles

      // Determine flags based on type
      let flags = Physics.b2_waterParticle;
      switch (type) {
        case 'water':
          flags = Physics.b2_waterParticle;
          break;
        case 'oil':
        case 'honey':
          flags = Physics.b2_viscousParticle;
          break;
        case 'elastic':
        case 'jelly':
          flags = Physics.b2_elasticParticle;
          break;
        case 'spring':
          flags = Physics.b2_springParticle;
          break;
        case 'powder':
        case 'dirt':
        case 'sand':
          flags = Physics.b2_powderParticle;
          break;
        case 'acid':
          flags = Physics.b2_waterParticle | Physics.b2_colorMixingParticle;
          break;
        case 'lava':
          flags = Physics.b2_viscousParticle;
          break;
        case 'fog':
          flags = Physics.b2_waterParticle;
          break;
      }

      // Color
      const color = options.color ?? liquidDream.colors[type] ?? liquidDream.colors.water;

      // Velocity
      const velX = options.velocity?.x ?? 0;
      const velY = options.velocity?.y ?? 0;

      // Select target system
      const targetSystem = state.particleSystemA;

      if (!targetSystem) return null;

      // Calculate grid bounds (square matrix around center)
      const halfSize = groupRadius;
      const startX = x - halfSize;
      const startY = y - halfSize;
      const endX = x + halfSize;
      const endY = y + halfSize;

      // Create particle definition (reuse for all particles)
      const pd = new Physics.b2ParticleDef();
      pd.set_flags(flags);
      if (pd.get_color) {
        const c = pd.get_color();
        c.Set(color.r, color.g, color.b, color.a);
      }

      const startIndex = targetSystem.GetParticleCount();

      // Один постоянный Vec2 для позиции и скорости — не destroy между итерациями.
      // Переиспользование pd с destroy(pos) между итерациями давало race на WASM-указателях.
      const posVec = new Physics.b2Vec2(0, 0);
      const velVec = (velX || velY) ? new Physics.b2Vec2(velX, velY) : null;

      if (velVec) pd.set_velocity(velVec);

      // Place particles on grid
      for (let py = startY; py <= endY; py += PARTICLE_GRID_STEP) {
        for (let px = startX; px <= endX; px += PARTICLE_GRID_STEP) {
          const dx = px - x;
          const dy = py - y;
          if (dx * dx + dy * dy > halfSize * halfSize) continue;

          posVec.Set(px, py);
          pd.set_position(posVec);
          targetSystem.CreateParticle(pd);
        }
      }

      // Освободить после всех CreateParticle
      b2.destroy(posVec);
      if (velVec) b2.destroy(velVec);

      const endIndex = targetSystem.GetParticleCount();
      b2.destroy(pd);

      // Store group info
      liquidDream.particleGroups.push({
        group: null, type, startIndex, endIndex,
        weight: liquidDream.weight[type] ?? 1,
        createdAt: performance.now(),
        system: 'A',
        // Цвет частиц: текущий, целевой, прогресс lerp и очередь
        currentColor: { ...color },   // {r,g,b,a} — живой цвет группы
        targetColor:  null,           // null = нет активного перехода
        colorT:       1.0,            // 1.0 = переход завершён
      });

      // System B и барьеры удалены — газы будут решены через LiquidFun flags

      return { startIndex, endIndex };
    }

    // PARTICLE COLOR TRANSITIONS

    // Сменить целевой цвет группы.
    // Если идёт переход A→B и пришёл C:
    //   currentColor фиксируется в точке AB (текущий lerp),
    //   colorT сбрасывается в 0, новый переход AB→C стартует немедленно.
    // Очередь не нужна — C всегда вытесняет B на месте.
    function particleGroupSetColor(pg, targetColor) {
      if (pg.colorT < 1.0) {
        // Зафиксировать текущую точку lerp как новый origin
        const t = pg.colorT, s = 1 - t;
        pg.currentColor = {
          r: Math.round(pg.currentColor.r * s + pg.targetColor.r * t),
          g: Math.round(pg.currentColor.g * s + pg.targetColor.g * t),
          b: Math.round(pg.currentColor.b * s + pg.targetColor.b * t),
          a: Math.round(pg.currentColor.a * s + pg.targetColor.a * t)
        };
      }
      pg.targetColor = { ...targetColor };
      pg.colorT = 0.0;

    // Продвинуть все активные color-переходы на dt секунд.
    // Вызывается из physics loop.
    // speed: 1.0 = полный переход за ~1 секунду.
    const PARTICLE_COLOR_SPEED = 1.5;

    function stepParticleColorTransitions(dt) {
      const b2 = Physics.b2;
      const HEAPU8 = b2?.HEAPU8;
      const getPointer = Physics.getPointer || b2?.getPointer;
      if (!HEAPU8 || !getPointer || !state.particleSystemA) return;

      const colorBuffer = state.particleSystemA.GetColorBuffer();
      if (!colorBuffer) return;
      const col_p = getPointer(colorBuffer);

      for (const pg of liquidDream.particleGroups) {
        if (!pg.targetColor || pg.colorT >= 1.0) continue;

        pg.colorT = Math.min(1.0, pg.colorT + dt * PARTICLE_COLOR_SPEED);
        const t = pg.colorT;
        const s = 1 - t;

        const r = Math.round(pg.currentColor.r * s + pg.targetColor.r * t);
        const g = Math.round(pg.currentColor.g * s + pg.targetColor.g * t);
        const b = Math.round(pg.currentColor.b * s + pg.targetColor.b * t);
        const a = Math.round(pg.currentColor.a * s + pg.targetColor.a * t);

        // Записать интерполированный цвет в HEAPU8 буфер для всех частиц группы
        for (let i = pg.startIndex; i < pg.endIndex; i++) {
          const off = col_p + i * 4;
          HEAPU8[off]     = r;
          HEAPU8[off + 1] = g;
          HEAPU8[off + 2] = b;
          HEAPU8[off + 3] = a;
        }

        if (pg.colorT >= 1.0) {
          // Переход завершён — зафиксировать цвет
          pg.currentColor = { r, g, b, a };
          pg.targetColor  = null;

          // Есть следующий в очереди — запустить

        }
      }
    }

    // JOINT CREATION HELPERS

    // Joint creation using BuhJIR/liquidfun API (property-based, not set_* methods)
    // https://cdn.jsdelivr.net/gh/BuhJIR/liquidfun@09dd68d/liquidfun.js

    function createRevoluteJoint(world, bodyA, bodyB, anchorA, anchorB, options = {}) {
      if (!Physics.b2RevoluteJointDef) return null;
      const jd = new Physics.b2RevoluteJointDef();

      // Copy local anchor values for storage
      const localAnchorACopy = { x: anchorA.get_x(), y: anchorA.get_y() };
      const localAnchorBCopy = { x: anchorB.get_x(), y: anchorB.get_y() };

      // Calculate world anchor (use anchor on bodyA by default for revolute)
      const worldAnchor = bodyA.GetWorldPoint(anchorA);

      let joint = null;

      // Try Initialize method first (common Box2D/LiquidFun pattern)
      if (typeof jd.Initialize === 'function') {
        jd.Initialize(bodyA, bodyB, worldAnchor);
        // Set additional options via set_* if available
        if (typeof jd.set_enableMotor === 'function') {
          jd.set_enableMotor(options.enableMotor ?? false);
          jd.set_motorSpeed(options.motorSpeed ?? 0);
          jd.set_maxMotorTorque(options.maxMotorTorque ?? 0);
          jd.set_enableLimit(options.enableLimit ?? false);
          jd.set_lowerAngle(options.lowerAngle ?? 0);
          jd.set_upperAngle(options.upperAngle ?? 0);
          jd.set_collideConnected(options.collideConnected ?? false);
        }
        joint = world.CreateJoint(jd);
      }
      // Try Emscripten set_* API (liquidfun-wasm@7.0.0)
      else if (typeof jd.set_bodyA === 'function') {
        jd.set_bodyA(bodyA);
        jd.set_bodyB(bodyB);
        jd.set_localAnchorA(anchorA);
        jd.set_localAnchorB(anchorB);
        jd.set_enableMotor(options.enableMotor ?? false);
        jd.set_motorSpeed(options.motorSpeed ?? 0);
        jd.set_maxMotorTorque(options.maxMotorTorque ?? 0);
        jd.set_enableLimit(options.enableLimit ?? false);
        jd.set_lowerAngle(options.lowerAngle ?? 0);
        jd.set_upperAngle(options.upperAngle ?? 0);
        jd.set_collideConnected(options.collideConnected ?? false);
        joint = world.CreateJoint(jd);
      }
      // Fallback: property-based API (BuhJIR style)
      else if (typeof jd.Create === 'function') {
        jd.bodyA = bodyA;
        jd.bodyB = bodyB;
        jd.localAnchorA.x = anchorA.x ?? anchorA.get_x();
        jd.localAnchorA.y = anchorA.y ?? anchorA.get_y();
        jd.localAnchorB.x = anchorB.x ?? anchorB.get_x();
        jd.localAnchorB.y = anchorB.y ?? anchorB.get_y();
        jd.enableMotor = options.enableMotor ?? false;
        jd.motorSpeed = options.motorSpeed ?? 0;
        jd.maxMotorTorque = options.maxMotorTorque ?? 0;
        jd.enableLimit = options.enableLimit ?? false;
        jd.lowerAngle = options.lowerAngle ?? 0;
        jd.upperAngle = options.upperAngle ?? 0;
        jd.collideConnected = options.collideConnected ?? false;
        joint = jd.Create(world);
      }

      if (!joint) {
        
        return null;
      }

      // Store joint data for debug draw
      state.joints.push({
        joint,
        type: 'revolute',
        bodyA,
        bodyB,
        localAnchorA: localAnchorACopy,
        localAnchorB: localAnchorBCopy
      });

      return joint;
    }

    // anchorA, anchorB are LOCAL coordinates relative to each body
    function createDistanceJoint(world, bodyA, bodyB, anchorA, anchorB, options = {}) {
      if (!Physics.b2DistanceJointDef) {
        
        return null;
      }
      const jd = new Physics.b2DistanceJointDef();

      // IMPORTANT: Copy local anchor values before they get overwritten by vec pool
      const localAnchorACopy = { x: anchorA.get_x(), y: anchorA.get_y() };
      const localAnchorBCopy = { x: anchorB.get_x(), y: anchorB.get_y() };

      // Convert local anchors to world positions for Initialize
      // CRITICAL: Copy values immediately after each GetWorldPoint call!
      const worldAnchorA = bodyA.GetWorldPoint(anchorA);
      const waX = worldAnchorA.get_x();
      const waY = worldAnchorA.get_y();

      const worldAnchorB = bodyB.GetWorldPoint(anchorB);
      const wbX = worldAnchorB.get_x();
      const wbY = worldAnchorB.get_y();

      // Create fresh b2Vec2 for Initialize (avoid pool issues)
      const initAnchorA = new Physics.b2Vec2(waX, waY);
      const initAnchorB = new Physics.b2Vec2(wbX, wbY);

      // Use Initialize with fresh vectors
      if (typeof jd.Initialize === 'function') {
        jd.Initialize(bodyA, bodyB, initAnchorA, initAnchorB);

        // Box2D 2.4+ uses stiffness/damping instead of frequencyHz/dampingRatio
        if (typeof jd.set_stiffness === 'function') {

          // For rigid distance joint, use high stiffness
          const stiffness = options.stiffness ?? 0; // 0 = rigid
          const damping = options.damping ?? 0;
          jd.set_stiffness(stiffness);
          jd.set_damping(damping);
        }

        if (typeof jd.set_collideConnected === 'function') {
          jd.set_collideConnected(options.collideConnected ?? true);
        }

        const joint = world.CreateJoint(jd);

        // Store joint data for debug draw
        state.joints.push({
          joint,
          type: 'distance',
          bodyA,
          bodyB,
          localAnchorA: localAnchorACopy,
          localAnchorB: localAnchorBCopy
        });

        // Clean up temp vectors
        Physics.destroy?.(initAnchorA);
        Physics.destroy?.(initAnchorB);

        return joint;
      }

      
      return null;
    }

    const DRAG_THRESHOLD = 5;

    // ═══════════════════════════════════════════════════════════════════════
    // NEW OOP ARCHITECTURE (PHASE 1)
    // ═══════════════════════════════════════════════════════════════════════

    class ZdogRenderer {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d', { alpha: true });
        
        // Root anchor for camera transforms
        this.illo = new Zdog.Anchor();
        
        // Object Pools
        // Configuration
        this.config = {
          scale: 20 // pixels per meter (base tile size)
        };

        this.viewport = { minX: -Infinity, maxX: Infinity, minY: -Infinity, maxY: Infinity };
        this.initialized = false;
      }

      init() {
        if (this.initialized) return;
        // Пул анонимных шейпов удалён — используется именованный пул (allocShape).
        // Каждый физический объект владеет своим Zdog-шейпом напрямую.
        this.initialized = true;
      }

      // ─── Именованный пул: shape закреплён за объектом навсегда ───

      allocShape(obj, type) {
        // Не создавать дважды
        if (obj._zdogShape) return obj._zdogShape;

        let shape;
        if (type === 'light') {
          shape = new Zdog.Shape({ stroke: 10, color: '#fff' });
        } else if (type === 'debris') {
          // Дебрис: геометрия пишется один раз здесь
          if (obj.verts && obj.verts.length >= 3) {
            // scaledTileSize неизвестен на момент alloc — запишем в updatePath
            shape = new Zdog.Shape({
              path: obj.verts.map(v => ({ x: v.x, y: -v.y })),
              closed: true, stroke: 2, fill: true
            });
          } else {
            shape = new Zdog.Shape({ path: [{x:0,y:0}], stroke: 2, fill: true, closed: true });
          }
          shape._debrisVertsRaw = obj.verts || null;
          shape._geoScale = 0; // помечаем как «не масштабирован»
        } else {
          // Block: polygon или box
          if (obj.multiVerts && Array.isArray(obj.multiVerts)) {
            // NEW: Multi-piece block (from COMBINE)
            shape = new Zdog.Group();
            shape._isMulti = true;
            obj.multiVerts.forEach(piece => {
              const s = new Zdog.Shape({
                addTo: shape,
                path: [{x:0,y:0}], // will be scaled in render()
                closed: true, stroke: 1, fill: true
              });
              s._pieceVertsNorm = piece;
            });
            shape._geoScale = 0;
          } else if (obj.vertices && obj.vertices.length >= 3) {
            shape = new Zdog.Shape({
              path: [{x:0,y:0}], closed: true, stroke: 1, fill: true
            });
            shape._blockVertsNorm = obj.vertices; // нормализованные (-0.5..0.5)
            shape._geoScale = 0; // не масштабирован ещё
          } else {
            // box fallback
            shape = new Zdog.Rect({ width: 10, height: 10, stroke: 1, fill: true });
            shape._isBox = true;
            shape._geoScale = 0;
          }
        }

        obj._zdogShape = shape;
        obj._colorDirty = true; // первый кадр всегда пишет цвет
        return shape;
      }

      freeShape(obj) {
        if (!obj._zdogShape) return;
        // Убрать из сцены на случай если ещё там
        const idx = this.illo.children.indexOf(obj._zdogShape);
        if (idx !== -1) this.illo.children.splice(idx, 1);
        obj._zdogShape = null;
      }

      freeAll() {
        this.illo.children.length = 0;
        // Объекты сами держат ссылки — GC подберёт когда state.blocks очистится
      }

      updateCamera(panX, panY, zoom, rotationAngle) {
        if (!this.initialized) return;

        const dpr = window.devicePixelRatio || 1;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const scale = this.config.scale * zoom;

        // Update root anchor
        this.illo.translate.x = w / 2;
        this.illo.translate.y = h / 2;
        this.illo.rotate.z = rotationAngle;
        
        // --- Viewport Culling Calculation ---
        // Safety margin for culling (meters)
        const margin = 5; 
        
        // View dimensions in meters (half-width/height)
        const viewHalfW = (w / 2) / scale;
        const viewHalfH = (h / 2) / scale;

        // Camera position in world meters (inverted pan)
        const camX = -panX / scale; 
        const camY = panY / scale; 

        // Simple AABB Culling
        this.viewport.minX = camX - viewHalfW - margin;
        this.viewport.maxX = camX + viewHalfW + margin;
        this.viewport.minY = camY - viewHalfH - margin;
        this.viewport.maxY = camY + viewHalfH + margin;
        
        // Rotation safety: if rotated, assume worst case (diagonal)
        if (rotationAngle !== 0) {
            const diag = Math.sqrt(viewHalfW*viewHalfW + viewHalfH*viewHalfH) + margin;
            this.viewport.minX = camX - diag;
            this.viewport.maxX = camX + diag;
            this.viewport.minY = camY - diag;
            this.viewport.maxY = camY + diag;
        }
      }

      render(stateData, globals) {
        if (!this.initialized) this.init();

        const { blocks, lights, debris } = stateData;
        const { panX, panY, zoom, rotationAngle, scaledTileSize } = globals;
        const dpr = window.devicePixelRatio || 1;

        this.illo.children.length = 0;

        const minX = this.viewport.minX, maxX = this.viewport.maxX;

            x = pos.get_x(); y = pos.get_y(); angle = block.body.GetAngle();

          const x = pos.get_x(), y = pos.get_y();
          if (x < minX - lightMargin || x > maxX + lightMargin ||

          const shape = light._zdogShape || this.allocShape(light, 'light');

          shape.translate.y = -y * scaledTileSize + panY * dpr;
          shape.updatePath();
          shape.parent = this.illo;
          this.illo.children.push(shape);

          shape.translate.y = -y * scaledTileSize + panY * dpr;

          shape.parent = this.illo;
          this.illo.children.push(shape);

      for (let i = 0; i < count; i++) {

        const wx = HEAPF32[offset];
        const wy = HEAPF32[offset + 1];

        let ry = -wy * scaledTileSize + panYDpr;

          ry = rotY;

        particleScreenBuffer[i * 2 + 1] = cy + ry;

    function renderSpotlightGL(light) {
      if (!gl || !glPrograms.spotlight) return;

      const program = glPrograms.spotlight;
      const buffers = glBuffers.spotlight;
      const glCanvas = glBuffers.canvas;

      gl.useProgram(program);
      gl.bindVertexArray(buffers.vao);

      // Convert light position to UV space (0-1)
      const dpr = window.devicePixelRatio || 1;
      const screen = worldToScreen(light.x, light.y);
      const uvX = screen.x / glCanvas.width;
      const uvY = screen.y / glCanvas.height;

      // Light direction (normalized)
      const dirX = Math.cos(light.angle);
      const dirY = -Math.sin(light.angle);  // Flip Y for screen coords

      // FOV to cos limits
      const halfFov = (light.fov || 45) * Math.PI / 180 / 2;
      const innerLimit = Math.cos(halfFov * 0.8);
      const outerLimit = Math.cos(halfFov);

      // Max distance in UV space
      const maxDistPx = (light.distance || 10) * scaledTileSize;
      const maxDistUV = maxDistPx / Math.max(glCanvas.width, glCanvas.height);

      // Light color
      const color = light.color || [255, 255, 200];
      const r = color[0] / 255;
      const g = color[1] / 255;
      const b = color[2] / 255;

      // Set uniforms
      gl.uniform2f(buffers.uniforms.lightPos, uvX, uvY);
      gl.uniform2f(buffers.uniforms.lightDir, dirX, dirY);
      gl.uniform1f(buffers.uniforms.innerLimit, innerLimit);
      gl.uniform1f(buffers.uniforms.outerLimit, outerLimit);
      gl.uniform1f(buffers.uniforms.maxDist, maxDistUV);
      gl.uniform3f(buffers.uniforms.lightColor, r, g, b);

      // Additive blending for lights
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

      gl.drawArrays(gl.TRIANGLES, 0, 6);

      // Restore normal blending
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      gl.bindVertexArray(null);

        const path = `${this.git.paths[category] || category}/${filename}`;
        const url = `https://api.github.com/repos/${this.git.owner}/${this.git.repo}/contents/${path}`;
        const body = {
          message: `[DreamEngine] Save ${filename}`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
        };
        if (sha) body.sha = sha; // Required for updating existing file

        try {
          const res = await fetch(url, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${this.git.token}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error(`GitHub: ${res.status}`);
          const data = await res.json();
          console.log(`[DreamPlugins] Saved: ${path}`);
          return { success: true, sha: data.content.sha };
        } catch (e) {
          console.error(`[DreamPlugins] Save error:`, e);
          return { success: false, error: e.message };
        }
      },

      async listFromGit(category) {
        const path = this.git.paths[category] || category;
        const url = `https://api.github.com/repos/${this.git.owner}/${this.git.repo}/contents/${path}`;
        try {
          const res = await fetch(url, {
            headers: {
              'Authorization': `token ${this.git.token}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });
          if (!res.ok) throw new Error(`GitHub: ${res.status}`);
          const data = await res.json();
          return data.filter(f => f.name.endsWith('.json')).map(f => f.name);

      // ─── Load Plugin from Git ─────────────────────────────────────────────

      async loadFromGit(pluginName) {
        const filename = pluginName.endsWith('.json') ? pluginName : `${pluginName}.json`;
        const result = await this.fetchFromGit('plugins', filename);
        if (result && result.content) {
          return this.load(result.content);
        }
        return false;
      },

      // ─── Plugin Loader ────────────────────────────────────────────────────

      // Load a plugin from JSON object
      // Plugin format: { name, style?, js?, ui?, update?, render?, save?, load? }
      load(plugin) {
        const name = plugin.name || 'unnamed';
        console.log(`[DreamPlugins] Loading: ${name}`);

        // STYLE - inject CSS
        if (plugin.style) {
          const style = document.createElement('style');
          style.textContent = `/* Plugin: ${name} */\n${plugin.style}`;
          document.head.appendChild(style);
        }

        // UI - inject HTML into plugin container
        if (plugin.ui) {
          const container = document.getElementById('dream-plugin-ui');
          if (container) {
            const div = document.createElement('div');
            div.className = 'dream-plugin';
            div.dataset.plugin = name;
            div.innerHTML = plugin.ui;
            container.appendChild(div);
          }
        }

        // JS - execute once (has access to all engine globals)
        if (plugin.js) {
          try {
            const fn = new Function(plugin.js);
            fn();
          } catch (e) { console.error(`[DreamPlugins] JS error in ${name}:`, e); }
        }

        // UPDATE - add to physics loop
        if (plugin.update) {
          try {
            const fn = new Function('delta', plugin.update);
            this.updateFuncs.push({ name, fn });
          } catch (e) { console.error(`[DreamPlugins] UPDATE error in ${name}:`, e); }
        }

        // RENDER - add to render loop
        if (plugin.render) {
          try {
            const fn = new Function('ctx', plugin.render);
            this.renderFuncs.push({ name, fn });
          } catch (e) { console.error(`[DreamPlugins] RENDER error in ${name}:`, e); }
        }

        // SAVE - add data to scene serialization
        if (plugin.save) {
          try {
            const fn = new Function('sceneData', plugin.save);
            this.saveFuncs.push({ name, fn });
          } catch (e) { console.error(`[DreamPlugins] SAVE error in ${name}:`, e); }
        }

        // LOAD - restore data from scene
        if (plugin.load) {
          try {
            const fn = new Function('sceneData', plugin.load);
            this.loadFuncs.push({ name, fn });
          } catch (e) { console.error(`[DreamPlugins] LOAD error in ${name}:`, e); }
        }

        this.loaded.push(name);
        console.log(`[DreamPlugins] Loaded: ${name}`);
        return true;
      },

      // Run all update functions (called from physics loop)
      runUpdate(delta) {
        for (const { name, fn } of this.updateFuncs) {

        }

        }

        }

    function initAudioContext() {
      if (audioContext) return;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        globalCompressor = audioContext.createDynamicsCompressor();
        globalCompressor.threshold.value = -24;
        globalCompressor.knee.value = 30;
        globalCompressor.ratio.value = 12;
        globalCompressor.attack.value = 0.003;
        globalCompressor.release.value = 0.25;

        globalReverb = audioContext.createConvolver();
        const reverbGain = audioContext.createGain();
        reverbGain.gain.value = 0.12;

        const sampleRate = audioContext.sampleRate;
        const length = sampleRate * 2;
        const impulse = audioContext.createBuffer(2, length, sampleRate);
        const impulseL = impulse.getChannelData(0);
        const impulseR = impulse.getChannelData(1);

        for (let i = 0; i < length; i++) {
          const decay = Math.exp(-i / (sampleRate * 0.5));
          impulseL[i] = (Math.random() * 2 - 1) * decay;
          impulseR[i] = (Math.random() * 2 - 1) * decay;
        }
        globalReverb.buffer = impulse;

        masterGain = audioContext.createGain();
        masterGain.gain.value = 1.0;

        globalReverb.connect(reverbGain);
        reverbGain.connect(globalCompressor);
        globalCompressor.connect(masterGain);
        masterGain.connect(audioContext.destination);
      } catch (err) {
        
      }
    }

    async function decodeAudioData(base64Data) {
      if (!audioContext) initAudioContext();
      if (audioBufferCache[base64Data]) return audioBufferCache[base64Data];
      try {
        const response = await fetch(base64Data);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBufferCache[base64Data] = audioBuffer;
        return audioBuffer;
      } catch (err) {
        
        return null;
      }
    }

        const source = audioContext.createBufferSource();

        const gainNode = audioContext.createGain();

        gainNode.connect(globalReverb);

    // Calculate polygon centroid (center of mass) using signed area method
    function calculatePolygonCentroid(vertices) {
      let signedArea = 0;
      let cx = 0;
      let cy = 0;

      const n = vertices.length;
      for (let i = 0; i < n; i++) {
        const x0 = vertices[i].x;
        const y0 = vertices[i].y;
        const x1 = vertices[(i + 1) % n].x;
        const y1 = vertices[(i + 1) % n].y;

        const a = x0 * y1 - x1 * y0;
        signedArea += a;
        cx += (x0 + x1) * a;
        cy += (y0 + y1) * a;
      }

      signedArea *= 0.5;
      if (Math.abs(signedArea) < 1e-10) {
        // Fallback to simple average for degenerate polygons
        let avgX = 0, avgY = 0;
        vertices.forEach(v => { avgX += v.x; avgY += v.y; });
        return { x: avgX / n, y: avgY / n };
      }

      cx /= (6 * signedArea);
      cy /= (6 * signedArea);
      return { x: cx, y: cy };
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? [
        parseInt(result[1], 16),
        parseInt(result[2], 16),
        parseInt(result[3], 16)
      ] : [255, 255, 255];
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(x => {
        const hex = Math.round(x).toString(16);
        return hex.length === 1 ? '0' + hex : hex;
      }).join('');
    }

    // Cache for adjusted brightness colors (avoid hex parsing each frame)
    const _brightnessCache = new Map();

    function adjustBrightness(hex, percent) {
      const key = hex + '|' + percent;
      let result = _brightnessCache.get(key);
      if (result) return result;

      const rgb = hexToRgb(hex);
      const adj = 255 * percent / 100;
      result = rgbToHex(
        Math.max(0, Math.min(255, rgb[0] + adj)),
        Math.max(0, Math.min(255, rgb[1] + adj)),
        Math.max(0, Math.min(255, rgb[2] + adj))
      );
      _brightnessCache.set(key, result);
      return result;
    }

    function worldToScreen(wx, wy) {
      const dpr = window.devicePixelRatio || 1;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // World to camera-relative position
      let rx = (wx * scaledTileSize) + panX * dpr;
      let ry = -(wy * scaledTileSize) + panY * dpr;

      // Apply camera rotation around screen center
      if (rotationAngle !== 0) {
        const cos = Math.cos(rotationAngle);
        const sin = Math.sin(rotationAngle);
        const rotX = rx * cos - ry * sin;
        const rotY = rx * sin + ry * cos;
        rx = rotX;
        ry = rotY;
      }

      _screenCoord.x = cx + rx;
      _screenCoord.y = cy + ry;
      return _screenCoord;
    }

    // Version that returns new object (for cases where you need to store the result)
    function worldToScreenNew(wx, wy) {
      const dpr = window.devicePixelRatio || 1;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // World to camera-relative position
      let rx = (wx * scaledTileSize) + panX * dpr;
      let ry = -(wy * scaledTileSize) + panY * dpr;

      // Apply camera rotation around screen center
      if (rotationAngle !== 0) {
        const cos = Math.cos(rotationAngle);
        const sin = Math.sin(rotationAngle);
        const rotX = rx * cos - ry * sin;
        const rotY = rx * sin + ry * cos;
        rx = rotX;
        ry = rotY;
      }

      return { x: cx + rx, y: cy + ry };
    }

    function screenToWorld(sx, sy) {
      const dpr = window.devicePixelRatio || 1;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Screen to camera-relative
      let rx = sx - cx;
      let ry = sy - cy;

      // Reverse camera rotation
      if (rotationAngle !== 0) {
        const cos = Math.cos(-rotationAngle);
        const sin = Math.sin(-rotationAngle);
        const rotX = rx * cos - ry * sin;
        const rotY = rx * sin + ry * cos;
        rx = rotX;
        ry = rotY;
      }

      return {
        wx: (rx - panX * dpr) / scaledTileSize,
        wy: -(ry - panY * dpr) / scaledTileSize
      };
    }

    function pointerToWorld(e) {

      const cssY = e.clientY - rect.top;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const canvasX = cssX * scaleX;
      const canvasY = cssY * scaleY;
      const world = screenToWorld(canvasX, canvasY);
      return { wx: world.wx, wy: world.wy, cssX, cssY };

    function resizeCanvas() {
